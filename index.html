// Builds one rep's call list for a period, merging real disposition-tagged
// calls made against leads (always Outbound / Lead Call) with any manually
// logged calls (inbound, internal, or other — not tied to a specific lead).
function buildCallList(repIdentity, period){
  const wantedKey = repIdentityKey(repIdentity);
  const rows = [];
  orgFiltered(DB.leads).forEach(lead=>{
    (lead.comments||[]).forEach(c=>{
      if(!c.disposition) return;
      if(repIdentityKey(c.author) !== wantedKey) return;
      if(!inPeriod(c.ts, period)) return;
      rows.push({
        ts: c.ts, direction:'Outbound', type:'Lead Call',
        relatedTo: lead.name + (lead.company?' ('+lead.company+')':''),
        phone: lead.phone||'', disposition: DISPOSITION_MAP[c.disposition]?DISPOSITION_MAP[c.disposition].label:c.disposition,
        durationSeconds: c.durationSeconds||0, notes: '',
      });
    });
  });
  orgFiltered(DB.calllog).forEach(e=>{
    if(repIdentityKey(e.repName) !== wantedKey) return;
    if(!inPeriod(e.createdAt, period)) return;
    rows.push({
      ts: e.createdAt, direction: e.direction, type: e.callType,
      relatedTo: e.relatedTo||'', phone: e.phone||'', disposition: e.disposition||'',
      durationSeconds: Number(e.durationSeconds)||0, notes: e.notes||'',
    });
  });
  return rows.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
}

      <tbody>
        ${rows.length===0 ? `<tr class="empty-row"><td colspan="8">No calls logged for this period.</td></tr>` :
        rows.map((r,i)=>`
          <tr>
            <td>${i+1}</td>
            <td>${fmtDateTime(r.ts)}</td>
            <td>${esc(r.direction)}</td>
            <td>${esc(r.type)}</td>
            <td>${esc(r.relatedTo)||'\u2014'}</td>
            <td>${formatPhone(r.phone)||'\u2014'}</td>
            <td>${esc(r.disposition)||'\u2014'}</td>
            <td>${r.durationSeconds?formatDuration(r.durationSeconds):'\u2014'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function downloadCallListCSV(repName, period, rows){
  const header = ['#','Date/Time','Direction','Type','Related To','Phone','Disposition','Duration (sec)'];
  const csvRows = [header.join(',')].concat(rows.map((r,i)=>[
    i+1, fmtDateTime(r.ts), r.direction, r.type, r.relatedTo, r.phone, r.disposition, r.durationSeconds
  ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')));
  const csv = csvRows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `call-list_${repName.replace(/\s+/g,'-')}_${period}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Opens the given HTML in a hidden iframe and triggers the browser's native
// print dialog — the person picks "Save as PDF" as the destination there,
// which is exactly what "load as a PDF" means without needing a PDF library.
function printHtmlDocument(html){
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0'; iframe.style.bottom = '0';
  iframe.style.width = '0'; iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  iframe.onload = () => {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => document.body.removeChild(iframe), 1000);
  };
}

const LEAD_ASSIGNMENT_TARGET = 100;

/* ------------------------------ Master Leads engine ------------------------------ */

// "Consistent outbound call workflows" pool: the top N reps by calls logged
// in the last 7 days — an activity proxy, since who's actively dialing is
// the relevant signal for who should get more leads (not funded-volume
// rank, which lags activity by weeks).
function computeActiveCallerPool(){
  const reps = computeRepKPIs('week');
  const unavailableKeys = new Set((DB.reps||[]).filter(r=>r.unavailable).map(r=>String(r.repNumber)));
  return reps.slice()
    .filter(r=>!unavailableKeys.has(String(r.key)))
    .sort((a,b)=>b.callsLogged-a.callsLogged)
    .filter(r=>r.callsLogged>0)
    .slice(0, ROUND_ROBIN_POOL_SIZE);
}

// Deterministic round-robin with no separate pointer to store: the index
// is derived from how many auto-reassignments have happened so far (from
// the reconciliation log itself), so it's stateless and always consistent
// between the client's "Run Check Now" and the Apps Script trigger.
function pickRoundRobinRep(pool){
  if(!pool.length) return null;
  const priorAutoAssigns = (DB.assignmentlog||[]).filter(e=>e.type==='auto_reassigned').length;
  return pool[priorAutoAssigns % pool.length];
}

function logAssignmentMovement(lead, type, fromRep, toRep, reason){
  DB.assignmentlog.push({
    id: nextId(), createdAt: new Date().toISOString(),
    leadId: lead.id, leadName: lead.name, type, fromRep: fromRep||'', toRep: toRep||'', reason: reason||'', org: lead.org,
  });
}

function revertLeadToMaster(lead, type, reason){
  const fromRep = lead.assignedTo;
  logAssignmentMovement(lead, type, fromRep, '', reason);
  lead.assignedTo = '';
  lead.assignedByRepNumber = '';
  lead.assignedAt = '';
  lead.lastTouchedAt = '';
  lead.archived = false;
  lead.archivedAt = '';
}

function autoReassignFromMaster(lead, reason){
  const pool = computeActiveCallerPool();
  const rep = pickRoundRobinRep(pool);
  if(!rep) return false; // no qualifying reps — lead stays in Master, unassigned
  lead.assignedTo = String(rep.key);
  lead.assignedByRepNumber = 'AUTO';
  lead.assignedAt = new Date().toISOString();
  lead.lastTouchedAt = '';
  logAssignmentMovement(lead, 'auto_reassigned', '', rep.key, reason);
  return true;
}

// Manual assignment — a Super Admin picks a specific rep directly, the
// deliberate counterpart to the automatic Round-Robin Assign action. Works
// for both unassigned leads and reassigning a lead that's already held by
// someone else.
function manuallyAssignLead(lead, repNumber, reason){
  const fromRep = lead.assignedTo;
  lead.assignedTo = String(repNumber);
  lead.assignedByRepNumber = currentRep ? String(currentRep.repNumber) : '';
  lead.assignedAt = new Date().toISOString();
  lead.lastTouchedAt = '';
  logAssignmentMovement(lead, 'manual_assigned', fromRep, String(repNumber), reason || 'Manually assigned from Master Leads List');
}

// The SLA sweep: reverts untouched-in-72-business-hours assigned leads back
// to Master and immediately round-robins them to an active caller; reverts
// archived-past-30-business-days leads back to Master (no auto-reassign —
// matches the spec, which only calls for round-robin on the touch SLA).
// Safe to run repeatedly — each lead only moves once per pass.
function runMasterLeadsSLASweep(){
  const leads = orgFiltered(DB.leads);
  let reverted72=0, reassigned=0, archiveExpired=0;
  const now = new Date().toISOString();
  leads.forEach(l=>{
    if(l.assignedTo && !l.archived){
      const since = l.lastTouchedAt || l.assignedAt;
      if(since && businessHoursElapsed(since, now) >= TOUCH_SLA_BUSINESS_HOURS){
        revertLeadToMaster(l, 'reverted_72h_no_touch', `No activity for ${TOUCH_SLA_BUSINESS_HOURS} business hours`);
        reverted72++;
        if(autoReassignFromMaster(l, 'Round-robin reassignment after 72-business-hour SLA')) reassigned++;
      }
    } else if(l.archived && l.archivedAt){
      if(businessDaysElapsed(l.archivedAt, now) >= ARCHIVE_HOLD_BUSINESS_DAYS){
        revertLeadToMaster(l, 'archive_expired', `Archived hold of ${ARCHIVE_HOLD_BUSINESS_DAYS} business days expired`);
        archiveExpired++;
      }
    }
  });
  if(reverted72 || archiveExpired) queueSave();
  return { reverted72, reassigned, archiveExpired };
}

function computeAssignmentCounts(){
  const leads = orgFiltered(DB.leads);
  const reps = (DB.reps||[]).slice().sort((a,b)=>a.repNumber-b.repNumber);
  const counts = {};
  reps.forEach(r=>{ counts[String(r.repNumber)] = 0; });
  let unassigned = 0;
  leads.forEach(l=>{
    const key = repIdentityKey(l.assignedTo);
    if(key && counts[key]!==undefined) counts[key]++;
    else unassigned++;
  });
  return { reps, counts, unassigned, totalLeads: leads.length };
}

function openAutoAssignModal(){
  const { reps, counts, unassigned } = computeAssignmentCounts();
  const needy = reps.map(r=>({ rep:r, need: Math.max(0, LEAD_ASSIGNMENT_TARGET - (counts[String(r.repNumber)]||0)) })).filter(x=>x.need>0);
  if(needy.length===0){ toast('Every rep is already at or above the target \u2014 nothing to assign.'); return; }
  if(unassigned===0){ toast('No unassigned leads available to distribute.', true); return; }

  const plan = {}; needy.forEach(x=>{ plan[x.rep.repNumber] = 0; });
  let remaining = unassigned;
  const stillNeedy = needy.map(x=>({ rep:x.rep, need:x.need }));
  while(remaining>0 && stillNeedy.some(x=>x.need>0)){
    for(const x of stillNeedy){
      if(remaining<=0) break;
      if(x.need>0){ plan[x.rep.repNumber]++; x.need--; remaining--; }
    }
  }
  const planRows = needy.filter(x=>plan[x.rep.repNumber]>0);
  const totalPlanned = planRows.reduce((s,r)=>s+plan[r.rep.repNumber],0);

  openModal('Auto-Assign Unassigned Leads', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">Distributes ${totalPlanned} of ${unassigned} unassigned lead(s) round-robin to reps below the ${LEAD_ASSIGNMENT_TARGET}-lead target.${unassigned<needy.reduce((s,x)=>s+x.need,0) ? ' Not enough unassigned leads to bring everyone fully to target \u2014 split as evenly as possible.' : ''}</p>
    <table><thead><tr><th>Rep</th><th>Current</th><th>Will Receive</th><th>New Total</th></tr></thead>
    <tbody>${planRows.map(x=>`<tr><td>${esc(x.rep.name)}</td><td>${counts[String(x.rep.repNumber)]||0}</td><td>+${plan[x.rep.repNumber]}</td><td>${(counts[String(x.rep.repNumber)]||0)+plan[x.rep.repNumber]}</td></tr>`).join('')}</tbody></table>
  `, `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn accent" id="confirmAssignBtn">Assign ${totalPlanned} Lead${totalPlanned===1?'':'s'}</button>`);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('confirmAssignBtn').onclick = ()=>{
    const unassignedLeads = orgFiltered(DB.leads).filter(l=>!repIdentityKey(l.assignedTo));
    const assignmentQueue = [];
    planRows.forEach(x=>{ for(let i=0;i<plan[x.rep.repNumber];i++){ assignmentQueue.push(x.rep.repNumber); } });
    let assigned = 0;
    const nowIso = new Date().toISOString();
    assignmentQueue.forEach(repNum=>{
      if(assigned < unassignedLeads.length){
        const lead = unassignedLeads[assigned];
        lead.assignedTo = String(repNum);
        lead.assignedAt = nowIso;
        lead.assignedByRepNumber = currentRep ? String(currentRep.repNumber) : '';
        lead.lastTouchedAt = '';
        logAssignmentMovement(lead, 'manual_assigned', '', repNum, 'Auto-Assign to Target tool');
        assigned++;
      }
    });
    queueSave();
    toast(`Assigned ${assigned} lead(s) across ${planRows.length} rep(s).`);
    closeModal(); render();
  };
}

// Best-guess column mapping from a header string — reps upload all kinds of
// export formats, so this covers the common naming variants seen in the
// wild rather than requiring exact matches.
function guessFieldForHeader(header){
  const h = String(header||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const table = [
    [['fullname','name','contactname','leadname'], 'fullName'],
    [['firstname','fname','first'], 'firstName'],
    [['middlename','mname','middle'], 'middleName'],
    [['lastname','lname','last','surname'], 'lastName'],
    [['company','companyname','business','businessname'], 'company'],
    [['email','emailaddress','e'], 'email'],
    [['phone','phonenumber','telephone','cell','cellphone','mobile'], 'phone'],
    [['address','streetaddress','street','addr'], 'address'],
    [['city'], 'city'],
    [['state','st'], 'state'],
    [['county'], 'county'],
    [['zip','zipcode','postalcode','postal'], 'zip'],
    [['businesstype','industry','type'], 'businessType'],
    [['naics','naicscode'], 'naicsCode'],
    [['sic','siccode'], 'sicCode'],
    [['requestedproduct','product'], 'requestedProduct'],
    [['requestedamount','amount'], 'requestedAmount'],
    [['source','sourcedetail','campaign'], 'source'],
  ];
  for(const [variants, field] of table){ if(variants.includes(h)) return field; }
  return '';
}

function normalizePhoneForDedup(phone){
  return String(phone||'').replace(/\D/g,'');
}

// Builds one lead object from a raw data row given the confirmed column
// mapping and the shared defaults (channel/leadType/org) — pure function,
// easy to test independent of file parsing.
function buildLeadFromRow(row, headers, mapping, defaults){
  const values = {};
  headers.forEach((h,i)=>{
    const field = mapping[i];
    if(!field) return;
    const v = row[i]!==undefined && row[i]!==null ? String(row[i]).trim() : '';
    if(!v) return;
    values[field] = v;
  });
  let firstName = values.firstName||'', middleName = values.middleName||'', lastName = values.lastName||'';
  if(values.fullName && !firstName && !lastName){
    const parts = values.fullName.split(/\s+/);
    firstName = parts[0]||'';
    lastName = parts.slice(1).join(' ')||'';
  }
  const name = [firstName, middleName, lastName].filter(Boolean).join(' ') || values.fullName || '';
  return {
    firstName, middleName, lastName, name,
    company: values.company||'', email: (values.email||'').toLowerCase(),
    phone: values.phone||'', address: values.address||'', city: values.city||'',
    state: (values.state||'').toUpperCase(), county: values.county||'', zip: values.zip||'',
    businessType: values.businessType||'', naicsCode: values.naicsCode||'', sicCode: values.sicCode||'',
    requestedProduct: values.requestedProduct||'', requestedAmount: values.requestedAmount||'',
    source: values.source||'',
    status: 'New', channel: defaults.channel, leadType: defaults.leadType, org: defaults.org,
    score: 0, assignedTo: '', calls:0, texts:0, emails:0, conversations:0, appointments:0,
    convertedLoanId:'', comments:[],
    assignedAt:'', assignedByRepNumber:'', lastTouchedAt:'', archived:false, archivedAt:'', locked:false,
  };
}

// Runs the whole mapped dataset through buildLeadFromRow, skips blank rows
// and duplicates (matched by phone against existing leads AND against
// other rows in the same import), and returns the leads to commit plus
// counts — pure/testable, separate from the actual DB.leads write.
function processLeadsImport(rows, headers, mapping, defaults){
  const existingPhones = new Set(orgFiltered(DB.leads).map(l=>normalizePhoneForDedup(l.phone)).filter(Boolean));
  const seenInBatch = new Set();
  const toImport = [];
  let skippedDup = 0, skippedInvalid = 0;
  rows.forEach(row=>{
    const lead = buildLeadFromRow(row, headers, mapping, defaults);
    if(!lead.name && !lead.company && !lead.phone){ skippedInvalid++; return; }
    const normPhone = normalizePhoneForDedup(lead.phone);
    if(normPhone && (existingPhones.has(normPhone) || seenInBatch.has(normPhone))){ skippedDup++; return; }
    if(normPhone) seenInBatch.add(normPhone);
    toImport.push(lead);
  });
  return { toImport, skippedDup, skippedInvalid, total: rows.length };
}

// ---------------------------------------------------------------------------
// Bulk NAICS Backfill — proposes a NAICS code for existing leads that don't
// have one, based on their Business Type (or Company name as a fallback).
// Deliberately conservative: only proposes a match when there's a genuine
// keyword hit against the real NAICS title list, and NEVER writes anything
// without the Super Admin reviewing and confirming the specific proposals
// first — a wrong auto-match would feed the wrong sector into Sales
// Talking Points, so silent bulk-writing here would be worse than not
// having codes at all.
// ---------------------------------------------------------------------------

// Strips common business-entity suffixes so "Acme Landscaping LLC" searches
// as "Acme Landscaping" — those suffixes never appear in NAICS titles and
// only dilute the keyword match.
function stripEntitySuffixes(text){
  return String(text||'')
    .replace(/\b(llc|inc|incorporated|corp|corporation|co|company|ltd|lp|llp|pllc|pc)\b\.?/gi, '')
    .replace(/\s+/g,' ').trim();
}

// Returns the single best NAICS match for one lead, or null if nothing
// confident enough was found. Tries Business Type first (most reliable
// signal), then falls back to the company name with entity suffixes
// stripped out.
function guessNaicsForLead(lead){
  const candidates = [lead.businessType, stripEntitySuffixes(lead.company)].filter(t=>t && t.trim().length >= 3);
  for(const text of candidates){
    const matches = searchNaicsCodes(text, 5);
    if(matches.length > 0){
      // Prefer the most specific (longest) code among the matches — e.g. a
      // 6-digit national industry over its 5-digit parent, when both share
      // the same title (common when a 5-digit group has exactly one child).
      const best = matches.slice().sort((a,b)=>b.code.length-a.code.length)[0];
      return { code: best.code, title: best.title, matchedOn: text };
    }
  }
  return null;
}

// Scans every lead missing a NAICS code and proposes a match — pure
// function, doesn't write anything, just returns the plan for review.
function planNaicsBackfill(){
  const candidates = orgFiltered(DB.leads).filter(l=>!l.naicsCode);
  const proposed = [];
  let unmatched = 0;
  candidates.forEach(lead=>{
    const guess = guessNaicsForLead(lead);
    if(guess) proposed.push({ leadId: lead.id, leadName: lead.name, company: lead.company, businessType: lead.businessType, ...guess, include: true });
    else unmatched++;
  });
  return { proposed, unmatched, totalMissing: candidates.length };
}

/* ------------------------------ calendar / callback reminders ------------------------------ */

function viewCalendar(){
  const tasks = orgFiltered(DB.tasks).filter(t=>t.status!=='Complete' && t.status!=='Canceled');
  const buckets = { overdue:[], today:[], tomorrow:[], week:[], later:[], none:[] };
  tasks.forEach(t=>{ buckets[dateBucket(t.dueDate).key].push(t); });
  const order = ['overdue','today','tomorrow','week','later','none'];
  const bucketMeta = { overdue:dateBucket('2000-01-01'), today:dateBucket(new Date().toISOString().slice(0,10)) };

  return `
    <div class="panel-head">
      <div><h2>Calendar</h2><div class="sub">Color-coded reminders \u2014 callbacks and every other open task, grouped by due date</div></div>
    </div>
    ${callStatusLegendForCalendarHtml()}
    ${order.map(key=>{
      const list = buckets[key];
      if(list.length===0) return '';
      const meta = key==='none' ? {label:'No Due Date', color:'#b9c2ca'} : dateBucket(key==='overdue' ? '2000-01-01' : key==='today' ? new Date().toISOString().slice(0,10) : key==='tomorrow' ? new Date(Date.now()+86400000).toISOString().slice(0,10) : key==='week' ? new Date(Date.now()+5*86400000).toISOString().slice(0,10) : new Date(Date.now()+30*86400000).toISOString().slice(0,10));
      const label = key==='none' ? 'No Due Date' : meta.label;
      const color = key==='none' ? '#b9c2ca' : meta.color;
      const sorted = list.slice().sort((a,b)=> new Date(a.dueDate||'2999-01-01') - new Date(b.dueDate||'2999-01-01'));
      return `
        <div class="cal-bucket">
          <div class="cal-bucket-head" style="background:${color};">${label} (${list.length})</div>
          ${sorted.map(t=>`
            <div class="cal-row" data-open-task="${t.id}">
              <span class="call-status-dot" style="background:${color};"></span>
              <div class="cal-date">${fmtDate(t.dueDate)}</div>
              <div class="cal-title">${esc(t.title)}</div>
              <div class="cal-meta">${esc(repDisplayName(t.assignedTo))||'Unassigned'} &middot; ${esc(t.priority)} &middot; ${esc(t.relatedTo)||''}</div>
            </div>`).join('')}
        </div>`;
    }).join('') || `<div class="box"><div class="loading-note">No open tasks or callbacks scheduled. Callback reminders are created automatically when you log a "Callback Scheduled" call disposition on a lead.</div></div>`}
  `;
}
function callStatusLegendForCalendarHtml(){

// Runs any matching automations when an entity's status/stage field changes.
function runAutomations(entityType, item, newValue){
  const rules = (DB.automations||[]).filter(a=>a.active && a.entity===entityType && a.toValue===newValue && (a.org==='All' || a.org===item.org));
  rules.forEach(a=>{
    if(a.actionType==='create_task'){
      const due = new Date();
      due.setDate(due.getDate() + (a.params.daysOffset||0));
      DB.tasks.push({
        id: nextId(), createdAt: new Date().toISOString(),
        title: a.params.title, dueDate: due.toISOString().slice(0,10),
        priority: 'Normal', status: 'Open',
        assignedTo: a.params.assignedTo || item.assignedTo || item.officer || '',
        relatedTo: item.name || item.loanNumber || item.title || '',
        org: item.org, comments: [],
      });
      toast(`Automation: created task "${a.params.title}"`);
    } else if(a.actionType==='toast'){
      toast('Reminder: ' + a.params.message);
    } else if(a.actionType==='post_update'){
      item.comments = item.comments || [];
      item.comments.push({ id: nextId(), text: a.params.message, author: 'Automation', ts: new Date().toISOString() });
    }
  });
  if(rules.length) queueSave();
}

function bindLeadNotesEvents(lead){
  bindUpdatesEvents(lead);
  const labels = {texts:'Logged a text message', emails:'Logged an email', appointments:'Appointment set'};
  const tags = {texts:'text-log', emails:'email-log', appointments:'appointment'};
  document.querySelectorAll('[data-logtype]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.logtype;
      lead[key] = (lead[key]||0) + 1;
      lead.comments = lead.comments || [];
      lead.comments.push({ id: nextId(), text: labels[key], author: currentRep ? currentRep.repNumber : 'LH', ts:new Date().toISOString(), tag: tags[key] });
      queueSave();
      toast(labels[key]);
      openLeadDetail(lead.id); // refresh modal in place
    };
  });
  const startCallTimerBtn = document.getElementById('startCallTimerBtn');
  if(startCallTimerBtn) startCallTimerBtn.onclick = ()=>{
    activeCallTimers[lead.id] = new Date().toISOString();
    openLeadDetail(lead.id);
  };
  const cancelCallTimerBtn = document.getElementById('cancelCallTimerBtn');
  if(cancelCallTimerBtn) cancelCallTimerBtn.onclick = ()=>{
    delete activeCallTimers[lead.id];
    openLeadDetail(lead.id);
  };

  document.querySelectorAll('[data-disposition]').forEach(btn=>{
    btn.onclick = ()=>{
      const d = DISPOSITION_MAP[btn.dataset.disposition];
      lead.calls = (lead.calls||0) + 1;
      lead.lastTouchedAt = new Date().toISOString(); // resets the 72-business-hour Master Leads SLA clock
      if(d.id==='connected_interested' || d.id==='connected_not_interested') lead.conversations = (lead.conversations||0) + 1;
      lead.comments = lead.comments || [];
      let durationSeconds = 0;
      if(activeCallTimers[lead.id]){
        durationSeconds = Math.round((Date.now() - new Date(activeCallTimers[lead.id]).getTime())/1000);
        delete activeCallTimers[lead.id];
      }
      lead.comments.push({ id: nextId(), text: 'Call disposition logged.' + (durationSeconds?` (${formatDuration(durationSeconds)})`:''), author: currentRep ? currentRep.repNumber : 'LH', ts:new Date().toISOString(), disposition: d.id, durationSeconds });

      if(d.id==='dnc_requested'){
        toast('Logged \u2014 remember to mark this lead Lost and stop contacting this number.', true);
      } else if(d.id==='number_disconnected'){
        toast('Logged \u2014 this number is dead; consider marking the lead Lost.', true);
      } else {
        toast('Logged: ' + d.label);
      }
      queueSave();
      openLeadDetail(lead.id); // refresh modal in place
    };
  });

  const logCallbackBtn = document.getElementById('logCallbackBtn');
  if(logCallbackBtn) logCallbackBtn.onclick = async ()=>{
    const dtInput = document.getElementById('callbackDateTime');
    const dtVal = dtInput.value; // "YYYY-MM-DDTHH:MM" local time
    if(!dtVal){ toast('Pick a callback date and time first', true); return; }
    logCallbackBtn.disabled = true;
    logCallbackBtn.textContent = 'Scheduling\u2026';

    lead.calls = (lead.calls||0) + 1;
    lead.lastTouchedAt = new Date().toISOString(); // resets the 72-business-hour Master Leads SLA clock
    lead.comments = lead.comments || [];
    lead.comments.push({ id: nextId(), text: 'Call disposition logged.', author: currentRep ? currentRep.repNumber : 'LH', ts:new Date().toISOString(), disposition: 'callback_scheduled', callbackAt: dtVal });

    DB.tasks.push({
      id: nextId(), createdAt: new Date().toISOString(), comments: [],
      title: 'Callback: ' + lead.name + (lead.company ? ' (' + lead.company + ')' : ''),
      dueDate: dtVal.slice(0,10), priority:'High', status:'Open',
      assignedTo: currentRep ? currentRep.repNumber : (lead.assignedTo||''), relatedTo: lead.name, org: lead.org,
    });
    queueSave();

    try{
      const result = await apiCreateCalendarEvent({
        title: 'Callback: ' + lead.name + (lead.company ? ' \u2014 ' + lead.company : ''),
        description: 'Pedison USA lead callback.\nPhone: ' + (lead.phone||'') + '\nOrg: ' + (lead.org||''),
        startDateTime: dtVal,
        guestEmail: currentRep ? currentRep.email : '',
      });
      if(result && result.ok){
        toast('Callback scheduled \u2014 added to Calendar and CRM reminders');
      } else {
        toast('Callback saved in the CRM, but the Google Calendar invite failed: ' + (result && result.error ? result.error : 'unknown error'), true);
      }
    }catch(e){
      toast('Callback saved in the CRM, but couldn\u2019t reach Google Calendar \u2014 check your connection.', true);
    }
    openLeadDetail(lead.id); // refresh modal in place
  };
}

    if(isAdmin() && repIdentityKey(data.assignedTo) !== repIdentityKey(priorAssignedTo)){
      finalItem.assignedAt = data.assignedTo ? new Date().toISOString() : '';

function convertLead(id){
  const lead = DB.leads.find(l=>l.id===id);
  if(!lead) return;
  if(!hasFeature('take_applications')){ toast('You don\u2019t have permission to take loan applications.', true); return; }
  openModal('Convert Lead to Loan File', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">Creates a contact (if needed) and opens a new loan file at the first pipeline stage. The lead stays linked to its original campaign for attribution.</p>
    <div class="field-row">
      <div class="field"><label>Product Type</label><select id="f_product">${selectOptions(LOAN_PRODUCTS, lead.requestedProduct && LOAN_PRODUCTS.includes(lead.requestedProduct) ? lead.requestedProduct : LOAN_PRODUCTS[0])}</select></div>
      <div class="field"><label>Requested Amount</label><input type="number" id="f_amount" value="${lead.requestedAmount||''}"></div>
    </div>
  `, `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="convertBtn">Convert</button>`);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('convertBtn').onclick = ()=>{
    let contact = DB.contacts.find(c=>c.email && c.email===lead.email && lead.email);
    if(!contact){
      contact = { id: nextId(), createdAt:new Date().toISOString(), comments:[],
        name: lead.name, firstName: lead.firstName, middleName: lead.middleName, lastName: lead.lastName,
        company: lead.company, email: lead.email, phone: lead.phone,
        type: 'Borrower', org: lead.org, source: lead.source || lead.channel };
      DB.contacts.push(contact);
    }
    const loanNumber = 'PED-' + new Date().getFullYear() + '-' + Math.floor(100000+Math.random()*899999);
    const prefillApp = freshBusinessApplication();
    prefillApp.legalCompanyName = lead.company || '';
    prefillApp.dba = lead.company || '';
    prefillApp.companyPhone = lead.phone || '';
    prefillApp.companyEmail = lead.email || '';
    prefillApp.physicalAddress = lead.address || '';
    prefillApp.city = lead.city || '';
    prefillApp.state = lead.state || '';
    prefillApp.zip = lead.zip || '';
    prefillApp.companyIndustry = lead.businessType || '';
    prefillApp.loanAmountRequested = document.getElementById('f_amount').value || '';
    prefillApp.desiredLoanAmount = document.getElementById('f_amount').value || '';
    prefillApp.applicationDate = new Date().toISOString().slice(0,10);
    prefillApp.owner1.firstName = lead.firstName || '';
    prefillApp.owner1.lastName = lead.lastName || '';
    prefillApp.owner1.phone = lead.phone || '';
    prefillApp.owner1.email = lead.email || '';
    const loan = {
      id: nextId(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), comments:[],
      loanNumber, contactId: contact.id,
      productType: document.getElementById('f_product').value,
      requestedAmount: document.getElementById('f_amount').value,
      approvedAmount:'', rate:'', term:'', officer:'',
      org: lead.org, stage: LOAN_STAGES[0],
      stageHistory: [{stage:LOAN_STAGES[0], enteredAt:new Date().toISOString()}],
      documents: freshLoanDocumentChecklist(), conditions: [], application: prefillApp, underwriting: freshUnderwritingInputs(),
      subStatus: (LOAN_SUB_STATUSES[LOAN_STAGES[0]]||[])[0] || '', activityLog: [],
    };
    DB.loans.push(loan);
    lead.status = 'Converted';
    lead.convertedLoanId = loan.id;
    runAutomations('lead', lead, 'Converted');
    queueSave();
    toast(`Converted \u2014 loan file ${loanNumber} created`);
    closeModal();
    currentTab = 'loans';
    render();
  };
}

// ---------------------------------------------------------------------------
// Underwriting Analysis — real industry-standard formulas and current
// reference data, not invented thresholds:
//  - DSCR (Debt Service Coverage Ratio) = Net Operating Income / Annual Debt
//    Service. Most CRE lenders in 2026 require a 1.20x–1.25x minimum, with
//    1.25x–1.35x+ preferred for stronger approvals (source: industry-wide
//    CRE underwriting guidance, 2026).
//  - LTV (Loan-to-Value) = Loan Amount / Appraised or Purchase Value.
//    Conventional CRE commonly caps at 65–75%, up to 80% for stronger
//    assets; SBA owner-occupied programs can go to 90–100%.
//  - DTI (Debt-to-Income) = Total Monthly Debt Payments / Gross Monthly
//    Income — the standard personal-guarantor-level ratio.
//  - SBA 7(a)/504/Microloan figures below are the actual current SBA
//    program parameters as of 2026 (source: SBA.gov program guidance).
// ---------------------------------------------------------------------------
const DSCR_MIN_ACCEPTABLE = 1.20;
const DSCR_PREFERRED = 1.25;
const LTV_CONVENTIONAL_MAX = 0.75;
const LTV_STRONG_ASSET_MAX = 0.80;
const LTV_SBA_OWNER_OCCUPIED_MAX = 1.00;

const SBA_PROGRAMS = [
  { name:'SBA Microloan', max:50000, guarantyNote:'Distributed through intermediary lenders; no direct SBA guaranty to a bank', rateNote:'Set by the intermediary lender, typically 8\u201313%' },
  { name:'SBA 7(a)', max:5000000, guarantyNote:'85% guaranty on loans \u2264$150,000; 75% guaranty on larger loans', rateNote:'Capped at Prime + spread by loan size (see tiers below)' },
  { name:'SBA 504', max:5500000, guarantyNote:'Applies to the SBA-backed debenture portion only, not total project cost', rateNote:'Long-term fixed rate on the CDC/SBA portion' },
];
// Current WSJ Prime Rate reference and SBA 7(a) rate ceiling tiers (2026)
const WSJ_PRIME_RATE = 6.75;
const SBA_7A_RATE_TIERS = [
  { max:50000, spread:6.5, label:'$50,000 or less' },
  { max:250000, spread:6.0, label:'$50,001 \u2013 $250,000' },
  { max:350000, spread:4.5, label:'$250,001 \u2013 $350,000' },
  { max:Infinity, spread:3.0, label:'Over $350,000' },
];
function sba7aRateCeiling(amount){
  const tier = SBA_7A_RATE_TIERS.find(t=>Number(amount)<=t.max) || SBA_7A_RATE_TIERS[SBA_7A_RATE_TIERS.length-1];
  return { ceiling: WSJ_PRIME_RATE + tier.spread, label: tier.label };
}

function freshUnderwritingInputs(){
  return { propertyValue:'', grossRentalIncome:'', operatingExpenses:'', annualDebtService:'', grossMonthlyIncome:'', monthlyDebtPayments:'' };
}

// Pure calculation function — takes underwriting inputs plus the loan's
// requested/approved amount, returns every ratio plus a plain-language
// assessment against the real thresholds above. No side effects.
function computeUnderwritingAnalysis(uw, loanAmount){
  const noi = (Number(uw.grossRentalIncome)||0) - (Number(uw.operatingExpenses)||0);
  const debtService = Number(uw.annualDebtService)||0;
  const propertyValue = Number(uw.propertyValue)||0;
  const amount = Number(loanAmount)||0;
  const grossMonthlyIncome = Number(uw.grossMonthlyIncome)||0;
  const monthlyDebtPayments = Number(uw.monthlyDebtPayments)||0;

  const dscr = debtService > 0 ? noi / debtService : null;
  const ltv = propertyValue > 0 ? amount / propertyValue : null;
  const dti = grossMonthlyIncome > 0 ? monthlyDebtPayments / grossMonthlyIncome : null;

  let dscrAssessment = null;
  if(dscr !== null){
    if(dscr < 1.0) dscrAssessment = { level:'red', text:`DSCR of ${dscr.toFixed(2)}x is below 1.00x \u2014 NOI does not cover debt service.` };
    else if(dscr < DSCR_MIN_ACCEPTABLE) dscrAssessment = { level:'red', text:`DSCR of ${dscr.toFixed(2)}x is below the ${DSCR_MIN_ACCEPTABLE}x minimum most CRE lenders require.` };
    else if(dscr < DSCR_PREFERRED) dscrAssessment = { level:'amber', text:`DSCR of ${dscr.toFixed(2)}x meets the common minimum but is below the ${DSCR_PREFERRED}x preferred for stronger approvals.` };
    else dscrAssessment = { level:'green', text:`DSCR of ${dscr.toFixed(2)}x meets the ${DSCR_PREFERRED}x+ preferred threshold.` };
  }
  let ltvAssessment = null;
  if(ltv !== null){
    if(ltv > LTV_STRONG_ASSET_MAX) ltvAssessment = { level:'red', text:`LTV of ${(ltv*100).toFixed(1)}% exceeds the ${(LTV_STRONG_ASSET_MAX*100)}% ceiling typical even for strong assets (SBA owner-occupied programs may allow more).` };
    else if(ltv > LTV_CONVENTIONAL_MAX) ltvAssessment = { level:'amber', text:`LTV of ${(ltv*100).toFixed(1)}% is above the ${(LTV_CONVENTIONAL_MAX*100)}% conventional cap but within range for stronger assets (up to ${(LTV_STRONG_ASSET_MAX*100)}%).` };
    else ltvAssessment = { level:'green', text:`LTV of ${(ltv*100).toFixed(1)}% is within the conventional ${(LTV_CONVENTIONAL_MAX*100)}% cap.` };
  }
  let dtiAssessment = null;
  if(dti !== null){
    if(dti > 0.50) dtiAssessment = { level:'red', text:`DTI of ${(dti*100).toFixed(1)}% is high \u2014 above the 50% level most lenders treat as a hard ceiling.` };
    else if(dti > 0.43) dtiAssessment = { level:'amber', text:`DTI of ${(dti*100).toFixed(1)}% is above the commonly-used 43% qualifying threshold.` };
    else dtiAssessment = { level:'green', text:`DTI of ${(dti*100).toFixed(1)}% is within the commonly-used 43% qualifying threshold.` };
  }
  return { noi, dscr, ltv, dti, dscrAssessment, ltvAssessment, dtiAssessment };
}

// ---------------------------------------------------------------------------
// The application is broken into independently-completable sections rather
// than one long scrolling form — a rep fills in Company Info today and
// Owner 2 next week without ever seeing an intimidating wall of fields.

// ---------------------------------------------------------------------------
const BUSINESS_APP_SECTIONS = [
  { key:'application', label:'Application', fields:['partnerId','intendedUseOfFunds','applicationDate','creditType'] },
  { key:'company', label:'Company Information', fields:['legalCompanyName','dba','legalEntity','stateOfIncorporation','businessInceptionDate','taxId','companyType','companyIndustry','companyPhone','companyEmail','physicalAddress','city','state','zip','rentOrOwn'] },
  { key:'loanAmount', label:'Required Loan Amount Information', fields:['annualBusinessRevenue','avgBankBalance','monthlyCCVolume','loanAmountRequested','desiredLoanAmount'] },
  { key:'owner1', label:'Owner Information (1)', fields:BUSINESS_APP_OWNER_FIELDS, isOwner:1 },
  { key:'owner2', label:'Owner Information (2)', fields:BUSINESS_APP_OWNER_FIELDS, isOwner:2, optional:true },
];
function sectionCompleteness(app, section){
  const source = section.isOwner ? (app['owner'+section.isOwner]||{}) : app;
  const total = section.fields.length;
  const filled = section.fields.filter(f=>String(source[f]||'').trim()).length;
  return { filled, total };
}
function businessApplicationSectionCards(app){
  return BUSINESS_APP_SECTIONS.map(section=>{
    const { filled, total } = sectionCompleteness(app, section);
    const complete = filled === total;
    return `
      <div class="app-section-card">
        <div class="app-section-head">
          <strong>${esc(section.label)}</strong>
          <span class="pill ${complete?'green':filled>0?'amber':'grey'}">${filled} of ${total}${section.optional?' (optional)':''}</span>
        </div>
        <button class="btn small secondary" data-open-app-section="${section.key}">${hasFeature('take_applications') ? 'Edit' : 'View'}</button>
      </div>`;
  }).join('');
}

        <div class="field"><label>Monthly Credit Card Volume</label><input type="number" id="s_ccVolume" value="${app.monthlyCCVolume||''}" ${dis}></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Loan Amount Requested</label><input type="number" id="s_loanRequested" value="${app.loanAmountRequested||''}" ${dis}></div>
        <div class="field"><label>Desired Loan Amount</label><input type="number" id="s_desiredAmount" value="${app.desiredLoanAmount||''}" ${dis}></div>
      </div>`;
  } else if(sectionKey==='owner1' || sectionKey==='owner2'){
    const o = app[sectionKey] || {};
    bodyHtml = ownerFieldsHtml('s_owner', o).replace(/s_owner_/g, 's_owner_');
  }
  openModal(section.label, bodyHtml, canEdit ? `<button class="btn secondary" id="cancelSectionBtn">Cancel</button><button class="btn" id="saveSectionBtn">Save Section</button>` : `<button class="btn secondary" id="closeSectionBtn">Close</button>`);

  const closeSectionBtn = document.getElementById('closeSectionBtn');
  if(closeSectionBtn) closeSectionBtn.onclick = ()=>loanDetail(loan.id);
  const cancelSectionBtn = document.getElementById('cancelSectionBtn');
  if(cancelSectionBtn) cancelSectionBtn.onclick = ()=>loanDetail(loan.id);
  const saveSectionBtn = document.getElementById('saveSectionBtn');
  if(saveSectionBtn) saveSectionBtn.onclick = ()=>{
    const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    loan.application = loan.application || freshBusinessApplication();
    if(sectionKey==='application'){
      Object.assign(loan.application, { partnerId: val('s_partnerId'), applicationDate: val('s_date'), intendedUseOfFunds: val('s_useOfFunds'), creditType: val('s_creditType') });
    } else if(sectionKey==='company'){
      const chk = id => { const el = document.getElementById(id); return el ? el.checked : false; };
      Object.assign(loan.application, {
        legalCompanyName: val('s_legalName'), dba: val('s_dba'), legalEntity: val('s_entity'), stateOfIncorporation: val('s_stateInc'),
        businessInceptionDate: val('s_inception'), taxId: val('s_taxId'), companyType: val('s_companyType'), companyIndustry: val('s_industry'),
        companyPhone: val('s_phone'), companyEmail: val('s_email'), physicalAddress: val('s_address'), city: val('s_city'), state: val('s_state'), zip: val('s_zip'),
        rentOrOwn: val('s_rentOwn'), landlordName: val('s_landlordName'), landlordPhone: val('s_landlordPhone'),
        hasOutstandingMCA: chk('s_hasMCA'), mcaAmount: val('s_mcaAmount'),
        hasSeparateBizBankAccount: chk('s_sepBank'), acceptedCC3Months: chk('s_acceptedCC'),
      });
    } else if(sectionKey==='loanAmount'){
      Object.assign(loan.application, { annualBusinessRevenue: val('s_revenue'), avgBankBalance: val('s_avgBalance'), monthlyCCVolume: val('s_ccVolume'), loanAmountRequested: val('s_loanRequested'), desiredLoanAmount: val('s_desiredAmount') });
    } else if(sectionKey==='owner1' || sectionKey==='owner2'){
      loan.application[sectionKey] = readOwnerFields('s_owner');
    }
    loan.updatedAt = new Date().toISOString();
    logLoanActivity(loan, 'application', `Updated application section: ${section.label}`);
    queueSave(); toast(`${section.label} saved`); loanDetail(loan.id);
  };
}

  const contactOptions = DB.contacts.length
    ? DB.contacts.map(c=>`<option value="${c.id}" ${c.id===l.contactId?'selected':''}>${esc(c.name)}${c.company?' \u2014 '+esc(c.company):''}</option>`).join('')
    : `<option value="">No contacts yet \u2014 add one first</option>`;
  return `
    <div class="field"><label>Borrower / Contact</label><select id="f_contact">${contactOptions}</select></div>
    <div class="field-row">
      <div class="field"><label>Product Type</label><select id="f_product">${selectOptions(LOAN_PRODUCTS, l.productType)}</select></div>
      <div class="field"><label>Organization</label><select id="f_org">${selectOptions(ORGS, l.org)}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Requested Amount</label><input type="number" id="f_reqamt" value="${l.requestedAmount||''}"></div>
      <div class="field"><label>Approved Amount</label><input type="number" id="f_appramt" value="${l.approvedAmount||''}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Rate (%)</label><input type="number" step="0.01" id="f_rate" value="${l.rate||''}"></div>
      <div class="field"><label>Term (months)</label><input type="number" id="f_term" value="${l.term||''}"></div>
    </div>

function readLoanForm(){
  return {
    contactId: document.getElementById('f_contact').value,
    productType: document.getElementById('f_product').value,
    org: document.getElementById('f_org').value,
    requestedAmount: document.getElementById('f_reqamt').value,
    approvedAmount: document.getElementById('f_appramt').value,
    rate: document.getElementById('f_rate').value,
    term: document.getElementById('f_term').value,
    officer: document.getElementById('f_officer').value.trim(),
  };
}
function addLoan(){
  if(!hasFeature('take_applications')){ toast('You don\u2019t have permission to take loan applications.', true); return; }
  if(DB.contacts.length===0){ toast('Add a contact first, or convert a lead.', true); return; }
  openModal('New Loan File', loanForm(null),
    `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Create</button>`);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveBtn').onclick = ()=>{
    const data = readLoanForm();
    if(!data.contactId){ toast('Select a contact', true); return; }
    const loanNumber = 'PED-' + new Date().getFullYear() + '-' + Math.floor(100000+Math.random()*899999);
    DB.loans.push({
      id:nextId(), createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(), comments:[],
      loanNumber, stage:LOAN_STAGES[0],
      stageHistory:[{stage:LOAN_STAGES[0], enteredAt:new Date().toISOString()}],
      documents: freshLoanDocumentChecklist(), conditions: [], application: freshBusinessApplication(), underwriting: freshUnderwritingInputs(),
      subStatus: (LOAN_SUB_STATUSES[LOAN_STAGES[0]]||[])[0] || '', activityLog: [],
      ...data
    });
    queueSave(); toast('Loan file created'); closeModal(); render();
  };
}

  const history = (loan.stageHistory||[]).slice().reverse();

      <div class="kv"><div class="k">Sub Status</div><div>${canMoveStage ? `<select id="subStatusSelect">${(LOAN_SUB_STATUSES[loan.stage]||[]).map(s=>`<option value="${esc(s)}" ${loan.subStatus===s?'selected':''}>${esc(s)}</option>`).join('')}</select>` : `<span class="pill grey">${esc(loan.subStatus)||'\u2014'}</span>`}</div></div>
    </div>
    <div class="detail-section">

      <div class="app-section-grid">${businessApplicationSectionCards(app)}</div>
    </div>
    <div class="detail-section">
      <h4>Underwriting Analysis <span style="font-weight:normal;color:var(--grey);font-size:11px;">(real DSCR/LTV/DTI formulas, current industry thresholds)</span></h4>

        <div class="field"><label>Operating Expenses (Annual)</label><input type="number" id="uw_opex" value="${uw.operatingExpenses||''}" ${canEditTerms?'':'disabled'}></div>
      </div>

        <div class="uw-metric"><div class="uw-label">LTV</div><div class="uw-value">${analysis.ltv!==null?(analysis.ltv*100).toFixed(1)+'%':'\u2014'}</div>${analysis.ltvAssessment?`<div class="pill ${analysis.ltvAssessment.level}">${analysis.ltvAssessment.level==='green'?'Within cap':analysis.ltvAssessment.level==='amber'?'Elevated':'Exceeds cap'}</div>`:''}</div>

      ${(!analysis.dscr && !analysis.ltv && !analysis.dti) ? '<div class="loading-note">Enter property value, income/expense, and debt service figures above to calculate DSCR, LTV, and DTI.</div>' : ''}

        <thead><tr><th>Document</th><th>File</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${docs.length===0 ? `<tr class="empty-row"><td colspan="4">No documents on this checklist.</td></tr>` :

                ${d.fileUrl ? `<a href="${esc(d.fileUrl)}" target="_blank" rel="noopener">\uD83D\uDCC4 ${esc(d.fileName||'View file')}</a>${canRequestDocs ? ` <button class="link-btn red" data-remove-doc-file="${d.id}" title="Remove uploaded file">\u2715</button>` : ''}` :

  };
  document.querySelectorAll('[data-open-app-section]').forEach(btn=>{
    btn.onclick = ()=>openApplicationSectionForm(loan, btn.dataset.openAppSection);
  });
  const subStatusSelect = document.getElementById('subStatusSelect');
  if(subStatusSelect) subStatusSelect.onchange = ()=>{

  };
  const calcUnderwritingBtn = document.getElementById('calcUnderwritingBtn');
  if(calcUnderwritingBtn) calcUnderwritingBtn.onclick = ()=>{

      propertyValue: val('uw_propValue'), grossRentalIncome: val('uw_grossIncome'), operatingExpenses: val('uw_opex'),

    logLoanActivity(loan, 'underwriting', 'Underwriting figures updated');
    queueSave(); toast('Underwriting figures saved'); loanDetail(loan.id);

  document.querySelectorAll('[data-move-stage]').forEach(btn=>{
    btn.onclick = ()=>{
      const newStage = btn.dataset.moveStage;
      if(newStage===loan.stage) return;
      if(!canMoveStage){ toast('You don\u2019t have permission to move loan stages.', true); return; }
      if(newStage==='Underwriting' && !canPushUnderwriting){ toast('You don\u2019t have permission to push loans to Underwriting.', true); return; }
      const oldStage = loan.stage;
      loan.stage = newStage;
      loan.subStatus = (LOAN_SUB_STATUSES[newStage]||[])[0] || '';
      loan.updatedAt = new Date().toISOString();
      if(newStage==='Funded') loan.fundedAt = new Date().toISOString();
      loan.stageHistory = loan.stageHistory || [];
      loan.stageHistory.push({stage:newStage, enteredAt:new Date().toISOString()});
      logLoanActivity(loan, 'stage', `Stage changed: ${oldStage} \u2192 ${newStage}`);
      runAutomations('loan', loan, newStage);
      queueSave(); toast('Moved to ' + newStage); closeModal(); render();
    };
  });

  // Document checklist
  document.querySelectorAll('[data-doc-status]').forEach(sel=>{
    sel.onchange = ()=>{
      const d = loan.documents.find(x=>x.id===sel.dataset.docStatus);
      if(d){ d.status = sel.value; logLoanActivity(loan, 'document', `${d.name}: status set to ${d.status}`); queueSave(); toast(`${d.name}: ${d.status}`); loanDetail(loan.id); }
    };
  });
  document.querySelectorAll('[data-remove-doc]').forEach(btn=>{
    btn.onclick = ()=>{
      loan.documents = loan.documents.filter(x=>x.id!==btn.dataset.removeDoc);
      queueSave(); loanDetail(loan.id);
    };
  });
  const addDocBtn = document.getElementById('addDocBtn');
  if(addDocBtn) addDocBtn.onclick = ()=>{
    const nameInput = document.getElementById('newDocName');
    const name = nameInput.value.trim();
    if(!name){ toast('Enter a document name', true); return; }
    loan.documents = loan.documents || [];
    loan.documents.push({ id: nextId(), name, status:'Needed', notes:'', fileUrl:'', fileId:'', fileName:'' });
    queueSave(); loanDetail(loan.id);
  };

  // Real file upload — reads the selected file, sends it to Google Drive
  // via the Apps Script backend, and stores the resulting link on the
  // document checklist item.
  document.querySelectorAll('[data-doc-upload]').forEach(input=>{
    input.onchange = async ()=>{
      const docId = input.dataset.docUpload;
      const file = input.files[0];
      if(!file) return;
      const d = loan.documents.find(x=>x.id===docId);
      if(!d) return;
      const statusEl = document.querySelector(`[data-doc-upload-status="${docId}"]`);
      if(statusEl) statusEl.textContent = 'Uploading\u2026';
      try{
        const base64Data = await readFileAsBase64(file);
        const result = await apiUploadLoanDocument({ loanId: loan.id, loanNumber: loan.loanNumber, fileName: file.name, mimeType: file.type, base64Data });
        if(result && result.ok){
          d.fileUrl = result.fileUrl; d.fileId = result.fileId; d.fileName = result.fileName;
          if(d.status === 'Needed') d.status = 'Received';
          logLoanActivity(loan, 'document', `${d.name}: file uploaded (${result.fileName})`);
          queueSave(); toast(`${d.name}: file uploaded`); loanDetail(loan.id);
        } else {
          if(statusEl) statusEl.textContent = 'Upload failed';
          toast('Upload failed: ' + ((result && result.error) || 'unknown error'), true);
        }
      }catch(err){
        if(statusEl) statusEl.textContent = 'Upload failed';
        toast('Upload failed: ' + err, true);
      }
    };
  });
  document.querySelectorAll('[data-remove-doc-file]').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.preventDefault();
      const docId = btn.dataset.removeDocFile;
      const d = loan.documents.find(x=>x.id===docId);
      if(!d) return;
      if(!confirm(`Remove the uploaded file for "${d.name}"? The file will be deleted from Drive.`)) return;
      if(d.fileId){ try{ await apiDeleteLoanDocument(d.fileId); }catch(err){ /* proceed to clear the reference even if the Drive delete call fails */ } }
      d.fileUrl = ''; d.fileId = ''; d.fileName = '';
      queueSave(); loanDetail(loan.id);
    };
  });

  // Conditions / stipulations
  document.querySelectorAll('[data-condition-status]').forEach(sel=>{
    sel.onchange = ()=>{
      const c = loan.conditions.find(x=>x.id===sel.dataset.conditionStatus);
      if(c){ c.status = sel.value; if(sel.value!=='Open') c.clearedAt = new Date().toISOString(); logLoanActivity(loan, 'condition', `Condition "${c.text}": ${c.status}`); queueSave(); toast(`Condition: ${c.status}`); loanDetail(loan.id); }
    };
  });
  document.querySelectorAll('[data-remove-condition]').forEach(btn=>{
    btn.onclick = ()=>{
      loan.conditions = loan.conditions.filter(x=>x.id!==btn.dataset.removeCondition);
      queueSave(); loanDetail(loan.id);
    };
  });
  const addConditionBtn = document.getElementById('addConditionBtn');
  if(addConditionBtn) addConditionBtn.onclick = ()=>{
    const textInput = document.getElementById('newConditionText');
    const text = textInput.value.trim();
    if(!text){ toast('Enter a condition', true); return; }
    loan.conditions = loan.conditions || [];
    loan.conditions.push({ id: nextId(), text, status:'Open', addedAt: new Date().toISOString(), clearedAt:'' });
    queueSave(); loanDetail(loan.id);
  };
}

function closeStatusPop(){
  const existing = document.getElementById('statusPop');
  if(existing) existing.remove();
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('[data-statuspop]') && !e.target.closest('#statusPop')) closeStatusPop();
});

// Delegated so it works for accordions rendered on the Sales Scripts tab
// AND for the copy re-rendered fresh inside every lead popup, without
// needing to rebind after each render/modal open.
document.addEventListener('click', (e)=>{
  const header = e.target.closest('[data-acc-toggle]');
  if(!header) return;
  const body = document.getElementById(header.dataset.accToggle);
  if(!body) return;
  const opening = !body.classList.contains('open');
  body.classList.toggle('open', opening);
  header.classList.toggle('open', opening);
});

function openStatusPop(anchor, kind, id){
  closeStatusPop();
  let options, onPick, colorMap;
  if(kind==='lead'){
    const item = DB.leads.find(l=>l.id===id);
    options = LEAD_STATUSES; colorMap = LEAD_STATUS_PILL;
    onPick = (val)=>{ item.status=val; runAutomations('lead', item, val); queueSave(); toast('Status set to '+val); render(); };
  } else if(kind==='task'){
    const item = DB.tasks.find(t=>t.id===id);
    options = TASK_STATUSES; colorMap = TASK_STATUS_PILL;
    onPick = (val)=>{ item.status=val; runAutomations('task', item, val); queueSave(); toast('Status set to '+val); render(); };
  } else if(kind==='loanstage'){
    const item = DB.loans.find(l=>l.id===id);
    options = LOAN_STAGES; colorMap = null;
    onPick = (val)=>{
      item.stage=val; item.updatedAt=new Date().toISOString();
      if(val==='Funded') item.fundedAt = new Date().toISOString();
      item.stageHistory = item.stageHistory || [];
      item.stageHistory.push({stage:val, enteredAt:new Date().toISOString()});
      runAutomations('loan', item, val);
      queueSave(); toast('Stage set to '+val); render();
    };
  }
  const pop = document.createElement('div');
  pop.className = 'status-pop';
  pop.id = 'statusPop';
  pop.innerHTML = options.map(o=>`<div class="opt" data-pick="${esc(o)}">${o}</div>`).join('');
  document.body.appendChild(pop);
  const rect = anchor.getBoundingClientRect();
  pop.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  pop.style.left = (window.scrollX + rect.left) + 'px';
  pop.querySelectorAll('[data-pick]').forEach(o=>{ o.onclick=(ev)=>{ ev.stopPropagation(); onPick(o.dataset.pick); }; });
}

  };
  const clockOutBtn = document.getElementById('clockOutBtn');
  if(clockOutBtn) clockOutBtn.onclick = ()=>{

    if(active){ active.clockOut = new Date().toISOString(); queueSave(); toast('Clocked out'); render(); }
  };
  const setLunchBtn = document.getElementById('setLunchBtn');

    };
  });
  // group-by selects
  document.querySelectorAll('[data-groupselect]').forEach(sel=>{
    sel.onchange = ()=>{ groupState[sel.dataset.groupselect] = sel.value; render(); };
  });
  // collapsible group headers
  document.querySelectorAll('[data-grouptoggle]').forEach(row=>{
    row.onclick = ()=>{
      const gk = row.dataset.grouptoggle;
      collapsedGroups[gk] = !collapsedGroups[gk];
      render();
    };
  });
  // inline status pills
  document.querySelectorAll('[data-statuspop]').forEach(p=>{
    p.onclick = (e)=>{
      e.stopPropagation();
      const [kind, id] = p.dataset.statuspop.split(':');
      openStatusPop(p, kind, id);
    };
  });

  // Leads
  const leadSearchFieldSelect = document.getElementById('leadSearchFieldSelect');
  if(leadSearchFieldSelect) leadSearchFieldSelect.onchange = ()=>{ leadSearchField = leadSearchFieldSelect.value; render(); };
  const leadSearch = document.getElementById('leadSearch');

    const val = leadSearch.value;
    viewLeads._q = val;
    document.getElementById('mainArea').innerHTML = viewLeads();
    bindPageEvents();
    const freshInput = document.getElementById('leadSearch');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(val.length, val.length); }
  };
  const addLeadBtn = document.getElementById('addLeadBtn');
  if(addLeadBtn) addLeadBtn.onclick = ()=>addOrEditLead(null);
  const lockFirst25Btn = document.getElementById('lockFirst25Btn');

  const addLeadBtnMine = document.getElementById('addLeadBtnMine');
  if(addLeadBtnMine) addLeadBtnMine.onclick = ()=>addOrEditLead(null);

  // Leads Import (Super Admin)
  const leadsImportFileInput = document.getElementById('leadsImportFileInput');
  if(leadsImportFileInput) leadsImportFileInput.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('leadsImportStatus');
    if(statusEl) statusEl.textContent = 'Reading ' + file.name + '\u2026';
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const data = new Uint8Array(ev.target.result);
        const workbook = XLSX.read(data, { type:'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(sheet, { header:1, raw:false, defval:'' });
        if(aoa.length < 2){ if(statusEl) statusEl.textContent = 'That file has no data rows.'; return; }
        const headers = aoa[0].map(h=>String(h||'').trim());
        const rows = aoa.slice(1).filter(r=>r.some(c=>String(c||'').trim()!==''));
        const mapping = {};
        headers.forEach((h,i)=>{ mapping[i] = guessFieldForHeader(h); });
        leadsImportState = { step:'map', fileName:file.name, headers, rows, mapping,
          channel: LEAD_CHANNELS[0], leadType: LEAD_TYPES[0], org: currentOrgFilter!=='All'?currentOrgFilter:ORGS[0], result:null };
        render();
      }catch(err){
        if(statusEl) statusEl.textContent = 'Could not read that file: ' + err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  };
  document.querySelectorAll('[data-import-map-col]').forEach(sel=>{
    sel.onchange = ()=>{ leadsImportState.mapping[Number(sel.dataset.importMapCol)] = sel.value; };
  });
  const leadsImportCancelBtn = document.getElementById('leadsImportCancelBtn');
  if(leadsImportCancelBtn) leadsImportCancelBtn.onclick = ()=>{ resetLeadsImport(); render(); };
  const leadsImportPreviewBtn = document.getElementById('leadsImportPreviewBtn');
  if(leadsImportPreviewBtn) leadsImportPreviewBtn.onclick = ()=>{
    const st = leadsImportState;
    st.channel = document.getElementById('importChannel').value;
    st.leadType = document.getElementById('importLeadType').value;
    st.org = document.getElementById('importOrg').value;
    const plan = processLeadsImport(st.rows, st.headers, st.mapping, { channel: st.channel, leadType: st.leadType, org: st.org });
    openModal('Confirm Leads Import', `
      <p style="margin-top:0;font-size:12px;color:var(--grey);">Review before committing \u2014 this creates new leads in the Master Leads List.</p>
      <div class="kv"><div class="k">Rows in File</div><div>${plan.total}</div></div>
      <div class="kv"><div class="k">Will Import</div><div><strong>${plan.toImport.length}</strong></div></div>
      <div class="kv"><div class="k">Skipped (Duplicate Phone)</div><div>${plan.skippedDup}</div></div>
      <div class="kv"><div class="k">Skipped (Blank Row)</div><div>${plan.skippedInvalid}</div></div>
      <div class="kv"><div class="k">Channel / Lead Type / Org</div><div>${esc(st.channel)} / ${esc(st.leadType)} / ${esc(st.org)}</div></div>
    `, `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn accent" id="confirmImportBtn">Import ${plan.toImport.length} Lead${plan.toImport.length===1?'':'s'}</button>`);
    document.getElementById('cancelBtn').onclick = closeModal;
    const confirmImportBtn = document.getElementById('confirmImportBtn');
    if(confirmImportBtn) confirmImportBtn.onclick = ()=>{
      plan.toImport.forEach(lead=>{ DB.leads.push({ id: nextId(), createdAt: new Date().toISOString(), ...lead }); });
      queueSave();
      leadsImportState.step = 'done';
      leadsImportState.result = { total: plan.total, imported: plan.toImport.length, skippedDup: plan.skippedDup, skippedInvalid: plan.skippedInvalid };
      toast(`Imported ${plan.toImport.length} lead${plan.toImport.length===1?'':'s'}.`);
      closeModal(); render();
    };
  };
  const leadsImportAnotherBtn = document.getElementById('leadsImportAnotherBtn');
  if(leadsImportAnotherBtn) leadsImportAnotherBtn.onclick = ()=>{ resetLeadsImport(); render(); };

  // Bulk NAICS Backfill
  const naicsBackfillScanBtn = document.getElementById('naicsBackfillScanBtn');
  if(naicsBackfillScanBtn) naicsBackfillScanBtn.onclick = ()=>{
    const plan = planNaicsBackfill();
    naicsBackfillState = { step:'preview', plan, result:null };
    render();
  };
  const naicsBackfillCancelBtn = document.getElementById('naicsBackfillCancelBtn');
  if(naicsBackfillCancelBtn) naicsBackfillCancelBtn.onclick = ()=>{ resetNaicsBackfill(); render(); };
  const naicsBackfillSelectAll = document.getElementById('naicsBackfillSelectAll');
  if(naicsBackfillSelectAll) naicsBackfillSelectAll.onchange = ()=>{
    naicsBackfillState.plan.proposed.forEach(p=>{ p.include = naicsBackfillSelectAll.checked; });
    render();
  };
  document.querySelectorAll('[data-naics-backfill-row]').forEach(cb=>{
    cb.onchange = ()=>{
      naicsBackfillState.plan.proposed[Number(cb.dataset.naicsBackfillRow)].include = cb.checked;
      const includedCount = naicsBackfillState.plan.proposed.filter(p=>p.include).length;
      const applyBtn = document.getElementById('naicsBackfillApplyBtn');
      if(applyBtn) applyBtn.textContent = `Apply ${includedCount} Match${includedCount===1?'':'es'}`;
    };
  });
  const naicsBackfillApplyBtn = document.getElementById('naicsBackfillApplyBtn');
  if(naicsBackfillApplyBtn) naicsBackfillApplyBtn.onclick = ()=>{
    const toApply = naicsBackfillState.plan.proposed.filter(p=>p.include);
    let applied = 0;
    toApply.forEach(p=>{
      const lead = DB.leads.find(l=>l.id===p.leadId);
      if(lead && !lead.naicsCode){ lead.naicsCode = p.code; applied++; }
    });
    queueSave();
    naicsBackfillState = { step:'done', plan:null, result:{ applied } };
    toast(`Applied ${applied} NAICS code${applied===1?'':'s'}.`);
    render();
  };
  const naicsBackfillAgainBtn = document.getElementById('naicsBackfillAgainBtn');
  if(naicsBackfillAgainBtn) naicsBackfillAgainBtn.onclick = ()=>{ resetNaicsBackfill(); render(); };

  const showAllLeadsBtn = document.getElementById('showAllLeadsBtn');
  if(showAllLeadsBtn) showAllLeadsBtn.onclick = ()=>{ viewLeads._showAll = !viewLeads._showAll; render(); };

  // My Leads (non-admin rep view)
  document.querySelectorAll('[data-leadsreptab]').forEach(b=>{
    b.onclick = ()=>{ leadsRepTab = b.dataset.leadsreptab; render(); };
  });
  const addNextTenBtn = document.getElementById('addNextTenBtn');
  if(addNextTenBtn) addNextTenBtn.onclick = ()=>{ liveLeadsWindowSize += 10; render(); };
  const showFewerTenBtn = document.getElementById('showFewerTenBtn');
  if(showFewerTenBtn) showFewerTenBtn.onclick = ()=>{ liveLeadsWindowSize = Math.max(LIVE_LEADS_CAP, liveLeadsWindowSize - 10); render(); };
  const myLeadsSearchInput = document.getElementById('myLeadsSearchInput');
  if(myLeadsSearchInput) myLeadsSearchInput.oninput = ()=>{
    const val = myLeadsSearchInput.value;
    myLeadsSearch = val;
    document.getElementById('mainArea').innerHTML = viewMyLeads();
    bindPageEvents();
    const fresh = document.getElementById('myLeadsSearchInput');
    if(fresh){ fresh.focus(); fresh.setSelectionRange(val.length, val.length); }
  };
  document.querySelectorAll('[data-archive-lead]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const lead = DB.leads.find(l=>l.id===b.dataset.archiveLead);
    if(!lead) return;
    lead.archived = true; lead.archivedAt = new Date().toISOString();
    logAssignmentMovement(lead, 'archived', lead.assignedTo, lead.assignedTo, 'Archived by assigned rep');
    queueSave(); toast('Lead archived \u2014 holds for ' + ARCHIVE_HOLD_BUSINESS_DAYS + ' business days'); render();
  });
  document.querySelectorAll('[data-unarchive-lead]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const lead = DB.leads.find(l=>l.id===b.dataset.unarchiveLead);
    if(!lead) return;
    lead.archived = false; lead.archivedAt = '';
    logAssignmentMovement(lead, 'unarchived', lead.assignedTo, lead.assignedTo, 'Unarchived by assigned rep');
    queueSave(); toast('Lead unarchived'); render();
  });

  document.querySelectorAll('[data-open-lead]').forEach(b=>b.onclick=()=>openLeadDetail(b.dataset.openLead));
  document.querySelectorAll('[data-lead]').forEach(el=>el.onclick=()=>openLeadDetail(el.dataset.lead));
  document.querySelectorAll('[data-convert-lead]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); convertLead(b.dataset.convertLead); });
  document.querySelectorAll('[data-rr-assign]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const lead = DB.leads.find(l=>l.id===b.dataset.rrAssign);
    if(!lead) return;
    if(autoReassignFromMaster(lead, 'Manual single-lead round-robin assign from Master Leads List')){
      queueSave(); toast(`Assigned to ${repDisplayName(lead.assignedTo)} (round-robin)`); render();
    } else {
      toast('No available reps with recent call activity to round-robin to \u2014 try Auto-Assign to Target instead.', true);
    }
  });
  document.querySelectorAll('[data-manual-assign]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    openManualAssignModal(b.dataset.manualAssign);
  });
  document.querySelectorAll('[data-del-lead]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const target = DB.leads.find(l=>l.id===b.dataset.delLead);
    if(target && target.locked){ toast('This lead is locked \u2014 a Super Admin must unlock it before it can be deleted.', true); return; }
    if(confirm('Delete this lead?')){ DB.leads = DB.leads.filter(l=>l.id!==b.dataset.delLead); queueSave(); toast('Lead deleted'); render(); }
  });

  // Contacts
  const contactSearch = document.getElementById('contactSearch');
  if(contactSearch) contactSearch.oninput = ()=>{
    const val = contactSearch.value;
    viewContacts._q = val;
    document.getElementById('mainArea').innerHTML = viewContacts();
    bindPageEvents();
    const freshInput = document.getElementById('contactSearch');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(val.length, val.length); }
  };
  const addContactBtn = document.getElementById('addContactBtn');
  if(addContactBtn) addContactBtn.onclick = ()=>addOrEditContact(null);
  document.querySelectorAll('[data-edit-contact]').forEach(b=>b.onclick=()=>addOrEditContact(b.dataset.editContact));
  document.querySelectorAll('[data-del-contact]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this contact?')){ DB.contacts = DB.contacts.filter(c=>c.id!==b.dataset.delContact); queueSave(); toast('Contact deleted'); render(); }
  });

  // Loans
  const addLoanBtn = document.getElementById('addLoanBtn');
  if(addLoanBtn) addLoanBtn.onclick = addLoan;
  document.querySelectorAll('[data-loan]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); loanDetail(el.dataset.loan); });

  // Tasks
  const addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn) addTaskBtn.onclick = ()=>addOrEditTask(null);
  document.querySelectorAll('[data-open-task]').forEach(b=>b.onclick=()=>openTaskDetail(b.dataset.openTask));
  document.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>openTaskDetail(el.dataset.task));
  document.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    if(confirm('Delete this task?')){ DB.tasks = DB.tasks.filter(t=>t.id!==b.dataset.delTask); queueSave(); toast('Task deleted'); render(); }
  });

  // Campaigns
  const addCampaignBtn = document.getElementById('addCampaignBtn');
  if(addCampaignBtn) addCampaignBtn.onclick = ()=>addOrEditCampaign(null);
  document.querySelectorAll('[data-edit-campaign]').forEach(b=>b.onclick=()=>addOrEditCampaign(b.dataset.editCampaign));
  document.querySelectorAll('[data-del-campaign]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this campaign?')){ DB.campaigns = DB.campaigns.filter(c=>c.id!==b.dataset.delCampaign); queueSave(); toast('Campaign deleted'); render(); }
  });

  // Automations
  const addAutomationBtn = document.getElementById('addAutomationBtn');
  if(addAutomationBtn) addAutomationBtn.onclick = addAutomationModal;
  document.querySelectorAll('[data-toggle-automation]').forEach(cb=>{
    cb.onchange = ()=>{
      const a = DB.automations.find(a=>a.id===cb.dataset.toggleAutomation);
      if(a){ a.active = cb.checked; queueSave(); toast(a.active?'Automation enabled':'Automation disabled'); }
    };
  });
  document.querySelectorAll('[data-del-automation]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this automation?')){ DB.automations = DB.automations.filter(a=>a.id!==b.dataset.delAutomation); queueSave(); toast('Automation deleted'); render(); }
  });

  // Reps
  const addRepBtn = document.getElementById('addRepBtn');
  if(addRepBtn) addRepBtn.onclick = ()=>addOrEditRep(null);
  document.querySelectorAll('[data-edit-rep]').forEach(b=>b.onclick=()=>addOrEditRep(b.dataset.editRep));
  document.querySelectorAll('[data-toggle-available]').forEach(cb=>{
    cb.onchange = ()=>{
      const r = DB.reps.find(r=>String(r.id)===String(cb.dataset.toggleAvailable));
      if(!r) return;
      r.unavailable = !cb.checked;
      queueSave(); toast(r.unavailable ? esc(r.name)+' marked unavailable \u2014 skipped by round-robin' : esc(r.name)+' marked available'); render();
    };
  });
  document.querySelectorAll('[data-del-rep]').forEach(b=>b.onclick=()=>{
    if(!isAdmin()) return;
    if(confirm('Delete this rep? Their historical production stays attached to their name on past leads/loans.')){
      DB.reps = DB.reps.filter(r=>String(r.id)!==String(b.dataset.delRep));
      queueSave(); toast('Rep deleted'); render();
    }
  });

  // Super Admin tab
  document.querySelectorAll('[data-adminsub]').forEach(b=>{
    b.onclick = ()=>{ adminSubTab = b.dataset.adminsub; render(); };
  });
  const autoAssignBtn = document.getElementById('autoAssignBtn');
  if(autoAssignBtn) autoAssignBtn.onclick = openAutoAssignModal;
  const runSlaSweepBtn = document.getElementById('runSlaSweepBtn');
  if(runSlaSweepBtn) runSlaSweepBtn.onclick = ()=>{
    const result = runMasterLeadsSLASweep();
    toast(`SLA sweep: ${result.reverted72} reverted (72h no-touch), ${result.reassigned} round-robin reassigned, ${result.archiveExpired} archive holds expired.`);
    render();
  };
  document.querySelectorAll('[data-toggle-admin]').forEach(cb=>{
    cb.onchange = ()=>{
      const r = DB.reps.find(r=>String(r.id)===String(cb.dataset.toggleAdmin));
      if(!r) return;
      r.isSuperAdmin = cb.checked;
      if(currentRep && String(currentRep.id)===String(r.id)) currentRep = r;
      queueSave(); toast(r.isSuperAdmin ? esc(r.name)+' is now a Super Admin' : esc(r.name)+' is no longer a Super Admin'); render();
    };
  });
  document.querySelectorAll('[data-perm-role]').forEach(cb=>{
    cb.onchange = ()=>{
      const roleName = cb.dataset.permRole, featureId = cb.dataset.permFeature;
      let row = (DB.permissions||[]).find(p=>p.roleName===roleName);
      if(!row){
        row = { id: nextId(), createdAt: new Date().toISOString(), roleName, enabledFeatures: LOS_DEFAULT_PERMISSIONS[roleName] ? LOS_DEFAULT_PERMISSIONS[roleName].slice() : [] };
        DB.permissions.push(row);
      }
      if(cb.checked){ if(!row.enabledFeatures.includes(featureId)) row.enabledFeatures.push(featureId); }
      else { row.enabledFeatures = row.enabledFeatures.filter(f=>f!==featureId); }
      queueSave(); toast(`${roleName}: ${LOS_FEATURES.find(f=>f.id===featureId).label} ${cb.checked?'enabled':'disabled'}`);
    };
  });
}

/* --------------------------------- reps / login ------------------------------------------- */

async function ensureRepsSeeded(){
  // Critical guard: only seed a fresh rep roster after a load that actually
  // succeeded. Seeding on a failed load (DB silently reset to empty) is
  // exactly what caused repeated duplicate rep batches in the past — a
  // transient network/deployment hiccup should never create new data.
  if(!lastLoadSucceeded) return;
  if(DB.reps && DB.reps.length) return;
  DB.reps = REPS_SEED.map(r=>({ id: nextId(), createdAt: new Date().toISOString(), ...r }));
  try{
    for(const rep of DB.reps){ await apiUpsert('Reps', rep); }
    lastSyncedIds.reps = new Set(DB.reps.map(r=>r.id));
  }catch(e){
    toast('Could not save the rep roster to Google Sheets.', true);
  }
}

function showLoginModal(){
  const reps = (DB.reps||[]).slice().sort((a,b)=>a.repNumber-b.repNumber);
  openModal('Log In \u2014 Pedison USA Platform', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">Select your rep number and enter your PIN. This identifies who's logging calls and notes, and drives your individual KPI dashboard.</p>
    <div class="field"><label>Rep</label><select id="login_rep">${reps.map(r=>`<option value="${r.id}">#${r.repNumber} \u2014 ${esc(r.name)}</option>`).join('')}</select></div>
    <div class="field"><label>PIN</label><input type="text" id="login_pin" placeholder="Enter your PIN" autocomplete="off"></div>
    <div id="login_error" style="color:var(--red);font-size:11px;display:none;">Incorrect PIN \u2014 try again.</div>
  `, `<button class="btn" id="loginBtn">Log In</button>`, true);

  document.getElementById('loginBtn').onclick = ()=>{
    const repId = document.getElementById('login_rep').value;
    const pin = document.getElementById('login_pin').value.trim();
    const rep = DB.reps.find(r=>String(r.id)===String(repId));
    if(!rep || String(rep.pin).trim() !== String(pin).trim()){
      console.warn('Login mismatch \u2014 stored PIN for this rep (from the Sheet, as loaded):', JSON.stringify(rep ? rep.pin : undefined), 'typeof:', rep ? typeof rep.pin : 'n/a', '| you typed:', JSON.stringify(pin));
      document.getElementById('login_error').style.display = 'block';
      return;
    }
    currentRep = rep;
    modalLocked = false;
    leadsRepTab = 'live'; // always land on the Live Leads Window after logging in
    liveLeadsWindowSize = LIVE_LEADS_CAP;
    closeModal();
    render();
  };
  document.getElementById('login_pin').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
}

function switchUser(){
  currentRep = null;
  showLoginModal();
}

/* --------------------------------- boot ------------------------------------------- */

(async function init(){
  await loadDB();
  if(!lastLoadSucceeded){
    document.getElementById('mainArea').innerHTML = `
      <div class="box" style="max-width:520px;margin:60px auto;text-align:center;">
        <h3 style="color:var(--red);">Could not load data from Google Sheets</h3>
        <p style="color:var(--grey);font-size:12px;">This usually means the Web App URL, API secret, or a sheet tab is missing or out of date. Nothing has been changed \u2014 it's safe to just reload once the connection is fixed.</p>
        <button class="btn" onclick="location.reload()">Reload</button>
      </div>`;
    return;
  }
  await ensureRepsSeeded();
  render();
  showLoginModal();
})();
</script>
