<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedison USA Platform</title>
<style>
  :root{
    --navy:#1E7145;       /* primary brand GREEN (chrome, primary buttons) */
    --navy-dark:#154F31;  /* dark green (nav bg, hover) */
    --blue:#1F6FA8;       /* brand BLUE (secondary actions, info) */
    --blue-light:#DCEAF3;
    --orange:#E07B26;     /* brand ORANGE (accents, active states, warnings) */
    --orange-light:#FBE7D2;
    --ltblue:#DCEFE3;     /* light green-tint alt background */
    --alt:#F1F8F3;
    --red:#D64545;
    --grey:#555555;
    --border:#cfe0d3;
    --white:#ffffff;
    --green:#1E7145;
    --amber:#E07B26;
    --purple:#1F6FA8;
    --pink:#1F6FA8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Verdana, Arial, sans-serif;
    background:var(--alt);
    color:#1a1a1a;
    font-size:13px;
  }
  a{color:var(--navy);}

  header{
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    flex-wrap:wrap;
    gap:8px;
  }
  header .brand{ display:flex; align-items:baseline; gap:10px; }
  header .brand h1{ font-size:16px; margin:0; letter-spacing:.3px; font-weight:bold; }
  header .brand span.tag{ font-size:10px; color:var(--ltblue); text-transform:uppercase; letter-spacing:1px; }
  #orgSelect{ background:var(--navy-dark); color:#fff; border:1px solid #33628f; padding:5px 8px; font-family:inherit; font-size:12px; border-radius:3px; }

  nav{ background:var(--navy-dark); display:flex; gap:2px; padding:0 14px; flex-wrap:wrap; }
  nav button{ background:transparent; border:none; color:#cdddf2; padding:9px 14px; font-family:inherit; font-size:12px; cursor:pointer; border-bottom:3px solid transparent; }
  nav button:hover{ color:#fff; }
  nav button.active{ color:#fff; border-bottom:3px solid var(--orange); font-weight:bold; }

  main{ padding:16px; max-width:1500px; margin:0 auto; }

  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .panel-head h2{ margin:0; color:var(--navy); font-size:16px; }
  .panel-head .sub{ color:var(--grey); font-size:11px; margin-top:2px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=search], input[type=number], input[type=date], input[type=email], select, textarea{
    font-family:inherit; font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:3px; background:#fff;
  }
  input[type=search]{ min-width:180px; }

  button.btn{ background:var(--navy); color:#fff; border:none; padding:7px 14px; border-radius:3px; font-family:inherit; font-size:12px; cursor:pointer; }
  button.btn:hover{ background:var(--navy-dark); }
  button.btn.secondary{ background:#fff; color:var(--blue); border:1px solid var(--blue); }
  button.btn.secondary:hover{ background:var(--blue-light); }
  button.btn.danger{ background:#fff; color:var(--red); border:1px solid var(--red); }
  button.btn.danger:hover{ background:#fdeaea; }
  button.btn.accent{ background:var(--orange); color:#fff; }
  button.btn.accent:hover{ background:#c4671d; }
  button.btn.small{ padding:4px 9px; font-size:11px; }

  /* view switch (Monday-style tab pills) */
  .view-switch{ display:flex; background:#fff; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .view-switch button{ background:#fff; border:none; padding:6px 12px; font-size:11px; font-family:inherit; cursor:pointer; color:var(--navy); border-right:1px solid var(--border); }
  .view-switch button:last-child{ border-right:none; }
  .view-switch button.active{ background:var(--navy); color:#fff; font-weight:bold; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
  .card{ background:#fff; border:1px solid var(--border); border-left:4px solid var(--navy); border-radius:4px; padding:12px 14px; }
  .card .label{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--grey); }
  .card .value{ font-size:22px; font-weight:bold; color:var(--navy); margin-top:4px; }
  .card .foot{ font-size:11px; color:var(--grey); margin-top:2px; }

  .grid2{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; }
  @media (max-width:900px){ .grid2{ grid-template-columns:1fr; } }

  .box{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:12px 14px; }
  .box h3{ margin:0 0 8px 0; color:var(--navy); font-size:13px; border-bottom:1px solid var(--ltblue); padding-bottom:6px; }

  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11px; }
  .bar-row .bar-label{ width:150px; flex-shrink:0; color:var(--grey); }
  .bar-track{ flex:1; background:var(--alt); border-radius:3px; height:14px; overflow:hidden; }
  .bar-fill{ background:var(--navy); height:100%; }
  .bar-row .bar-count{ width:26px; text-align:right; font-weight:bold; color:var(--navy); }

  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); }
  thead th{ background:var(--ltblue); color:var(--navy); text-align:left; padding:8px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--border); }
  tbody td{ padding:8px 10px; border-bottom:1px solid #eef0f4; font-size:12px; vertical-align:top; }
  tbody tr:hover{ background:var(--alt); }
  .empty-row td{ text-align:center; color:var(--grey); padding:26px; font-style:italic; }

  .pill{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; cursor:default; border:none; font-family:inherit; }
  .pill.grey{ background:#e7e7e7; color:#555; }
  .pill.blue{ background:var(--blue-light); color:var(--blue); }
  .pill.green{ background:#dff3e6; color:var(--green); }
  .pill.red{ background:#fbdcdc; color:var(--red); }
  .pill.amber{ background:var(--orange-light); color:var(--orange); }
  .pill.purple{ background:var(--blue-light); color:var(--blue); }
  .pill.pink{ background:var(--blue-light); color:var(--blue); }
  .pill.clickable{ cursor:pointer; }
  .pill.clickable:hover{ outline:2px solid rgba(31,78,121,.35); }

  /* status dropdown popover for inline editing */
  .status-pop{ position:absolute; z-index:80; background:#fff; border:1px solid var(--border); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.18); padding:5px; min-width:150px; }
  .status-pop .opt{ padding:5px 8px; font-size:11px; cursor:pointer; border-radius:3px; margin-bottom:2px; }
  .status-pop .opt:hover{ background:var(--alt); }

  .row-actions{ display:flex; gap:6px; }
  .link-btn{ background:none; border:none; color:var(--navy); cursor:pointer; font-size:11px; padding:0; text-decoration:underline; }
  .link-btn.red{ color:var(--red); }

  .avatar{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--navy); color:#fff; font-size:9px; font-weight:bold; margin-right:5px; vertical-align:middle; }

  /* ---------- Kanban ---------- */
  .kanban{ display:flex; gap:10px; overflow-x:auto; padding-bottom:10px; }
  .kcol{ background:#fff; border:1px solid var(--border); border-radius:4px; min-width:220px; flex-shrink:0; }
  .kcol-head{ color:#fff; padding:8px 10px; font-size:11px; font-weight:bold; border-radius:4px 4px 0 0; display:flex; justify-content:space-between; }
  .kcol-body{ padding:8px; min-height:60px; display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto; }
  .kcard{ background:var(--alt); border:1px solid var(--border); border-left:3px solid var(--navy); border-radius:3px; padding:8px; font-size:11px; cursor:pointer; }
  .kcard:hover{ border-left-color:var(--orange); background:#fff; }
  .kcard .kc-num{ font-weight:bold; color:var(--navy); }
  .kcard .kc-amt{ color:var(--green); font-weight:bold; margin-top:2px; }
  .kcard .kc-org{ color:var(--grey); font-size:10px; margin-top:4px; }

  /* ---------- Grouped board (Monday-style) ---------- */
  .group-block{ margin-bottom:14px; border:1px solid var(--border); border-radius:4px; overflow:hidden; background:#fff; }
  .group-title-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px; cursor:pointer; color:#fff; }
  .group-title-row .gt-left{ display:flex; align-items:center; gap:8px; font-weight:bold; font-size:12px; }
  .group-title-row .gt-caret{ display:inline-block; transition:transform .15s; }
  .group-title-row.collapsed .gt-caret{ transform:rotate(-90deg); }
  .group-progress-wrap{ display:flex; align-items:center; gap:8px; font-size:10px; }
  .group-progress-track{ width:110px; background:rgba(255,255,255,.35); border-radius:3px; height:8px; overflow:hidden; }
  .group-progress-fill{ background:#fff; height:100%; }
  .group-body table{ border:none; }
  .group-body.hidden{ display:none; }

  /* ---------- Timeline / Gantt ---------- */
  .timeline-wrap{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:14px; overflow-x:auto; }
  .tl-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:11px; }
  .tl-label{ width:220px; flex-shrink:0; }
  .tl-label .tl-num{ font-weight:bold; color:var(--navy); }
  .tl-label .tl-sub{ color:var(--grey); font-size:10px; }
  .tl-track{ position:relative; flex:1; height:20px; background:var(--alt); border-radius:3px; min-width:400px; }
  .tl-bar{ position:absolute; top:2px; height:16px; border-radius:3px; }
  .tl-axis{ display:flex; margin-left:230px; font-size:9px; color:var(--grey); border-top:1px dashed var(--border); padding-top:4px; margin-top:6px; }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,30,45,.55); display:none; align-items:flex-start; justify-content:center; padding:40px 14px; overflow-y:auto; z-index:50; }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:5px; width:100%; max-width:560px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .modal-head{ background:var(--navy); color:#fff; padding:12px 16px; border-radius:5px 5px 0 0; display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3{ margin:0; font-size:14px; }
  .modal-head button{ background:none; border:none; color:#fff; font-size:16px; cursor:pointer; }
  .modal-body{ padding:14px 16px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ padding:12px 16px; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:11px; color:var(--grey); margin-bottom:3px; font-weight:bold; }
  .field input, .field select, .field textarea{ width:100%; }
  .field textarea{ min-height:60px; resize:vertical; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .detail-section{ margin-bottom:14px; }
  .detail-section h4{ margin:0 0 6px 0; color:var(--navy); font-size:12px; border-bottom:1px solid var(--ltblue); padding-bottom:4px; }
  .kv{ display:grid; grid-template-columns:120px 1fr; gap:4px 8px; font-size:12px; margin-bottom:2px;}
  .kv .k{ color:var(--grey); }
  .activity-item{ font-size:11px; padding:6px 0; border-bottom:1px dashed #eee; }
  .activity-item .ts{ color:var(--grey); font-size:10px; }
  .stage-btns{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

  /* updates / comments thread */
  .update-item{ background:var(--alt); border-radius:4px; padding:7px 9px; margin-bottom:7px; font-size:11px; }
  .update-item .u-head{ display:flex; justify-content:space-between; color:var(--grey); font-size:10px; margin-bottom:3px; }
  .update-compose{ display:flex; gap:6px; margin-top:8px; }
  .update-compose textarea{ flex:1; min-height:40px; }

  /* automations */
  .automation-row{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .automation-desc{ font-size:12px; }
  .automation-desc b{ color:var(--navy); }
  .automation-toggle{ display:flex; align-items:center; gap:6px; font-size:11px; }
  .automation-flow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--alt); border:1px dashed var(--border); border-radius:4px; padding:10px; margin-bottom:10px; font-size:11px; }
  .automation-flow select, .automation-flow input{ font-size:11px; padding:5px 6px; }
  .automation-chip{ background:var(--navy); color:#fff; padding:4px 9px; border-radius:10px; font-size:10px; }

  /* ---------- Leaderboard / KPI ---------- */
  .lb-row{ display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid #eef0f4; }
  .lb-rank{ width:26px; text-align:center; font-weight:bold; color:var(--grey); font-size:13px; }
  .lb-rank.medal-1{ color:#c9971f; font-size:17px; }
  .lb-rank.medal-2{ color:#8a97a3; font-size:16px; }
  .lb-rank.medal-3{ color:#b56a35; font-size:15px; }
  .lb-name{ width:130px; flex-shrink:0; font-weight:bold; font-size:12px; }
  .lb-track{ flex:1; background:var(--alt); border-radius:3px; height:16px; overflow:hidden; }
  .lb-fill{ height:100%; background:var(--orange); }
  .lb-value{ width:90px; text-align:right; font-size:11px; font-weight:bold; color:var(--navy); }
  .kpi-select{ margin-left:auto; }

  .call-stats-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .call-stat-chip{ background:var(--alt); border:1px solid var(--border); border-radius:4px; padding:6px 10px; font-size:11px; text-align:center; min-width:64px; }
  .call-stat-chip .csc-num{ font-size:16px; font-weight:bold; color:var(--navy); }
  .call-stat-chip .csc-lbl{ color:var(--grey); font-size:9px; text-transform:uppercase; }
  .log-btns{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .log-btns button{ background:var(--blue-light); color:var(--blue); border:1px solid var(--blue); border-radius:3px; font-size:11px; padding:5px 9px; cursor:pointer; font-family:inherit; }
  .log-btns button:hover{ background:var(--blue); color:#fff; }

  #toast{ position:fixed; bottom:18px; right:18px; background:var(--navy); color:#fff; padding:10px 16px; border-radius:4px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.25); display:none; z-index:100; }
  #toast.show{ display:block; }

  footer{ text-align:center; color:var(--grey); font-size:10px; padding:20px; }
  .loading-note{ text-align:center; padding:30px; color:var(--grey); font-style:italic; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>PEDISON USA</h1>
    <span class="tag">Unified Platform &mdash; LOS &middot; CRM &middot; Leads &middot; Marketing &middot; KPIs &amp; Leaderboard</span>
  </div>
  <div>
    <select id="orgSelect"></select>
  </div>
</header>

<nav id="tabNav"></nav>

<main id="mainArea">
  <div class="loading-note">Loading your data&hellip;</div>
</main>

<footer>Pedison USA Platform &mdash; data is stored in the shared Pedison CRM Google Sheet and visible to everyone with the sheet/app.</footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div id="toast"></div>

<script>
/* =========================================================================
   PEDISON USA PLATFORM v2
   Single-file HTML/JS app: CRM, Lead Management, Loan Origination/Servicing
   (LOS) pipeline, Marketing campaigns, plus Monday.com-style board features:
   Table / Kanban / Timeline views, groupable boards with progress bars,
   inline status editing, per-item Updates threads, and Automations.
   Persistent storage: Google Sheets, via the Web App API defined in
   Pedison_CRM_Sheets_Code.gs (WEB_APP_URL / API_SECRET below).
   ========================================================================= */

// Google Sheets Web App (see Pedison_CRM_Sheets_Code.gs) backing this app.
// API_SECRET must match the API_SECRET constant in that script exactly.
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxeLJoOA4u5xO9SGxWi3SqI8ZJp8CnK61ShIx0UTkhwRXRnpL3sKmmHBHafDUQvgnKX/exec';
const API_SECRET = 'CHANGE_ME_pedison_2026_shared_secret';
const ENTITY_SHEET = { contacts:'Contacts', leads:'Leads', loans:'Loans', tasks:'Tasks', campaigns:'Campaigns', automations:'Automations' };

const ORGS = ['Pedison USA', 'NCCB Credit', 'Allion Fund 1', 'Bridge Gate Capital'];

const LOAN_STAGES = [
  'Application Received', 'Docs Collection', 'Underwriting',
  'Conditional Approval', 'Approved', 'Closing', 'Funded',
  'Servicing', 'Closed / Paid Off'
];
const LOAN_STAGE_COLORS = {
  'Application Received':'#1F6FA8', 'Docs Collection':'#3A80B8', 'Underwriting':'#E07B26',
  'Conditional Approval':'#D68A1F', 'Approved':'#c9a227', 'Closing':'#8FA83B',
  'Funded':'#1E7145', 'Servicing':'#154F31', 'Closed / Paid Off':'#555555'
};

const LEAD_STATUSES = ['New','Contacted','Qualifying','Qualified','Nurturing','Disqualified','Converted','Lost'];
const LEAD_STATUS_PILL = {New:'blue', Contacted:'amber', Qualifying:'amber', Qualified:'green', Nurturing:'blue', Converted:'green', Lost:'red', Disqualified:'red'};
const LEAD_STATUS_COLOR = {New:'#1F6FA8', Contacted:'#E07B26', Qualifying:'#D68A1F', Qualified:'#1E7145', Nurturing:'#3A80B8', Converted:'#1E7145', Lost:'#D64545', Disqualified:'#D64545'};

const LEAD_CHANNELS = ['Instantly Email','Apollo','UCC Filing','CallRail Inbound','Website Form','Referral','Cold Outreach','Event','Other'];
const CONTACT_TYPES = ['Borrower','Investor','Broker','Referral Partner','Title Company / Attorney','Vendor','JV Partner','Other'];
const LOAN_PRODUCTS = ['Bridge Loan','Transactional Funding','Fix and Flip','Construction','DSCR Rental','UCC Merchant Advance','Allion Capital Raise','Credit Service (NCCB)','Other'];

const TASK_PRIORITIES = ['Low','Normal','High','Urgent'];
const TASK_PRIORITY_PILL = {Low:'grey', Normal:'blue', High:'amber', Urgent:'red'};
const TASK_STATUSES = ['Open','In Progress','Complete','Canceled'];
const TASK_STATUS_PILL = {Open:'blue', 'In Progress':'amber', Complete:'green', Canceled:'grey'};
const TASK_STATUS_COLOR = {Open:'#1F6FA8', 'In Progress':'#E07B26', Complete:'#1E7145', Canceled:'#8a93a3'};

const CAMPAIGN_CHANNELS = ['Instantly Email','SMS','CallRail Tracking','Direct'];
const CAMPAIGN_STATUSES = ['Draft','Active','Paused','Completed'];
const CAMPAIGN_STATUS_PILL = {Draft:'grey', Active:'green', Paused:'amber', Completed:'blue'};

let DB = null;
let currentTab = 'dashboard';
let currentOrgFilter = 'All';
let saveTimer = null;

// board view + grouping state per tab (Monday-style "view switch")
let viewState = { leads:'table', loans:'kanban', tasks:'table', campaigns:'table' };
let groupState = { leads:'none', loans:'stage', tasks:'status', campaigns:'status' };
let collapsedGroups = {}; // key: tab+groupName -> true/false
let leaderboardMetric = 'fundedVolume';

function emptyDB(){
  return { contacts:[], leads:[], loans:[], tasks:[], campaigns:[], automations:[], seq:1 };
}

function nextId(){ return 'id' + (DB.seq++) + '_' + Math.random().toString(36).slice(2,7); }

/* ---------------------------- storage (Google Sheets API) --------------- */

// Tracks which ids were present in each sheet as of the last successful
// sync, so saveDB() can tell "removed from DB" apart from "never synced"
// and issue the matching delete calls.
let lastSyncedIds = { contacts:new Set(), leads:new Set(), loans:new Set(), tasks:new Set(), campaigns:new Set(), automations:new Set() };
let syncing = false;

async function apiGetAll(){
  const res = await fetch(`${WEB_APP_URL}?key=${encodeURIComponent(API_SECRET)}`);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
// Sent as text/plain (not application/json) so the browser treats this as a
// "simple request" and skips the CORS preflight — Apps Script Web Apps
// don't answer OPTIONS preflight requests, so a real application/json
// Content-Type here would make every save silently fail.
async function apiUpsert(sheet, record){
  const res = await fetch(WEB_APP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ key: API_SECRET, sheet, action:'upsert', record })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function apiDelete(sheet, id){
  const res = await fetch(WEB_APP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ key: API_SECRET, sheet, action:'delete', record:{id} })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function loadDB(){
  try{
    const data = await apiGetAll();
    DB = emptyDB();
    Object.keys(ENTITY_SHEET).forEach(key=>{ DB[key] = data[key] || []; });
    Object.keys(ENTITY_SHEET).forEach(key=>{ lastSyncedIds[key] = new Set(DB[key].map(r=>r.id)); });
  }catch(e){
    DB = emptyDB();
    toast('Could not load data from Google Sheets \u2014 check WEB_APP_URL / API_SECRET.', true);
  }

  if(!DB.automations) DB.automations = [];
  ['contacts','leads','loans','tasks','campaigns'].forEach(k=>{
    if(!DB[k]) DB[k] = [];
    DB[k].forEach(item=>{ if(!item.comments) item.comments = []; });
  });
  DB.leads.forEach(l=>{
    if(l.calls===undefined) l.calls = 0;
    if(l.texts===undefined) l.texts = 0;
    if(l.emails===undefined) l.emails = 0;
    if(l.conversations===undefined) l.conversations = 0;
  });
}

// Upserts every current record in each sheet, then deletes any record that
// was synced before but is no longer present in DB (i.e. was deleted
// locally). Runs on a short debounce (queueSave) so rapid edits collapse
// into one sync pass instead of one request per keystroke.
async function saveDB(){
  if(syncing) { queueSave(); return; } // a sync is already running — try again shortly
  syncing = true;
  try{
    for(const key of Object.keys(ENTITY_SHEET)){
      const sheet = ENTITY_SHEET[key];
      const current = DB[key] || [];
      const currentIds = new Set(current.map(r=>r.id));
      for(const record of current){ await apiUpsert(sheet, record); }
      for(const oldId of lastSyncedIds[key]){
        if(!currentIds.has(oldId)) await apiDelete(sheet, oldId);
      }
      lastSyncedIds[key] = currentIds;
    }
  }catch(e){
    toast('Sync to Google Sheets failed \u2014 check your connection and try again.', true);
  }
  syncing = false;
}
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveDB, 600); }

/* ------------------------------ helpers --------------------------------- */

function money(n){ n = Number(n)||0; return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0}); }
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '\u2014'; const dt=new Date(d); if(isNaN(dt)) return '\u2014'; return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(d){ const dt=new Date(d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function initials(name){ if(!name) return '?'; const p=name.trim().split(/\s+/); return ((p[0]||'')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? 'var(--red)' : 'var(--navy)';
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function orgFiltered(list){ if(currentOrgFilter==='All') return list; return list.filter(x=>x.org===currentOrgFilter); }
function contactName(id){ const c = DB.contacts.find(c=>c.id===id); return c ? c.name : '\u2014'; }

/* ------------------------------ loan officer / rep KPIs -------------------------------- */

const LB_METRICS = {
  fundedVolume: {label:'Funded Volume', fmt: v=>money(v)},
  loansFunded: {label:'Loans Funded', fmt: v=>String(v)},
  leadsConverted: {label:'Leads Converted', fmt: v=>String(v)},
  callsLogged: {label:'Calls Logged', fmt: v=>String(v)},
};

// Builds one production row per rep name found across loan.officer and
// lead.assignedTo fields (org-filtered), mirroring the NCCB Lead CRM's
// per-rep production/KPI approach.
function computeRepKPIs(){
  const loans = orgFiltered(DB.loans);
  const leads = orgFiltered(DB.leads);
  const names = new Set();
  loans.forEach(l=>{ if(l.officer) names.add(l.officer.trim()); });
  leads.forEach(l=>{ if(l.assignedTo) names.add(l.assignedTo.trim()); });

  return Array.from(names).map(name=>{
    const repLeads = leads.filter(l=>(l.assignedTo||'').trim()===name);
    const repLoans = loans.filter(l=>(l.officer||'').trim()===name);
    const funded = repLoans.filter(l=>l.stage==='Funded'||l.stage==='Closed / Paid Off');
    const fundedVolume = funded.reduce((s,l)=>s+(Number(l.approvedAmount||l.requestedAmount)||0),0);
    const callsLogged = repLeads.reduce((s,l)=>s+(Number(l.calls)||0),0);
    const textsLogged = repLeads.reduce((s,l)=>s+(Number(l.texts)||0),0);
    const conversationsLogged = repLeads.reduce((s,l)=>s+(Number(l.conversations)||0),0);
    const leadsConverted = repLeads.filter(l=>l.status==='Converted').length;
    return {
      name,
      leadsAssigned: repLeads.length,
      callsLogged, textsLogged, conversationsLogged,
      leadsConverted,
      loansOriginated: repLoans.length,
      loansFunded: funded.length,
      fundedVolume,
      winRate: repLoans.length ? Math.round((funded.length/repLoans.length)*100) : 0,
    };
  }).sort((a,b)=>b.fundedVolume-a.fundedVolume);
}

function leaderboardHtml(){
  const reps = computeRepKPIs();
  const metric = LB_METRICS[leaderboardMetric];
  const ranked = reps.slice().sort((a,b)=>b[leaderboardMetric]-a[leaderboardMetric]).filter(r=>r[leaderboardMetric]>0 || reps.length<=5);
  const max = Math.max(1, ...ranked.map(r=>r[leaderboardMetric]));
  const medalClass = i=> i===0?'medal-1':i===1?'medal-2':i===2?'medal-3':'';
  const medalChar = i=> i===0?'\u{1F947}':i===1?'\u{1F948}':i===2?'\u{1F949}':(i+1);
  return `
    <div class="box">
      <h3 style="display:flex;align-items:center;">Loan Officer Leaderboard
        <select class="kpi-select" id="lbMetricSelect">${Object.keys(LB_METRICS).map(k=>`<option value="${k}" ${k===leaderboardMetric?'selected':''}>${LB_METRICS[k].label}</option>`).join('')}</select>
      </h3>
      ${ranked.length===0 ? '<div class="loading-note">No production data yet \u2014 assign reps to leads and loans to populate the leaderboard.</div>' :
        ranked.map((r,i)=>`
          <div class="lb-row">
            <div class="lb-rank ${medalClass(i)}">${medalChar(i)}</div>
            <div class="lb-name"><span class="avatar">${initials(r.name)}</span>${esc(r.name)}</div>
            <div class="lb-track"><div class="lb-fill" style="width:${(r[leaderboardMetric]/max*100)||0}%"></div></div>
            <div class="lb-value">${metric.fmt(r[leaderboardMetric])}</div>
          </div>`).join('')}
    </div>`;
}

function repProductionTableHtml(){
  const reps = computeRepKPIs();
  return `
    <div class="box" style="margin-top:14px;">

function viewSwitchHtml(tab, views){
  return `<div class="view-switch">${views.map(v=>`<button data-viewswitch="${tab}:${v.id}" class="${viewState[tab]===v.id?'active':''}">${v.label}</button>`).join('')}</div>`;

function groupSelectHtml(tab, options){
  return `<select id="groupSelect_${tab}" data-groupselect="${tab}">${options.map(o=>`<option value="${o.id}" ${groupState[tab]===o.id?'selected':''}>Group by: ${o.label}</option>`).join('')}</select>`;
}
function groupKey(tab, name){ return tab+'::'+name; }

/* generic grouping helper: groups items by a field, returns [{name, color, items}] */
function groupItems(items, field, colorMap, fallbackColor){
  const groups = {};
  items.forEach(it=>{
    const key = it[field] || 'Unassigned';
    if(!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  return Object.keys(groups).map(name=>({
    name, color: (colorMap && colorMap[name]) || fallbackColor || '#1F4E79', items: groups[name]
  }));
}

  if(loans.length===0){

  }

  if(viewState.loans==='kanban'){
    const grouped = {}; LOAN_STAGES.forEach(s=>grouped[s]=[]);
    loans.forEach(l=>{ (grouped[l.stage]||(grouped[l.stage]=[])).push(l); });
    return head + `<div class="kanban">${LOAN_STAGES.map(stage=>`

      return {l, start, end};
    });
    const minT = Math.min(...withDates.map(x=>x.start));
    const maxT = Math.max(...withDates.map(x=>x.end), now);
    const span = Math.max(1, maxT - minT);
    return head + `<div class="timeline-wrap">
      ${withDates.map(x=>{
        const leftPct = ((x.start-minT)/span*100);
        const widthPct = Math.max(1.5, (x.end-x.start)/span*100);
        return `<div class="tl-row">
          <div class="tl-label"><div class="tl-num">${esc(x.l.loanNumber)}</div><div class="tl-sub">${esc(contactName(x.l.contactId))} &middot; ${esc(x.l.stage)}</div></div>
          <div class="tl-track"><div class="tl-bar" data-loan="${x.l.id}" style="left:${leftPct}%; width:${widthPct}%; background:${LOAN_STAGE_COLORS[x.l.stage]};" title="${esc(x.l.stage)}"></div></div>
        </div>`;
      }).join('')}
      <div class="tl-axis"><span>${fmtDate(minT)}</span><span style="margin-left:auto;">${fmtDate(maxT)}</span></div>
    </div>`;
  }

  // table grouped
  const gField = groupState.loans;
  const groups = groupItems(loans, gField, gField==='stage'?LOAN_STAGE_COLORS:null, '#1F4E79');
  return head + groups.map(g=>{
    const gk = groupKey('loans', g.name);
    const collapsed = !!collapsedGroups[gk];
    const fundedCount = g.items.filter(l=>l.stage==='Funded'||l.stage==='Closed / Paid Off').length;
    const pct = Math.round((fundedCount/g.items.length)*100) || 0;
    return `
    <div class="group-block">
      <div class="group-title-row ${collapsed?'collapsed':''}" style="background:${g.color}" data-grouptoggle="${gk}">
        <div class="gt-left"><span class="gt-caret">\u25BC</span> ${esc(g.name)} <span style="opacity:.85;font-weight:normal;">(${g.items.length})</span></div>
        <div class="group-progress-wrap"><span>${pct}% funded</span><div class="group-progress-track"><div class="group-progress-fill" style="width:${pct}%"></div></div></div>
      </div>
      <div class="group-body ${collapsed?'hidden':''}">
        <table>
          <thead><tr><th>Loan #</th><th>Borrower</th><th>Product</th><th>Stage</th><th>Requested</th><th>Officer</th><th>Org</th><th></th></tr></thead>
          <tbody>
            ${g.items.map(l=>`
              <tr>
                <td><strong>${esc(l.loanNumber)}</strong></td>
                <td>${esc(contactName(l.contactId))}</td>
                <td>${esc(l.productType)}</td>
                <td><span class="pill clickable blue" data-statuspop="loanstage:${l.id}" style="background:${LOAN_STAGE_COLORS[l.stage]}22;color:${LOAN_STAGE_COLORS[l.stage]};">${l.stage}</span></td>
                <td>${money(l.requestedAmount)}</td>
                <td>${esc(l.officer)||'\u2014'}</td>
                <td>${esc(l.org)}</td>
                <td class="row-actions"><button class="link-btn" data-loan="${l.id}">Open</button></td>
              </tr>`).join('')}
          </tbody>

  }

    const grouped = {}; TASK_STATUSES.forEach(s=>grouped[s]=[]);
    items.forEach(t=>{ (grouped[t.status]||(grouped[t.status]=[])).push(t); });
    return head + `<div class="kanban">${TASK_STATUSES.map(s=>`

                <td>${t.assignedTo?`<span class="avatar">${initials(t.assignedTo)}</span>`:''}${esc(t.assignedTo)||'\u2014'}</td>

const AUTOMATION_ENTITY_FIELDS = {
  lead: { label:'Lead', statusField:'status', options: LEAD_STATUSES },
  task: { label:'Task', statusField:'status', options: TASK_STATUSES },

const AUTOMATION_ACTIONS = {

};

function automationDescription(a){
  const ent = AUTOMATION_ENTITY_FIELDS[a.entity];
  let desc = `When a <b>${ent.label}</b> ${ent.statusField} changes to <b>${esc(a.toValue)}</b>, `;
  if(a.actionType==='create_task') desc += `create task "<b>${esc(a.params.title||'Follow up')}</b>"${a.params.daysOffset?` due in ${a.params.daysOffset} day(s)`:''}${a.params.assignedTo?` assigned to ${esc(a.params.assignedTo)}`:''}`;
  else if(a.actionType==='toast') desc += `show reminder "<b>${esc(a.params.message||'')}</b>"`;
  else if(a.actionType==='post_update') desc += `post update "<b>${esc(a.params.message||'')}</b>" to the item`;
  return desc;
}

function addAutomationModal(){
  const body = `
    <div class="automation-flow">
      <span class="automation-chip">WHEN</span>
      <select id="am_entity">
        <option value="lead">Lead status changes to</option>
        <option value="task">Task status changes to</option>

  `;
  openModal('New Automation', body, `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Create Automation</button>`);

  function refreshToValueOptions(){
    const ent = document.getElementById('am_entity').value;
    const opts = AUTOMATION_ENTITY_FIELDS[ent].options;
    document.getElementById('am_tovalue').innerHTML = selectOptions(opts, opts[0]);
  }
  function refreshParams(){
    const action = document.getElementById('am_action').value;
    const box = document.getElementById('am_params');
    if(action==='create_task'){
      box.innerHTML = `
        <div class="field"><label>Task Title</label><input type="text" id="am_p_title" placeholder="e.g. Prepare loan file"></div>
        <div class="field-row">
          <div class="field"><label>Due in (days)</label><input type="number" id="am_p_days" value="2" min="0"></div>
          <div class="field"><label>Assign To</label><input type="text" id="am_p_assigned" placeholder="Rep name"></div>
        </div>`;
    } else if(action==='toast'){
      box.innerHTML = `<div class="field"><label>Reminder Message</label><input type="text" id="am_p_message" placeholder="e.g. Follow up within 24 hours"></div>`;
    } else {
      box.innerHTML = `<div class="field"><label>Update Text</label><input type="text" id="am_p_message" placeholder="e.g. Moved to next stage \u2014 notify loan officer"></div>`;
    }
  }
  refreshToValueOptions(); refreshParams();
  document.getElementById('am_entity').onchange = refreshToValueOptions;
  document.getElementById('am_action').onchange = refreshParams;

  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveBtn').onclick = ()=>{
    const entity = document.getElementById('am_entity').value;
    const toValue = document.getElementById('am_tovalue').value;
    const actionType = document.getElementById('am_action').value;
    const org = document.getElementById('am_org').value;
    let params = {};

    } else {
      params = { message: document.getElementById('am_p_message').value.trim() };
    }
    DB.automations.push({ id:nextId(), entity, toValue, actionType, params, org, active:true, createdAt:new Date().toISOString() });
    queueSave(); toast('Automation created'); closeModal(); render();
  };
}

// Runs any matching automations when an entity's status/stage field changes.
function runAutomations(entityType, item, newValue){
  const rules = (DB.automations||[]).filter(a=>a.active && a.entity===entityType && a.toValue===newValue && (a.org==='All' || a.org===item.org));
  rules.forEach(a=>{
    if(a.actionType==='create_task'){
      const due = new Date();
      due.setDate(due.getDate() + (a.params.daysOffset||0));
      DB.tasks.push({
        id: nextId(), createdAt: new Date().toISOString(),
        title: a.params.title, dueDate: due.toISOString().slice(0,10),
        priority: 'Normal', status: 'Open',
        assignedTo: a.params.assignedTo || item.assignedTo || item.officer || '',
        relatedTo: item.name || item.loanNumber || item.title || '',
        org: item.org, comments: [],
      });
      toast(`Automation: created task "${a.params.title}"`);
    } else if(a.actionType==='toast'){
      toast('Reminder: ' + a.params.message);
    } else if(a.actionType==='post_update'){
      item.comments = item.comments || [];
      item.comments.push({ id: nextId(), text: a.params.message, author: 'Automation', ts: new Date().toISOString() });
    }
  });
  if(rules.length) queueSave();
}

/* ---------------------- inline status popover (Monday-style) --------------------- */

function closeStatusPop(){
  const existing = document.getElementById('statusPop');
  if(existing) existing.remove();
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('[data-statuspop]') && !e.target.closest('#statusPop')) closeStatusPop();
});

function openStatusPop(anchor, kind, id){
  closeStatusPop();
  let options, onPick, colorMap;
  if(kind==='lead'){
    const item = DB.leads.find(l=>l.id===id);
    options = LEAD_STATUSES; colorMap = LEAD_STATUS_PILL;
    onPick = (val)=>{ item.status=val; runAutomations('lead', item, val); queueSave(); toast('Status set to '+val); render(); };
  } else if(kind==='task'){
    const item = DB.tasks.find(t=>t.id===id);
    options = TASK_STATUSES; colorMap = TASK_STATUS_PILL;
    onPick = (val)=>{ item.status=val; runAutomations('task', item, val); queueSave(); toast('Status set to '+val); render(); };
  } else if(kind==='loanstage'){
    const item = DB.loans.find(l=>l.id===id);
    options = LOAN_STAGES; colorMap = null;
    onPick = (val)=>{
      item.stage=val; item.updatedAt=new Date().toISOString();
      if(val==='Funded') item.fundedAt = new Date().toISOString();
      item.stageHistory = item.stageHistory || [];
      item.stageHistory.push({stage:val, enteredAt:new Date().toISOString()});
      runAutomations('loan', item, val);
      queueSave(); toast('Stage set to '+val); render();
    };
  }
  const pop = document.createElement('div');
  pop.className = 'status-pop';
  pop.id = 'statusPop';
  pop.innerHTML = options.map(o=>`<div class="opt" data-pick="${esc(o)}">${o}</div>`).join('');
  document.body.appendChild(pop);
  const rect = anchor.getBoundingClientRect();
  pop.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  pop.style.left = (window.scrollX + rect.left) + 'px';
  pop.querySelectorAll('[data-pick]').forEach(o=>{ o.onclick=(ev)=>{ ev.stopPropagation(); onPick(o.dataset.pick); }; });
}

function bindPageEvents(){
  const lbMetricSelect = document.getElementById('lbMetricSelect');
  if(lbMetricSelect) lbMetricSelect.onchange = ()=>{ leaderboardMetric = lbMetricSelect.value; render(); };

  // view switch buttons (Table/Kanban/Timeline)
  document.querySelectorAll('[data-viewswitch]').forEach(b=>{
    b.onclick = ()=>{
      const [tab, v] = b.dataset.viewswitch.split(':');
      viewState[tab] = v; render();
    };
  });
  // group-by selects
  document.querySelectorAll('[data-groupselect]').forEach(sel=>{
    sel.onchange = ()=>{ groupState[sel.dataset.groupselect] = sel.value; render(); };
  });
  // collapsible group headers
  document.querySelectorAll('[data-grouptoggle]').forEach(row=>{
    row.onclick = ()=>{
      const gk = row.dataset.grouptoggle;
      collapsedGroups[gk] = !collapsedGroups[gk];
      render();
    };
  });
  // inline status pills
  document.querySelectorAll('[data-statuspop]').forEach(p=>{
    p.onclick = (e)=>{
      e.stopPropagation();
      const [kind, id] = p.dataset.statuspop.split(':');
      openStatusPop(p, kind, id);
    };
  });

  // Leads
  const leadSearch = document.getElementById('leadSearch');
  if(leadSearch) leadSearch.oninput = ()=>{ viewLeads._q = leadSearch.value; document.getElementById('mainArea').innerHTML = viewLeads(); bindPageEvents(); leadSearch.focus(); leadSearch.setSelectionRange(leadSearch.value.length,leadSearch.value.length); };
  const addLeadBtn = document.getElementById('addLeadBtn');
  if(addLeadBtn) addLeadBtn.onclick = ()=>addOrEditLead(null);
  const showAllLeadsBtn = document.getElementById('showAllLeadsBtn');
  if(showAllLeadsBtn) showAllLeadsBtn.onclick = ()=>{ viewLeads._showAll = !viewLeads._showAll; render(); };
  document.querySelectorAll('[data-open-lead]').forEach(b=>b.onclick=()=>openLeadDetail(b.dataset.openLead));
  document.querySelectorAll('[data-lead]').forEach(el=>el.onclick=()=>openLeadDetail(el.dataset.lead));
  document.querySelectorAll('[data-convert-lead]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); convertLead(b.dataset.convertLead); });
  document.querySelectorAll('[data-del-lead]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    if(confirm('Delete this lead?')){ DB.leads = DB.leads.filter(l=>l.id!==b.dataset.delLead); queueSave(); toast('Lead deleted'); render(); }
  });

  // Contacts
  const contactSearch = document.getElementById('contactSearch');
  if(contactSearch) contactSearch.oninput = ()=>{ viewContacts._q = contactSearch.value; document.getElementById('mainArea').innerHTML = viewContacts(); bindPageEvents(); contactSearch.focus(); contactSearch.setSelectionRange(contactSearch.value.length,contactSearch.value.length); };
  const addContactBtn = document.getElementById('addContactBtn');
  if(addContactBtn) addContactBtn.onclick = ()=>addOrEditContact(null);
  document.querySelectorAll('[data-edit-contact]').forEach(b=>b.onclick=()=>addOrEditContact(b.dataset.editContact));
  document.querySelectorAll('[data-del-contact]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this contact?')){ DB.contacts = DB.contacts.filter(c=>c.id!==b.dataset.delContact); queueSave(); toast('Contact deleted'); render(); }
  });

  // Loans
  const addLoanBtn = document.getElementById('addLoanBtn');
  if(addLoanBtn) addLoanBtn.onclick = addLoan;
  document.querySelectorAll('[data-loan]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); loanDetail(el.dataset.loan); });

  // Tasks
  const addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn) addTaskBtn.onclick = ()=>addOrEditTask(null);
  document.querySelectorAll('[data-open-task]').forEach(b=>b.onclick=()=>openTaskDetail(b.dataset.openTask));
  document.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>openTaskDetail(el.dataset.task));
  document.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    if(confirm('Delete this task?')){ DB.tasks = DB.tasks.filter(t=>t.id!==b.dataset.delTask); queueSave(); toast('Task deleted'); render(); }
  });

  // Campaigns
  const addCampaignBtn = document.getElementById('addCampaignBtn');
  if(addCampaignBtn) addCampaignBtn.onclick = ()=>addOrEditCampaign(null);
  document.querySelectorAll('[data-edit-campaign]').forEach(b=>b.onclick=()=>addOrEditCampaign(b.dataset.editCampaign));
  document.querySelectorAll('[data-del-campaign]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this campaign?')){ DB.campaigns = DB.campaigns.filter(c=>c.id!==b.dataset.delCampaign); queueSave(); toast('Campaign deleted'); render(); }
  });

  // Automations
  const addAutomationBtn = document.getElementById('addAutomationBtn');
  if(addAutomationBtn) addAutomationBtn.onclick = addAutomationModal;
  document.querySelectorAll('[data-toggle-automation]').forEach(cb=>{
    cb.onchange = ()=>{
      const a = DB.automations.find(a=>a.id===cb.dataset.toggleAutomation);
      if(a){ a.active = cb.checked; queueSave(); toast(a.active?'Automation enabled':'Automation disabled'); }
    };
  });
  document.querySelectorAll('[data-del-automation]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this automation?')){ DB.automations = DB.automations.filter(a=>a.id!==b.dataset.delAutomation); queueSave(); toast('Automation deleted'); render(); }
  });
}

/* --------------------------------- boot ------------------------------------------- */

(async function init(){
  await loadDB();
  render();
})();
</script>
</body>
</html>
