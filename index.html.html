<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedison USA Platform</title>
<style>
  :root{
    --navy:#1E7145;       /* primary brand GREEN (chrome, primary buttons) */
    --navy-dark:#154F31;  /* dark green (nav bg, hover) */
    --blue:#1F6FA8;       /* brand BLUE (secondary actions, info) */
    --blue-light:#DCEAF3;
    --orange:#E07B26;     /* brand ORANGE (accents, active states, warnings) */
    --orange-light:#FBE7D2;
    --ltblue:#DCEFE3;     /* light green-tint alt background */
    --alt:#F1F8F3;
    --red:#D64545;
    --grey:#555555;
    --border:#cfe0d3;
    --white:#ffffff;
    --green:#1E7145;
    --amber:#E07B26;
    --purple:#1F6FA8;
    --pink:#1F6FA8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:Verdana, Arial, sans-serif;
    background:var(--alt);
    color:#1a1a1a;
    font-size:13px;
  }
  a{color:var(--navy);}

  header{
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    flex-wrap:wrap;
    gap:8px;
  }
  header .brand{ display:flex; align-items:baseline; gap:10px; }
  header .logo-chip{ background:#fff; border-radius:6px; padding:4px 10px; display:inline-flex; align-items:center; }
  header .brand-logo-img{ height:26px; display:block; }
  header .brand span.tag{ font-size:10px; color:var(--ltblue); text-transform:uppercase; letter-spacing:1px; }
  #orgSelect{ background:var(--navy-dark); color:#fff; border:1px solid #33628f; padding:5px 8px; font-family:inherit; font-size:12px; border-radius:3px; }

  nav{ background:var(--navy-dark); display:flex; gap:2px; padding:0 14px; flex-wrap:wrap; }
  nav button{ background:transparent; border:none; color:#cdddf2; padding:9px 14px; font-family:inherit; font-size:12px; cursor:pointer; border-bottom:3px solid transparent; }
  nav button:hover{ color:#fff; }
  nav button.active{ color:#fff; border-bottom:3px solid var(--orange); font-weight:bold; }

  main{ padding:16px; max-width:1500px; margin:0 auto; }

  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .panel-head h2{ margin:0; color:var(--navy); font-size:16px; }
  .panel-head .sub{ color:var(--grey); font-size:11px; margin-top:2px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text], input[type=search], input[type=number], input[type=date], input[type=email], select, textarea{
    font-family:inherit; font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:3px; background:#fff;
  }
  input[type=search]{ min-width:180px; }

  button.btn{ background:var(--navy); color:#fff; border:none; padding:7px 14px; border-radius:3px; font-family:inherit; font-size:12px; cursor:pointer; }
  button.btn:hover{ background:var(--navy-dark); }
  button.btn.secondary{ background:#fff; color:var(--blue); border:1px solid var(--blue); }
  button.btn.secondary:hover{ background:var(--blue-light); }
  button.btn.danger{ background:#fff; color:var(--red); border:1px solid var(--red); }
  button.btn.danger:hover{ background:#fdeaea; }
  button.btn.accent{ background:var(--orange); color:#fff; }
  button.btn.accent:hover{ background:#c4671d; }
  button.btn.small{ padding:4px 9px; font-size:11px; }

  /* view switch (Monday-style tab pills) */
  .view-switch{ display:flex; background:#fff; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .view-switch button{ background:#fff; border:none; padding:6px 12px; font-size:11px; font-family:inherit; cursor:pointer; color:var(--navy); border-right:1px solid var(--border); }
  .view-switch button:last-child{ border-right:none; }
  .view-switch button.active{ background:var(--navy); color:#fff; font-weight:bold; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin-bottom:18px; }
  .card{ background:#fff; border:1px solid var(--border); border-left:4px solid var(--navy); border-radius:4px; padding:12px 14px; }
  .card .label{ font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--grey); }
  .card .value{ font-size:22px; font-weight:bold; color:var(--navy); margin-top:4px; }
  .card .foot{ font-size:11px; color:var(--grey); margin-top:2px; }

  .grid2{ display:grid; grid-template-columns:1.3fr 1fr; gap:14px; }
  @media (max-width:900px){ .grid2{ grid-template-columns:1fr; } }

  .box{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:12px 14px; }
  .box h3{ margin:0 0 8px 0; color:var(--navy); font-size:13px; border-bottom:1px solid var(--ltblue); padding-bottom:6px; }

  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11px; }
  .bar-row .bar-label{ width:150px; flex-shrink:0; color:var(--grey); }
  .bar-track{ flex:1; background:var(--alt); border-radius:3px; height:14px; overflow:hidden; }
  .bar-fill{ background:var(--navy); height:100%; }
  .bar-row .bar-count{ width:26px; text-align:right; font-weight:bold; color:var(--navy); }

  /* Disposition breakdown — count first, tight to the label; bar is a small secondary indicator */
  .disp-row{ display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:12px; }
  .disp-count{ width:22px; flex-shrink:0; text-align:right; font-weight:bold; color:var(--navy); }
  .disp-label{ color:#333; }
  .disp-track{ flex:1; background:var(--alt); border-radius:3px; height:8px; overflow:hidden; max-width:160px; }
  .disp-fill{ height:100%; }

  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--border); }
  thead th{ background:var(--ltblue); color:var(--navy); text-align:left; padding:8px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.4px; border-bottom:1px solid var(--border); }
  tbody td{ padding:8px 10px; border-bottom:1px solid #eef0f4; font-size:12px; vertical-align:top; }
  tbody tr:hover{ background:var(--alt); }
  .empty-row td{ text-align:center; color:var(--grey); padding:26px; font-style:italic; }

  .pill{ display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap; cursor:default; border:none; font-family:inherit; }
  .pill.grey{ background:#e7e7e7; color:#555; }
  .pill.blue{ background:var(--blue-light); color:var(--blue); }
  .pill.green{ background:#dff3e6; color:var(--green); }
  .pill.red{ background:#fbdcdc; color:var(--red); }
  .pill.amber{ background:var(--orange-light); color:var(--orange); }
  .pill.purple{ background:var(--blue-light); color:var(--blue); }
  .pill.pink{ background:var(--blue-light); color:var(--blue); }
  .pill.clickable{ cursor:pointer; }
  .pill.clickable:hover{ outline:2px solid rgba(31,78,121,.35); }

  /* status dropdown popover for inline editing */
  .status-pop{ position:absolute; z-index:80; background:#fff; border:1px solid var(--border); border-radius:4px; box-shadow:0 6px 18px rgba(0,0,0,.18); padding:5px; min-width:150px; }
  .status-pop .opt{ padding:5px 8px; font-size:11px; cursor:pointer; border-radius:3px; margin-bottom:2px; }
  .status-pop .opt:hover{ background:var(--alt); }

  .row-actions{ display:flex; gap:6px; }
  .link-btn{ background:none; border:none; color:var(--navy); cursor:pointer; font-size:11px; padding:0; text-decoration:underline; }
  .link-btn.red{ color:var(--red); }

  .avatar{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--navy); color:#fff; font-size:9px; font-weight:bold; margin-right:5px; vertical-align:middle; }

  /* ---------- Kanban ---------- */
  .kanban{ display:flex; gap:10px; overflow-x:auto; padding-bottom:10px; }
  .kcol{ background:#fff; border:1px solid var(--border); border-radius:4px; min-width:220px; flex-shrink:0; }
  .kcol-head{ color:#fff; padding:8px 10px; font-size:11px; font-weight:bold; border-radius:4px 4px 0 0; display:flex; justify-content:space-between; }
  .kcol-body{ padding:8px; min-height:60px; display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto; }
  .kcard{ background:var(--alt); border:1px solid var(--border); border-left:3px solid var(--navy); border-radius:3px; padding:8px; font-size:11px; cursor:pointer; }
  .kcard:hover{ border-left-color:var(--orange); background:#fff; }
  .kcard .kc-num{ font-weight:bold; color:var(--navy); }
  .kcard .kc-amt{ color:var(--green); font-weight:bold; margin-top:2px; }
  .kcard .kc-org{ color:var(--grey); font-size:10px; margin-top:4px; }

  /* ---------- Grouped board (Monday-style) ---------- */
  .group-block{ margin-bottom:14px; border:1px solid var(--border); border-radius:4px; overflow:hidden; background:#fff; }
  .group-title-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px; cursor:pointer; color:#fff; }
  .group-title-row .gt-left{ display:flex; align-items:center; gap:8px; font-weight:bold; font-size:12px; }
  .group-title-row .gt-caret{ display:inline-block; transition:transform .15s; }
  .group-title-row.collapsed .gt-caret{ transform:rotate(-90deg); }
  .group-progress-wrap{ display:flex; align-items:center; gap:8px; font-size:10px; }
  .group-progress-track{ width:110px; background:rgba(255,255,255,.35); border-radius:3px; height:8px; overflow:hidden; }
  .group-progress-fill{ background:#fff; height:100%; }
  .group-body table{ border:none; }
  .group-body.hidden{ display:none; }

  /* ---------- Timeline / Gantt ---------- */
  .timeline-wrap{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:14px; overflow-x:auto; }
  .tl-row{ display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:11px; }
  .tl-label{ width:220px; flex-shrink:0; }
  .tl-label .tl-num{ font-weight:bold; color:var(--navy); }
  .tl-label .tl-sub{ color:var(--grey); font-size:10px; }
  .tl-track{ position:relative; flex:1; height:20px; background:var(--alt); border-radius:3px; min-width:400px; }
  .tl-bar{ position:absolute; top:2px; height:16px; border-radius:3px; }
  .tl-axis{ display:flex; margin-left:230px; font-size:9px; color:var(--grey); border-top:1px dashed var(--border); padding-top:4px; margin-top:6px; }

  /* ---------- Modal ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,30,45,.55); display:none; align-items:flex-start; justify-content:center; padding:40px 14px; overflow-y:auto; z-index:50; }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:5px; width:100%; max-width:640px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .modal-head{ background:var(--navy); color:#fff; padding:12px 16px; border-radius:5px 5px 0 0; display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3{ margin:0; font-size:14px; }
  .modal-head button{ background:none; border:none; color:#fff; font-size:16px; cursor:pointer; }
  .modal-body{ padding:14px 16px; max-height:65vh; overflow-y:auto; }
  .modal-foot{ padding:12px 16px; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .field{ margin-bottom:10px; }
  .field label{ display:block; font-size:11px; color:var(--grey); margin-bottom:3px; font-weight:bold; }
  .field input, .field select, .field textarea{ width:100%; }
  .field textarea{ min-height:60px; resize:vertical; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .detail-section{ margin-bottom:14px; }
  .detail-section h4{ margin:0 0 6px 0; color:var(--navy); font-size:12px; border-bottom:1px solid var(--ltblue); padding-bottom:4px; }
  .kv{ display:grid; grid-template-columns:120px 1fr; gap:4px 8px; font-size:12px; margin-bottom:2px;}
  .kv-compact .kv{ margin-bottom:0; padding:3px 0; border-bottom:1px dashed #eef0f4; }
  .kv-compact .kv:last-child{ border-bottom:none; }
  .kpi-side-by-side{ gap:12px; align-items:start; }
  .kv .k{ color:var(--grey); }
  .activity-item{ font-size:11px; padding:6px 0; border-bottom:1px dashed #eee; }
  .activity-item .ts{ color:var(--grey); font-size:10px; }
  .stage-btns{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }

  /* updates / comments thread */
  .update-item{ background:var(--alt); border-radius:4px; padding:7px 9px; margin-bottom:7px; font-size:11px; }
  .update-item .u-head{ display:flex; justify-content:space-between; color:var(--grey); font-size:10px; margin-bottom:3px; }
  .update-compose{ display:flex; gap:6px; margin-top:8px; }
  .update-compose textarea{ flex:1; min-height:40px; }

  /* automations */
  .automation-row{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:10px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .automation-desc{ font-size:12px; }
  .automation-desc b{ color:var(--navy); }
  .automation-toggle{ display:flex; align-items:center; gap:6px; font-size:11px; }
  .automation-flow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--alt); border:1px dashed var(--border); border-radius:4px; padding:10px; margin-bottom:10px; font-size:11px; }
  .automation-flow select, .automation-flow input{ font-size:11px; padding:5px 6px; }
  .automation-chip{ background:var(--navy); color:#fff; padding:4px 9px; border-radius:10px; font-size:10px; }

  /* ---------- Call status color code ---------- */
  .call-status-dot{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:7px; vertical-align:middle; flex-shrink:0; }
  .call-status-legend{ display:flex; gap:16px; flex-wrap:wrap; background:#fff; border:1px solid var(--border); border-radius:4px; padding:9px 14px; margin-bottom:10px; font-size:11px; }
  .lock-badge{ font-size:12px; margin-left:4px; }

  /* ---------- Today's Call Queue ---------- */
  .call-queue-wrap{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px; margin-bottom:10px; }
  .queue-col{ background:#fff; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
  .queue-col-head{ color:#fff; padding:7px 10px; font-size:11px; font-weight:bold; }
  .queue-col-body{ max-height:220px; overflow-y:auto; padding:6px; }
  .queue-item{ background:var(--alt); border-radius:3px; padding:6px 8px; margin-bottom:5px; font-size:11px; cursor:pointer; display:flex; flex-direction:column; gap:2px; }
  .queue-item:hover{ background:var(--ltblue); }
  .queue-item-meta{ color:var(--grey); font-size:10px; }
  .queue-empty{ color:var(--grey); font-size:11px; font-style:italic; padding:8px; }

  /* ---------- Call cadence reference blocks ---------- */
  .cadence-box{ margin-bottom:10px; }
  .cadence-row{ display:grid; grid-template-columns:150px 170px 1fr; gap:10px; padding:6px 4px; font-size:11px; border-bottom:1px solid #eef0f4; align-items:center; }
  .cadence-row:last-child{ border-bottom:none; }
  .cadence-head{ font-weight:bold; color:var(--navy); text-transform:uppercase; font-size:10px; letter-spacing:.4px; border-bottom:2px solid var(--orange); }
  .cadence-label{ font-weight:bold; }
  .cadence-time{ color:var(--blue); }
  .cadence-focus{ color:var(--grey); }

  .lunch-badge{ background:var(--orange-light); color:var(--orange); border-radius:10px; padding:3px 10px; font-size:11px; font-weight:bold; }
  .lunch-badge.lunch-active{ background:var(--orange); color:#fff; }
  .sla-urgent{ color:var(--red); font-weight:bold; }

  /* ---------- Automation recipe cards (Monday.com-style trigger→action) ---------- */
  .recipe-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:10px; }
  .recipe-card{ display:flex; align-items:flex-start; gap:10px; background:var(--alt); border:1px solid var(--border); border-radius:6px; padding:10px 12px; }
  .recipe-icon{ font-size:18px; flex-shrink:0; }
  .recipe-body{ flex:1; min-width:0; }
  .recipe-when{ font-size:12px; color:#333; }
  .recipe-then{ font-size:12px; color:var(--navy); font-weight:bold; margin-top:3px; }
  .rr-pool{ display:flex; gap:8px; flex-wrap:wrap; }
  .rr-pool-chip{ background:var(--ltblue); border-radius:14px; padding:5px 12px; font-size:11px; font-weight:bold; color:var(--navy); }
  .rr-pool-count{ font-weight:normal; color:var(--grey); }
  .avail-toggle{ display:flex; align-items:center; gap:6px; font-size:11px; cursor:pointer; }
  .cs-legend-item{ display:flex; align-items:center; color:var(--grey); }

  /* ---------- Calendar / callback buckets ---------- */
  .cal-bucket{ margin-bottom:14px; border:1px solid var(--border); border-radius:4px; overflow:hidden; background:#fff; }
  .cal-bucket-head{ color:#fff; padding:8px 12px; font-weight:bold; font-size:12px; }
  .cal-row{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid #eef0f4; font-size:12px; cursor:pointer; }
  .cal-row:last-child{ border-bottom:none; }
  .cal-row:hover{ background:var(--alt); }
  .cal-row .cal-date{ width:80px; flex-shrink:0; color:var(--grey); font-size:11px; }
  .cal-row .cal-title{ flex:1; font-weight:bold; }
  .cal-row .cal-meta{ color:var(--grey); font-size:11px; }

  /* ---------- Leaderboard / KPI ---------- */
  .lb-row{ display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid #eef0f4; }
  .lb-rank{ width:26px; text-align:center; font-weight:bold; color:var(--grey); font-size:13px; }
  .lb-rank.medal-1{ color:#c9971f; font-size:17px; }
  .lb-rank.medal-2{ color:#8a97a3; font-size:16px; }
  .lb-rank.medal-3{ color:#b56a35; font-size:15px; }
  .lb-name{ width:130px; flex-shrink:0; font-weight:bold; font-size:12px; }
  .lb-track{ flex:1; background:var(--alt); border-radius:3px; height:16px; overflow:hidden; }
  .lb-fill{ height:100%; background:var(--orange); }
  .lb-value{ width:90px; text-align:right; font-size:11px; font-weight:bold; color:var(--navy); }
  .kpi-select{ margin-left:auto; }

  .call-stats-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .call-stat-chip{ background:var(--alt); border:1px solid var(--border); border-radius:4px; padding:6px 10px; font-size:11px; text-align:center; min-width:64px; }
  .call-stat-chip .csc-num{ font-size:16px; font-weight:bold; color:var(--navy); }
  .call-stat-chip .csc-lbl{ color:var(--grey); font-size:9px; text-transform:uppercase; }
  .log-btns{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .log-btns button{ background:var(--blue-light); color:var(--blue); border:1px solid var(--blue); border-radius:3px; font-size:11px; padding:5px 9px; cursor:pointer; font-family:inherit; }
  .log-btns button:hover{ background:var(--blue); color:#fff; }

  .disposition-btns{ display:flex; gap:6px; flex-wrap:wrap; }
  .disposition-btn{ border-radius:4px; font-size:11px; padding:7px 10px; cursor:pointer; font-family:inherit; font-weight:bold; border:1px solid transparent; }
  .disposition-btn.green{ background:#dff3e6; color:var(--green); border-color:var(--green); }
  .disposition-btn.green:hover{ background:var(--green); color:#fff; }
  .disposition-btn.blue{ background:var(--blue-light); color:var(--blue); border-color:var(--blue); }
  .disposition-btn.blue:hover{ background:var(--blue); color:#fff; }
  .disposition-btn.amber{ background:var(--orange-light); color:var(--orange); border-color:var(--orange); }
  .disposition-btn.amber:hover{ background:var(--orange); color:#fff; }
  .disposition-btn.grey{ background:#e7e7e7; color:#555; border-color:#aaa; }
  .disposition-btn.grey:hover{ background:#555; color:#fff; }
  .disposition-btn.red{ background:#fbdcdc; color:var(--red); border-color:var(--red); }
  .disposition-btn.red:hover{ background:var(--red); color:#fff; }

  .callback-schedule-box{ background:var(--blue-light); border:1px dashed var(--blue); border-radius:4px; padding:9px 11px; margin-top:8px; }
  .callback-schedule-box input[type=datetime-local]{ font-size:12px; padding:6px 8px; }

  .call-timer-box{ background:var(--alt); border:1px dashed var(--border); border-radius:4px; padding:8px 11px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .call-timer-live{ color:var(--red); font-weight:bold; font-size:11px; }
  .time-clock-box{ margin-bottom:14px; border-left:4px solid var(--green); }
  @keyframes clockInFlash{ 0%,100%{ background:#1F6FA8; box-shadow:0 0 0 0 rgba(31,111,168,.6); } 50%{ background:#6EC1F4; box-shadow:0 0 8px 2px rgba(110,193,244,.8); } }
  .btn.clock-in-flash{ background:#1F6FA8; color:#fff; border:none; animation:clockInFlash 1.1s ease-in-out infinite; }

  /* ---------- Sales Scripts / Objections / Definitions guide ---------- */
  .scripts-page{ font-size:14px; line-height:1.7; }
  .scripts-intro{ background:#fff; border:1px solid var(--border); border-radius:4px; padding:14px 16px; margin-bottom:14px; font-size:14px; line-height:1.7; }
  .compliance-box{ background:var(--orange-light); border:1px solid var(--orange); border-radius:4px; padding:12px 14px; margin-bottom:16px; font-size:13px; line-height:1.65; }
  .compliance-box h4{ margin:0 0 6px 0; color:#8a4d10; font-size:13px; }
  .compliance-box ul{ margin:4px 0 0 0; padding-left:18px; }
  .compliance-box li{ margin-bottom:4px; }

  .acc-item{ background:#fff; border:1px solid var(--border); border-radius:4px; margin-bottom:8px; overflow:hidden; }
  .acc-header{ display:flex; align-items:center; justify-content:space-between; padding:11px 14px; cursor:pointer; background:var(--alt); font-weight:bold; font-size:14px; color:var(--navy); }
  .acc-header:hover{ background:var(--ltblue); }
  .acc-header .acc-caret{ transition:transform .15s; flex-shrink:0; margin-left:10px; }
  .acc-header.open .acc-caret{ transform:rotate(180deg); }
  .acc-body{ padding:14px 16px; font-size:14px; line-height:1.75; display:none; }
  .acc-body.open{ display:block; }
  .acc-body p{ margin:0 0 10px 0; }
  .acc-body p:last-child{ margin-bottom:0; }
  .script-line-rep{ color:var(--navy); font-weight:bold; }
  .script-line-prospect{ color:var(--grey); font-style:italic; }

  .objection-item{ border-bottom:1px solid #eef0f4; padding:10px 0; }
  .objection-item:last-child{ border-bottom:none; }
  .objection-q{ font-weight:bold; font-size:14px; color:var(--red); margin-bottom:4px; }
  .objection-q::before{ content:"\\201C"; }
  .objection-q::after{ content:"\\201D"; }
  .objection-a{ font-size:14px; line-height:1.7; }
  .objection-a b{ color:var(--green); }

  .term-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .term-item{ font-size:14px; line-height:1.6; padding:8px 0; border-bottom:1px solid #eef0f4; }
  .term-item:last-child{ border-bottom:none; }
  .term-item .term-name{ font-weight:bold; color:var(--navy); }

  .section-heading{ color:var(--navy); font-size:16px; margin:20px 0 10px 0; padding-bottom:6px; border-bottom:2px solid var(--orange); }
  .section-heading:first-child{ margin-top:0; }

  /* condensed version embedded inside the lead popup */
  .lead-scripts-embed{ font-size:14px; line-height:1.7; }
  .lead-scripts-embed .acc-header{ font-size:13px; padding:9px 12px; }
  .lead-scripts-embed .acc-body{ font-size:13px; padding:11px 13px; }
  .lead-scripts-embed .objection-q, .lead-scripts-embed .objection-a{ font-size:13px; }

  #toast{ position:fixed; bottom:18px; right:18px; background:var(--navy); color:#fff; padding:10px 16px; border-radius:4px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.25); display:none; z-index:100; }
  #toast.show{ display:block; }

  footer{ text-align:center; color:var(--grey); font-size:10px; padding:20px; }
  .loading-note{ text-align:center; padding:30px; color:var(--grey); font-style:italic; }
</style>
</head>

const DEFINITIONS = [
  { term:'UCC-1 Filing', def:'A public record ("Uniform Commercial Code" financing statement) a lender files when a business pledges collateral for a loan. It\u2019s how our lead list is built \u2014 a UCC-1 on file means the business has financed something before and is an active, funding-experienced business.' },
  { term:'Filing Party / Secured Party', def:'The lender or finance company that filed the UCC-1 \u2014 shown in the lead\u2019s Source field and notes. Useful context: it tells you who they financed with previously, which can shape how you position our offer.' },
  { term:'Lien', def:'A legal claim against a specific business asset (equipment, receivables, etc.) that secures a loan. If the asset is sold, the lien holder gets paid first.' },
  { term:'Personal Guarantee (PG)', def:'A promise by the business owner to personally repay a business debt if the business itself can\u2019t. Most small-business financing, including ours, requires one \u2014 be upfront about this rather than let it surprise them later.' },
  { term:'MCA (Merchant Cash Advance)', def:'A lump sum advanced against future receivables/sales, repaid via daily or weekly automatic debits. Often what a skeptical prospect has been burned by \u2014 see the matching objection/rebuttal above.' },
  { term:'Factor Rate', def:'A multiplier (e.g. 1.25) instead of an interest rate, common in MCA-style products \u2014 $10,000 at a 1.25 factor rate means $12,500 owed total. Not directly comparable to APR; know the difference if a prospect brings up a competing "rate."' },
  { term:'DSCR (Debt Service Coverage Ratio)', def:'A measure of whether a business\u2019s cash flow covers its debt payments. Relevant mainly for larger/real-estate-backed deals, less so for smaller UCC-lead working capital requests.' },
  { term:'Time in Business', def:'How long the business has operated under its current ownership/structure \u2014 one of the first two qualifying questions in the cold-call opener above.' },

// Call-status color code — derived from a lead's disposition history, not a
// separately-tracked field, so it's always in sync with what's actually
// been logged. DNC always wins regardless of what's logged after it.
// ---------------------------------------------------------------------------
const CALL_STATUS_LEGEND = [
  { key:'not_called', label:'Not Called Yet', color:'#b9c2ca', rowColor:'#f4f5f6' },
  { key:'attempted', label:'Attempted \u2014 No Contact', color:'#E07B26', rowColor:'#fdf1e4' },

];

function computeLeadCallStatus(lead){
  const dispositions = (lead.comments||[]).filter(c=>c.disposition).slice().sort((a,b)=> new Date(b.ts)-new Date(a.ts));
  const hasDnc = dispositions.some(d=>d.disposition==='dnc_requested' || DEAD_NUMBER_DISPOSITIONS.includes(d.disposition));
  if(hasDnc) return CALL_STATUS_MAP.dnc;
  if(dispositions.length===0) return (lead.calls||0)>0 ? CALL_STATUS_MAP.attempted : CALL_STATUS_MAP.not_called;
  const latest = dispositions[0].disposition;
  if(CONNECTED_DISPOSITIONS.includes(latest)) return CALL_STATUS_MAP.connected;
  if(latest==='callback_scheduled') return CALL_STATUS_MAP.callback;
  return CALL_STATUS_MAP.attempted;
}

// Callback calendar — date-bucketing for the Calendar tab and for coloring
// task due dates consistently with the same red/orange/blue/grey scheme.
// ---------------------------------------------------------------------------
function dateBucket(dueDate){
  if(!dueDate) return { key:'none', label:'No Due Date', color:'#b9c2ca' };
  const due = new Date(dueDate + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((due-today)/86400000);
  if(diffDays < 0) return { key:'overdue', label:'Overdue', color:'#D64545' };
  if(diffDays === 0) return { key:'today', label:'Today', color:'#E07B26' };
  if(diffDays === 1) return { key:'tomorrow', label:'Tomorrow', color:'#1F6FA8' };
  if(diffDays <= 7) return { key:'week', label:'This Week', color:'#1E7145' };
  return { key:'later', label:'Later', color:'#8a93a3' };
}

// ---------------------------------------------------------------------------
// Business-day-aware time math — Mon-Fri only, no holiday calendar (none
// available). Used for the 72-business-hour "touch" SLA and the
// 30-business-day archive hold. Walks hour-by-hour/day-by-day rather than
// using a shortcut formula, so it stays correct across partial start/end
// days and any number of weekends in between.
function isBusinessDay(d){ const day = d.getDay(); return day !== 0 && day !== 6; }

function businessHoursElapsed(fromISO, toISO){
  if(!fromISO) return 0;
  let from = new Date(fromISO);
  const to = new Date(toISO || Date.now());
  if(to <= from) return 0;
  let hours = 0;
  const cursor = new Date(from);
  while(cursor < to){
    const next = new Date(cursor.getTime() + 3600000);
    if(isBusinessDay(cursor)) hours++;
    cursor.setTime(next.getTime());
  }
  return hours;
}

function businessDaysElapsed(fromISO, toISO){
  if(!fromISO) return 0;
  const from = new Date(fromISO); from.setHours(0,0,0,0);
  const to = new Date(toISO || Date.now()); to.setHours(0,0,0,0);
  if(to <= from) return 0;
  let days = 0;
  const cursor = new Date(from);
  while(cursor < to){
    cursor.setDate(cursor.getDate()+1);
    if(isBusinessDay(cursor)) days++;
  }
  return days;
}

// Tracks which ids were present in each sheet as of the last successful
// sync, so saveDB() can tell "removed from DB" apart from "never synced"
// and issue the matching delete calls.
let lastSyncedIds = { contacts:new Set(), leads:new Set(), loans:new Set(), tasks:new Set(), campaigns:new Set(), automations:new Set(), reps:new Set(), timeclock:new Set(), calllog:new Set(), lunch:new Set(), assignmentlog:new Set() };
let syncing = false;

async function apiGetAll(){
  // Cache-bust with a timestamp + no-store — Apps Script Web App GET
  // responses can otherwise get cached by the browser, which would keep
  // showing stale data (like an old PIN) after you edit the Sheet directly.
  const res = await fetch(`${WEB_APP_URL}?key=${encodeURIComponent(API_SECRET)}&_ts=${Date.now()}`, { cache: 'no-store' });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
// Sent as text/plain (not application/json) so the browser treats this as a
// "simple request" and skips the CORS preflight — Apps Script Web Apps
// don't answer OPTIONS preflight requests, so a real application/json
// Content-Type here would make every save silently fail.
async function apiUpsert(sheet, record){
  const res = await fetch(WEB_APP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ key: API_SECRET, sheet, action:'upsert', record })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function apiDelete(sheet, id){
  const res = await fetch(WEB_APP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ key: API_SECRET, sheet, action:'delete', record:{id} })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

  });

}

async function loadDB(){

  }

  });

// Upserts every current record in each sheet, then deletes any record that
// was synced before but is no longer present in DB (i.e. was deleted
// locally). Runs on a short debounce (queueSave) so rapid edits collapse
// into one sync pass instead of one request per keystroke.
async function saveDB(){
  if(syncing) { queueSave(); return; } // a sync is already running — try again shortly
  syncing = true;
  try{
    for(const key of Object.keys(ENTITY_SHEET)){
      const sheet = ENTITY_SHEET[key];
      const current = DB[key] || [];
      const currentIds = new Set(current.map(r=>r.id));
      for(const record of current){ await apiUpsert(sheet, record); }
      for(const oldId of lastSyncedIds[key]){
        if(!currentIds.has(oldId)) await apiDelete(sheet, oldId);
      }
      lastSyncedIds[key] = currentIds;
    }
  }catch(e){
    toast('Sync to Google Sheets failed \u2014 check your connection and try again.', true);
  }
  syncing = false;
}
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveDB, 600); }

function money(n){ n = Number(n)||0; return '$' + n.toLocaleString('en-US', {maximumFractionDigits:0}); }
function esc(s){ return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '\u2014'; const dt=new Date(d); if(isNaN(dt)) return '\u2014'; return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(d){ const dt=new Date(d); return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function initials(name){ if(!name) return '?'; const p=name.trim().split(/\s+/); return ((p[0]||'')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }
function formatPhone(phone){
  if(!phone) return '';
  const digits = String(phone).replace(/\D/g,'');
  const ten = digits.length===11 && digits[0]==='1' ? digits.slice(1) : digits;
  if(ten.length!==10) return esc(phone); // unrecognized format — show as-entered rather than mangle it
  return `(${ten.slice(0,3)}) ${ten.slice(3,6)}-${ten.slice(6)}`;
}
function formatEmail(email){
  if(!email) return '';
  return esc(String(email).trim().toLowerCase());
}
// Prefers split first/middle/last fields (the source of truth going forward);
// falls back to the legacy combined "name" field for older records that
// haven't been re-saved since the name split was added.
function fullName(p){
  const parts = [p.firstName, p.middleName, p.lastName].filter(Boolean);
  return parts.length ? parts.join(' ') : (p.name || '');
}
// Rep names get typed/edited in different cases across the sheet, the login
// roster, and whatever a comment's author field happened to capture at the
// time — compare case- and whitespace-insensitively everywhere so KPI
// matching never silently comes back empty over a capitalization mismatch.
function normalizeName(name){ return (name||'').toString().trim().toLowerCase().replace(/\s+/g,' '); }

// ---------------------------------------------------------------------------
// Rep identity — canonical key is the rep NUMBER (assigned once, never
// retyped), not the name (which gets typed differently across records —
// "Lawrence Hill" vs "LAWRENCE HILL" — and silently breaks name matching).
// Every place that stores "who this belongs to" (assignedTo, officer,
// comment author, time clock, call log) stores the rep NUMBER going
// forward. Display always resolves back to the full name via the roster.
// Legacy records that still hold a typed name (from before this change)
// are resolved by matching that name against the roster too, so old data
// keeps working without a migration.
// ---------------------------------------------------------------------------
function repByNumber(num){
  if(num===undefined || num===null || num==='') return null;
  return (DB.reps||[]).find(r=>String(r.repNumber)===String(num).trim()) || null;
}
function repByName(name){
  const norm = normalizeName(name);
  if(!norm) return null;
  return (DB.reps||[]).find(r=>normalizeName(r.name)===norm) || null;
}
// Resolves either a rep number ("115") or a legacy typed name ("Lawrence
// Hill") to the canonical identity key used for matching — the rep number
// as a string when resolvable, otherwise the normalized text as-is (so
// still-unresolved legacy names keep grouping consistently together).
function repIdentityKey(value){
  if(value===undefined || value===null || value==='') return '';
  const byNum = repByNumber(value);
  if(byNum) return String(byNum.repNumber);
  const byName = repByName(value);
  if(byName) return String(byName.repNumber);
  return normalizeName(value);
}
// Resolves a stored identity value (rep number or legacy name) to a full
// display name for dashboards/tables. Falls back to showing the raw value
// if it doesn't match any known rep (e.g. free text that was never a rep).
function repDisplayName(value){
  if(!value) return '';
  const byNum = repByNumber(value);
  if(byNum) return byNum.name;
  const byName = repByName(value);
  if(byName) return byName.name;
  return String(value).trim();
}

const LB_METRICS = {

  loansFunded: {label:'Loans Funded', fmt: v=>String(v)},
  leadsConverted: {label:'Leads Converted', fmt: v=>String(v)},

// Builds one production row per rep name found across loan.officer and
// lead.assignedTo fields (org-filtered), mirroring the NCCB Lead CRM's
// per-rep production/KPI approach.
// ------------------------------ KPI period filtering -------------------------------- //

const KPI_PERIODS = [
  { id:'day', label:'Today' },
  { id:'week', label:'This Week' },
  { id:'month', label:'This Month' },
  { id:'quarter', label:'This Quarter' },
  { id:'all', label:'All Time' },
];
let kpiPeriod = 'week';

function periodRange(period){
  const now = new Date();
  const start = new Date(now); start.setHours(0,0,0,0);
  if(period==='day'){ /* start is already today 00:00 */ }
  else if(period==='week'){ start.setDate(start.getDate() - start.getDay()); } // back to Sunday
  else if(period==='month'){ start.setDate(1); }
  else if(period==='quarter'){ const q = Math.floor(start.getMonth()/3); start.setMonth(q*3, 1); }
  else if(period==='all'){ start.setFullYear(2000); }
  return { start, end: new Date(now.getTime()+60000) }; // end = now (+1min buffer)
}
function inPeriod(tsOrDate, period){
  if(!tsOrDate) return false;
  const { start, end } = periodRange(period);
  const t = new Date(tsOrDate);
  return t >= start && t <= end;
}

// Counts disposition-tagged notes within the period — this IS the real-time
// "calls made" figure (pulled straight from the Notes & Call Log), rather
// than the lifetime counter on the lead, so it's accurate per period.
function callsInPeriod(lead, period){
  return (lead.comments||[]).filter(c=>c.disposition && inPeriod(c.ts, period)).length;
}
function conversationsInPeriod(lead, period){
  return (lead.comments||[]).filter(c=>c.disposition && CONNECTED_DISPOSITIONS.includes(c.disposition) && inPeriod(c.ts, period)).length;
}
function appointmentsInPeriod(lead, period){
  return (lead.comments||[]).filter(c=>c.tag==='appointment' && inPeriod(c.ts, period)).length;
}
function callSecondsInPeriod(lead, period){
  return (lead.comments||[]).filter(c=>c.disposition && inPeriod(c.ts, period)).reduce((s,c)=>s+(Number(c.durationSeconds)||0),0);
}
function formatDuration(totalSeconds){
  const h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  return `${m}m`;
}

function computeRepKPIs(period){
  period = period || 'all';
  const loans = orgFiltered(DB.loans);
  const leads = orgFiltered(DB.leads);
  // Collect distinct reps by canonical identity key (rep NUMBER when
  // resolvable, so a rep never splits into duplicate rows over how their
  // name was typed). Display always uses the roster's full name.
  const keys = new Set();
  const displayName = {};
  const register = raw=>{
    if(!raw) return;
    const key = repIdentityKey(raw);
    if(!key) return;
    keys.add(key);
    if(!displayName[key]) displayName[key] = repDisplayName(raw);
  };
  loans.forEach(l=>register(l.officer));
  leads.forEach(l=>register(l.assignedTo));
  // Also register anyone who's logged activity (calls/notes) even if they
  // have no leads/loans assigned to them yet — otherwise a rep who's purely
  // working unassigned leads would never show up in KPIs at all.
  leads.forEach(l=>(l.comments||[]).forEach(c=>{ if(c.author) register(c.author); }));

  return Array.from(keys).map(key=>{
    const name = displayName[key];
    // "Assigned to me" — ownership metrics (who's on the hook for this lead/loan).
    const repLeads = leads.filter(l=>repIdentityKey(l.assignedTo)===key);
    const repLoans = loans.filter(l=>repIdentityKey(l.officer)===key);
    const funded = repLoans.filter(l=>(l.stage==='Funded'||l.stage==='Closed / Paid Off') && inPeriod(l.fundedAt||l.updatedAt, period));
    const fundedVolume = funded.reduce((s,l)=>s+(Number(l.approvedAmount||l.requestedAmount)||0),0);
    const leadsConverted = repLeads.filter(l=>l.status==='Converted' && inPeriod(l.createdAt, period==='all'?'all':period)).length;
    const clockedSeconds = computeTimeClockSeconds(key, period);

    // "Logged by me" — real activity metrics, scoped to whoever actually
    // logged the note/disposition (matches the Call List and Disposition
    // Registry exactly), across ALL leads, not just ones assigned to them.
    let callsLogged=0, textsLogged=0, conversationsLogged=0, appointmentsSet=0, callTimeSeconds=0;
    leads.forEach(l=>{
      (l.comments||[]).forEach(c=>{
        if(repIdentityKey(c.author) !== key) return;
        if(!inPeriod(c.ts, period)) return;
        if(c.disposition){
          callsLogged++;
          callTimeSeconds += Number(c.durationSeconds)||0;
          if(CONNECTED_DISPOSITIONS.includes(c.disposition)) conversationsLogged++;
        }
        if(c.tag==='text-log') textsLogged++;
        if(c.tag==='appointment') appointmentsSet++;
      });
    });

    return {
      name, key,
      leadsAssigned: repLeads.length,
      callsLogged, textsLogged, conversationsLogged, appointmentsSet, callTimeSeconds,
      leadsConverted,
      loansOriginated: repLoans.length,
      loansFunded: funded.length,
      fundedVolume,
      winRate: repLoans.length ? Math.round((funded.length/repLoans.length)*100) : 0,
      dispositionCounts: computeDispositionCounts(key, period),
      clockedSeconds,
    };
  }).sort((a,b)=>b.fundedVolume-a.fundedVolume);
}

// The call-disposition KPI registry: tallies every logged disposition
// (org-filtered, optionally scoped to one rep by name, and to a period)
// by disposition type, pulled straight from each lead's permanent Notes &
// Call Log in real time — not a separately-tracked/stale counter.
function computeDispositionCounts(repName, period){
  period = period || 'all';
  const leads = orgFiltered(DB.leads);
  const counts = {}; DISPOSITIONS.forEach(d=>{ counts[d.id] = 0; });
  const wantedKey = repName ? repIdentityKey(repName) : null;
  leads.forEach(l=>{
    (l.comments||[]).forEach(c=>{
      if(!c.disposition) return;
      if(wantedKey && repIdentityKey(c.author) !== wantedKey) return;
      if(!inPeriod(c.ts, period)) return;
      if(counts[c.disposition]===undefined) counts[c.disposition] = 0;
      counts[c.disposition]++;
    });
  });
  return counts;
}

/* ------------------------------ time clock -------------------------------- */

function computeTimeClockSeconds(repIdentity, period){
  const wantedKey = repIdentityKey(repIdentity);
  const entries = (DB.timeclock||[]).filter(e=>repIdentityKey(e.repName)===wantedKey && inPeriod(e.clockIn, period));
  return entries.reduce((s,e)=>{
    const start = new Date(e.clockIn).getTime();
    const end = e.clockOut ? new Date(e.clockOut).getTime() : Date.now();
    return s + Math.max(0, Math.round((end-start)/1000));
  }, 0);
}
function activeClockEntry(repIdentity){
  const wantedKey = repIdentityKey(repIdentity);
  return (DB.timeclock||[]).find(e=>repIdentityKey(e.repName)===wantedKey && !e.clockOut);
}
// Only a start time is user-editable — duration is fixed at exactly 30
// minutes by code, matching "30 min, only."
function openSetLunchModal(){
  const now = new Date();
  const defaultStart = now.toISOString().slice(0,16);
  openModal('Set My Lunch (30 minutes)', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">Pick your lunch start time \u2014 it's always exactly 30 minutes, so the end time is set automatically.</p>
    <div class="field"><label>Start Time</label><input type="datetime-local" id="lunchStart" value="${defaultStart}"></div>
  `, `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="saveLunchBtn">Set Lunch</button>`);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveLunchBtn').onclick = ()=>{
    const startVal = document.getElementById('lunchStart').value;
    if(!startVal){ toast('Pick a start time', true); return; }
    const start = new Date(startVal);
    const end = new Date(start.getTime() + 30*60000); // fixed 30 minutes, not user-editable
    const existing = todaysLunchEntry();
    if(existing){
      existing.start = start.toISOString(); existing.end = end.toISOString();
    } else {
      DB.lunch.push({ id: nextId(), createdAt: new Date().toISOString(), repName: currentRep.repNumber, org: currentRep.org,
        date: new Date().toISOString().slice(0,10), start: start.toISOString(), end: end.toISOString() });
    }
    queueSave(); toast('Lunch set: ' + start.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) + '\u2013' + end.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));
    closeModal(); render();
  };
}

function todaysLunchEntry(){
  if(!currentRep) return null;
  const key = String(currentRep.repNumber);
  const today = new Date().toISOString().slice(0,10);
  return (DB.lunch||[]).find(l => repIdentityKey(l.repName)===key && l.date===today) || null;
}
function timeClockWidgetHtml(){
  if(!currentRep) return '';
  const active = activeClockEntry(currentRep.repNumber);
  const todaySeconds = computeTimeClockSeconds(currentRep.repNumber, 'day');
  const weekSeconds = computeTimeClockSeconds(currentRep.repNumber, 'week');
  const lunch = todaysLunchEntry();
  const now = new Date();
  const lunchIsNow = lunch && now >= new Date(lunch.start) && now <= new Date(lunch.end);
  return `
    <div class="box time-clock-box">
      <h3>Time Clock</h3>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        ${active
          ? `<button class="btn accent" id="clockOutBtn">Clock Out</button><span class="call-timer-live">\u25CF Clocked in since ${fmtDateTime(active.clockIn)}</span>`

function viewSwitchHtml(tab, views){
  return `<div class="view-switch">${views.map(v=>`<button data-viewswitch="${tab}:${v.id}" class="${viewState[tab]===v.id?'active':''}">${v.label}</button>`).join('')}</div>`;
}
function groupSelectHtml(tab, options){
  return `<select id="groupSelect_${tab}" data-groupselect="${tab}">${options.map(o=>`<option value="${o.id}" ${groupState[tab]===o.id?'selected':''}>Group by: ${o.label}</option>`).join('')}</select>`;
}
function groupKey(tab, name){ return tab+'::'+name; }

/* generic grouping helper: groups items by a field, returns [{name, color, items}] */
function groupItems(items, field, colorMap, fallbackColor, keyResolver){
  const groups = {};
  const displayFor = {};
  items.forEach(it=>{
    const raw = it[field] || '';
    const key = raw || 'Unassigned';
    if(!groups[key]) groups[key] = [];
    groups[key].push(it);
    if(!displayFor[key]) displayFor[key] = raw && keyResolver ? (keyResolver(raw) || key) : key;
  });
  return Object.keys(groups).map(key=>({
    name: displayFor[key], color: (colorMap && colorMap[key]) || fallbackColor || '#1F4E79', items: groups[key]
  }));
}

// Finds the current rep's first 25 unique leads called today, sorted by
// each lead's earliest call time today — used by the "Lock My First 25"
// data-protection tool. Returns [{ lead, firstCallTs }].
function myFirst25CalledTodayList(){
  if(!currentRep) return [];
  const key = String(currentRep.repNumber);
  const leads = orgFiltered(DB.leads);
  const entries = [];
  leads.forEach(l=>{
    const todaysCalls = (l.comments||[]).filter(c=>c.disposition && repIdentityKey(c.author)===key && inPeriod(c.ts,'day'));
    if(todaysCalls.length===0) return;
    const earliest = todaysCalls.reduce((min,c)=> new Date(c.ts)<new Date(min.ts)?c:min, todaysCalls[0]);
    entries.push({ lead:l, firstCallTs: earliest.ts });
  });
  entries.sort((a,b)=> new Date(a.firstCallTs) - new Date(b.firstCallTs));
  return entries.slice(0,25);
}

function openLockFirst25Modal(){
  const entries = myFirst25CalledTodayList();
  if(entries.length===0){ toast('No calls logged today yet \u2014 nothing to lock.', true); return; }
  const toLock = entries.filter(e=>!e.lead.locked);
  const alreadyLocked = entries.length - toLock.length;
  openModal('Lock My First 25 Calls Today', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">This protects the leads below from deletion \u2014 they cannot be removed until a Super Admin unlocks them individually. Nothing is deleted or changed except adding this protection. Review the list, then confirm.</p>
    <p style="font-size:12px;"><strong>${toLock.length}</strong> lead${toLock.length===1?'':'s'} will be locked${alreadyLocked?` (${alreadyLocked} of your ${entries.length} calls today ${alreadyLocked===1?'is':'are'} already locked)`:''}.</p>
    <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;">
      <table><thead><tr><th>#</th><th>Lead</th><th>Company</th><th>First Call Today</th><th></th></tr></thead>
      <tbody>${entries.map((e,i)=>`<tr><td>${i+1}</td><td>${esc(e.lead.name)}</td><td>${esc(e.lead.company)||'\u2014'}</td><td>${fmtDateTime(e.firstCallTs)}</td><td>${e.lead.locked?'<span class="pill grey">Already locked</span>':'<span class="pill green">Will lock</span>'}</td></tr>`).join('')}</tbody></table>
    </div>
  `, `<button class="btn secondary" id="cancelBtn">Cancel</button>${toLock.length ? `<button class="btn accent" id="confirmLockBtn">Lock ${toLock.length} Lead${toLock.length===1?'':'s'}</button>` : ''}`);
  document.getElementById('cancelBtn').onclick = closeModal;
  const confirmBtn = document.getElementById('confirmLockBtn');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    toLock.forEach(e=>{ e.lead.locked = true; });
    queueSave();
    toast(`Locked ${toLock.length} lead${toLock.length===1?'':'s'} \u2014 protected from deletion.`);
    closeModal(); render();
  };
}

  if(!currentRep){
    return `<div class="box"><div class="loading-note">Log in to see your leads.</div></div>`;

  const mine = orgFiltered(DB.leads).filter(l=>repIdentityKey(l.assignedTo)===key);

  // 72-business-hour SLA (oldest last-touched/assigned first) surface first.
  const liveSorted = live.slice().sort((a,b)=>{
    const aSince = a.lastTouchedAt || a.assignedAt || a.createdAt;
    const bSince = b.lastTouchedAt || b.assignedAt || b.createdAt;
    return new Date(aSince) - new Date(bSince);
  });
  const liveCapped = liveSorted.slice(0, liveLeadsWindowSize);

    return head + legend + `
      <table>
        <thead><tr><th>#</th><th></th><th>Name (who to call)</th><th>Company</th><th>Phone</th><th>Status</th><th>Assigned By</th><th>Time Since Touch</th><th></th></tr></thead>

              <td>${i+1}</td>

              <td><strong>${esc(l.name)}</strong></td>

              <td>${assignedByDisplay(l)}</td>
              <td><span class="${urgent?'sla-urgent':''}">${hoursIn}h / ${TOUCH_SLA_BUSINESS_HOURS}h</span></td>
              <td class="row-actions"><button class="link-btn" data-open-lead="${l.id}">Open</button></td>

  // "All Assigned & Archived" — uncapped, with search and archive/unarchive controls

// Resolves who assigned a lead to a display string: "Name, Title" for a
// human Super Admin, or a plain label for the automated round-robin engine.
function assignedByDisplay(lead){
  if(!lead.assignedByRepNumber) return '\u2014';
  if(lead.assignedByRepNumber === 'AUTO') return 'Automated Round-Robin Assignment';
  const rep = repByNumber(lead.assignedByRepNumber);
  return rep ? `${esc(rep.name)}, ${esc(rep.role)}` : '\u2014';
}

  }

  if(viewState.loans==='timeline'){
    const now = Date.now();

      const start = new Date(l.createdAt).getTime();

      return {l, start, end};
    });
    const minT = Math.min(...withDates.map(x=>x.start));

    const span = Math.max(1, maxT - minT);
    return head + `<div class="timeline-wrap">

        <div class="group-progress-wrap"><span>${pct}% funded</span><div class="group-progress-track"><div class="group-progress-fill" style="width:${pct}%"></div></div></div>
      </div>
      <div class="group-body ${collapsed?'hidden':''}">

const CALL_DIRECTIONS = ['Outbound','Inbound'];
const CALL_TYPES = ['Lead Call','Internal','Other'];
let reportRepView = '';   // '' = defaults to currentRep; 'TEAM' = team-wide
let reportPeriod = 'day'; // defaults to "today" for end-of-day pulls

// Builds one rep's call list for a period, merging real disposition-tagged
// calls made against leads (always Outbound / Lead Call) with any manually
// logged calls (inbound, internal, or other — not tied to a specific lead).
function buildCallList(repIdentity, period){
  const wantedKey = repIdentityKey(repIdentity);
  const rows = [];
  orgFiltered(DB.leads).forEach(lead=>{
    (lead.comments||[]).forEach(c=>{
      if(!c.disposition) return;
      if(repIdentityKey(c.author) !== wantedKey) return;
      if(!inPeriod(c.ts, period)) return;
      rows.push({
        ts: c.ts, direction:'Outbound', type:'Lead Call',
        relatedTo: lead.name + (lead.company?' ('+lead.company+')':''),
        phone: lead.phone||'', disposition: DISPOSITION_MAP[c.disposition]?DISPOSITION_MAP[c.disposition].label:c.disposition,
        durationSeconds: c.durationSeconds||0, notes: '',
      });
    });
  });
  orgFiltered(DB.calllog).forEach(e=>{
    if(repIdentityKey(e.repName) !== wantedKey) return;
    if(!inPeriod(e.createdAt, period)) return;
    rows.push({
      ts: e.createdAt, direction: e.direction, type: e.callType,
      relatedTo: e.relatedTo||'', phone: e.phone||'', disposition: e.disposition||'',
      durationSeconds: Number(e.durationSeconds)||0, notes: e.notes||'',
    });
  });
  return rows.sort((a,b)=> new Date(b.ts) - new Date(a.ts));
}

function callListTableHtml(rows){
  return `
    <table>
      <thead><tr><th>#</th><th>Date / Time</th><th>Direction</th><th>Type</th><th>Related To</th><th>Phone</th><th>Disposition</th><th>Duration</th></tr></thead>
      <tbody>
        ${rows.length===0 ? `<tr class="empty-row"><td colspan="8">No calls logged for this period.</td></tr>` :
        rows.map((r,i)=>`
          <tr>
            <td>${i+1}</td>
            <td>${fmtDateTime(r.ts)}</td>
            <td>${esc(r.direction)}</td>
            <td>${esc(r.type)}</td>
            <td>${esc(r.relatedTo)||'\u2014'}</td>
            <td>${formatPhone(r.phone)||'\u2014'}</td>
            <td>${esc(r.disposition)||'\u2014'}</td>
            <td>${r.durationSeconds?formatDuration(r.durationSeconds):'\u2014'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function downloadCallListCSV(repName, period, rows){
  const header = ['#','Date/Time','Direction','Type','Related To','Phone','Disposition','Duration (sec)'];
  const csvRows = [header.join(',')].concat(rows.map((r,i)=>[
    i+1, fmtDateTime(r.ts), r.direction, r.type, r.relatedTo, r.phone, r.disposition, r.durationSeconds
  ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',')));
  const csv = csvRows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `call-list_${repName.replace(/\s+/g,'-')}_${period}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// KV-row table renderer for the printable template (plain rows, no bars/colors, print-friendly)
function printKvRows(pairs){
  return pairs.map(([k,v])=>`<div class="kv-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('');
}
function printCountTable(headers, rows){
  return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${
    rows.length===0 ? `<tr><td colspan="${headers.length}" style="text-align:center;color:#888;font-style:italic;">No data for this period.</td></tr>` :
    rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')
  }</tbody></table>`;
}

// Opens the given HTML in a hidden iframe and triggers the browser's native
// print dialog — the person picks "Save as PDF" as the destination there,
// which is exactly what "load as a PDF" means without needing a PDF library.
function printHtmlDocument(html){
  const iframe = document.createElement('iframe');
  iframe.style.position = 'fixed';
  iframe.style.right = '0'; iframe.style.bottom = '0';
  iframe.style.width = '0'; iframe.style.height = '0';
  iframe.style.border = '0';
  document.body.appendChild(iframe);
  const doc = iframe.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  iframe.onload = () => {
    iframe.contentWindow.focus();
    iframe.contentWindow.print();
    setTimeout(() => document.body.removeChild(iframe), 1000);
  };
}

const LEAD_ASSIGNMENT_TARGET = 100;

/* ------------------------------ Master Leads engine ------------------------------ */

// "Consistent outbound call workflows" pool: the top N reps by calls logged
// in the last 7 days — an activity proxy, since who's actively dialing is
// the relevant signal for who should get more leads (not funded-volume
// rank, which lags activity by weeks).
function computeActiveCallerPool(){
  const reps = computeRepKPIs('week');
  const unavailableKeys = new Set((DB.reps||[]).filter(r=>r.unavailable).map(r=>String(r.repNumber)));
  return reps.slice()
    .filter(r=>!unavailableKeys.has(String(r.key)))
    .sort((a,b)=>b.callsLogged-a.callsLogged)
    .filter(r=>r.callsLogged>0)
    .slice(0, ROUND_ROBIN_POOL_SIZE);
}

// Deterministic round-robin with no separate pointer to store: the index
// is derived from how many auto-reassignments have happened so far (from
// the reconciliation log itself), so it's stateless and always consistent
// between the client's "Run Check Now" and the Apps Script trigger.
function pickRoundRobinRep(pool){
  if(!pool.length) return null;
  const priorAutoAssigns = (DB.assignmentlog||[]).filter(e=>e.type==='auto_reassigned').length;
  return pool[priorAutoAssigns % pool.length];
}

function logAssignmentMovement(lead, type, fromRep, toRep, reason){
  DB.assignmentlog.push({
    id: nextId(), createdAt: new Date().toISOString(),
    leadId: lead.id, leadName: lead.name, type, fromRep: fromRep||'', toRep: toRep||'', reason: reason||'', org: lead.org,
  });
}

function revertLeadToMaster(lead, type, reason){
  const fromRep = lead.assignedTo;
  logAssignmentMovement(lead, type, fromRep, '', reason);
  lead.assignedTo = '';
  lead.assignedByRepNumber = '';
  lead.assignedAt = '';
  lead.lastTouchedAt = '';
  lead.archived = false;
  lead.archivedAt = '';
}

function autoReassignFromMaster(lead, reason){
  const pool = computeActiveCallerPool();
  const rep = pickRoundRobinRep(pool);
  if(!rep) return false; // no qualifying reps — lead stays in Master, unassigned
  lead.assignedTo = String(rep.key);
  lead.assignedByRepNumber = 'AUTO';
  lead.assignedAt = new Date().toISOString();
  lead.lastTouchedAt = '';
  logAssignmentMovement(lead, 'auto_reassigned', '', rep.key, reason);
  return true;
}

// The SLA sweep: reverts untouched-in-72-business-hours assigned leads back
// to Master and immediately round-robins them to an active caller; reverts
// archived-past-30-business-days leads back to Master (no auto-reassign —
// matches the spec, which only calls for round-robin on the touch SLA).
// Safe to run repeatedly — each lead only moves once per pass.
function runMasterLeadsSLASweep(){
  const leads = orgFiltered(DB.leads);
  let reverted72=0, reassigned=0, archiveExpired=0;
  const now = new Date().toISOString();
  leads.forEach(l=>{
    if(l.assignedTo && !l.archived){
      const since = l.lastTouchedAt || l.assignedAt;
      if(since && businessHoursElapsed(since, now) >= TOUCH_SLA_BUSINESS_HOURS){
        revertLeadToMaster(l, 'reverted_72h_no_touch', `No activity for ${TOUCH_SLA_BUSINESS_HOURS} business hours`);
        reverted72++;
        if(autoReassignFromMaster(l, 'Round-robin reassignment after 72-business-hour SLA')) reassigned++;
      }
    } else if(l.archived && l.archivedAt){
      if(businessDaysElapsed(l.archivedAt, now) >= ARCHIVE_HOLD_BUSINESS_DAYS){
        revertLeadToMaster(l, 'archive_expired', `Archived hold of ${ARCHIVE_HOLD_BUSINESS_DAYS} business days expired`);
        archiveExpired++;
      }
    }
  });
  if(reverted72 || archiveExpired) queueSave();
  return { reverted72, reassigned, archiveExpired };
}

function computeAssignmentCounts(){
  const leads = orgFiltered(DB.leads);
  const reps = (DB.reps||[]).slice().sort((a,b)=>a.repNumber-b.repNumber);
  const counts = {};
  reps.forEach(r=>{ counts[String(r.repNumber)] = 0; });
  let unassigned = 0;
  leads.forEach(l=>{
    const key = repIdentityKey(l.assignedTo);
    if(key && counts[key]!==undefined) counts[key]++;
    else unassigned++;
  });
  return { reps, counts, unassigned, totalLeads: leads.length };
}

// Round-robin distributes unassigned leads to reps below target, shows the
// exact planned distribution, and only writes assignments after explicit
// confirmation — nothing is assigned automatically without review.
function openAutoAssignModal(){
  const { reps, counts, unassigned } = computeAssignmentCounts();
  const needy = reps.map(r=>({ rep:r, need: Math.max(0, LEAD_ASSIGNMENT_TARGET - (counts[String(r.repNumber)]||0)) })).filter(x=>x.need>0);
  if(needy.length===0){ toast('Every rep is already at or above the target \u2014 nothing to assign.'); return; }
  if(unassigned===0){ toast('No unassigned leads available to distribute.', true); return; }

  const plan = {}; needy.forEach(x=>{ plan[x.rep.repNumber] = 0; });
  let remaining = unassigned;
  const stillNeedy = needy.map(x=>({ rep:x.rep, need:x.need }));
  while(remaining>0 && stillNeedy.some(x=>x.need>0)){
    for(const x of stillNeedy){
      if(remaining<=0) break;
      if(x.need>0){ plan[x.rep.repNumber]++; x.need--; remaining--; }
    }
  }
  const planRows = needy.filter(x=>plan[x.rep.repNumber]>0);
  const totalPlanned = planRows.reduce((s,r)=>s+plan[r.rep.repNumber],0);

  openModal('Auto-Assign Unassigned Leads', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">Distributes ${totalPlanned} of ${unassigned} unassigned lead(s) round-robin to reps below the ${LEAD_ASSIGNMENT_TARGET}-lead target.${unassigned<needy.reduce((s,x)=>s+x.need,0) ? ' Not enough unassigned leads to bring everyone fully to target \u2014 split as evenly as possible.' : ''}</p>
    <table><thead><tr><th>Rep</th><th>Current</th><th>Will Receive</th><th>New Total</th></tr></thead>
    <tbody>${planRows.map(x=>`<tr><td>${esc(x.rep.name)}</td><td>${counts[String(x.rep.repNumber)]||0}</td><td>+${plan[x.rep.repNumber]}</td><td>${(counts[String(x.rep.repNumber)]||0)+plan[x.rep.repNumber]}</td></tr>`).join('')}</tbody></table>
  `, `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn accent" id="confirmAssignBtn">Assign ${totalPlanned} Lead${totalPlanned===1?'':'s'}</button>`);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('confirmAssignBtn').onclick = ()=>{
    const unassignedLeads = orgFiltered(DB.leads).filter(l=>!repIdentityKey(l.assignedTo));
    const assignmentQueue = [];
    planRows.forEach(x=>{ for(let i=0;i<plan[x.rep.repNumber];i++){ assignmentQueue.push(x.rep.repNumber); } });
    let assigned = 0;
    const nowIso = new Date().toISOString();
    assignmentQueue.forEach(repNum=>{
      if(assigned < unassignedLeads.length){
        const lead = unassignedLeads[assigned];
        lead.assignedTo = String(repNum);
        lead.assignedAt = nowIso;
        lead.assignedByRepNumber = currentRep ? String(currentRep.repNumber) : '';
        lead.lastTouchedAt = '';
        logAssignmentMovement(lead, 'manual_assigned', '', repNum, 'Auto-Assign to Target tool');
        assigned++;
      }
    });
    queueSave();
    toast(`Assigned ${assigned} lead(s) across ${planRows.length} rep(s).`);
    closeModal(); render();
  };
}

/* ------------------------------ calendar / callback reminders ------------------------------ */

function viewCalendar(){
  const tasks = orgFiltered(DB.tasks).filter(t=>t.status!=='Complete' && t.status!=='Canceled');
  const buckets = { overdue:[], today:[], tomorrow:[], week:[], later:[], none:[] };
  tasks.forEach(t=>{ buckets[dateBucket(t.dueDate).key].push(t); });
  const order = ['overdue','today','tomorrow','week','later','none'];
  const bucketMeta = { overdue:dateBucket('2000-01-01'), today:dateBucket(new Date().toISOString().slice(0,10)) };

  return `
    <div class="panel-head">
      <div><h2>Calendar</h2><div class="sub">Color-coded reminders \u2014 callbacks and every other open task, grouped by due date</div></div>
    </div>
    ${callStatusLegendForCalendarHtml()}
    ${order.map(key=>{
      const list = buckets[key];
      if(list.length===0) return '';
      const meta = key==='none' ? {label:'No Due Date', color:'#b9c2ca'} : dateBucket(key==='overdue' ? '2000-01-01' : key==='today' ? new Date().toISOString().slice(0,10) : key==='tomorrow' ? new Date(Date.now()+86400000).toISOString().slice(0,10) : key==='week' ? new Date(Date.now()+5*86400000).toISOString().slice(0,10) : new Date(Date.now()+30*86400000).toISOString().slice(0,10));
      const label = key==='none' ? 'No Due Date' : meta.label;
      const color = key==='none' ? '#b9c2ca' : meta.color;
      const sorted = list.slice().sort((a,b)=> new Date(a.dueDate||'2999-01-01') - new Date(b.dueDate||'2999-01-01'));
      return `
        <div class="cal-bucket">
          <div class="cal-bucket-head" style="background:${color};">${label} (${list.length})</div>
          ${sorted.map(t=>`
            <div class="cal-row" data-open-task="${t.id}">
              <span class="call-status-dot" style="background:${color};"></span>
              <div class="cal-date">${fmtDate(t.dueDate)}</div>
              <div class="cal-title">${esc(t.title)}</div>
              <div class="cal-meta">${esc(repDisplayName(t.assignedTo))||'Unassigned'} &middot; ${esc(t.priority)} &middot; ${esc(t.relatedTo)||''}</div>
            </div>`).join('')}
        </div>`;
    }).join('') || `<div class="box"><div class="loading-note">No open tasks or callbacks scheduled. Callback reminders are created automatically when you log a "Callback Scheduled" call disposition on a lead.</div></div>`}
  `;
}
function callStatusLegendForCalendarHtml(){

// Runs any matching automations when an entity's status/stage field changes.
function runAutomations(entityType, item, newValue){
  const rules = (DB.automations||[]).filter(a=>a.active && a.entity===entityType && a.toValue===newValue && (a.org==='All' || a.org===item.org));
  rules.forEach(a=>{
    if(a.actionType==='create_task'){
      const due = new Date();
      due.setDate(due.getDate() + (a.params.daysOffset||0));
      DB.tasks.push({
        id: nextId(), createdAt: new Date().toISOString(),
        title: a.params.title, dueDate: due.toISOString().slice(0,10),
        priority: 'Normal', status: 'Open',
        assignedTo: a.params.assignedTo || item.assignedTo || item.officer || '',
        relatedTo: item.name || item.loanNumber || item.title || '',
        org: item.org, comments: [],
      });
      toast(`Automation: created task "${a.params.title}"`);
    } else if(a.actionType==='toast'){
      toast('Reminder: ' + a.params.message);
    } else if(a.actionType==='post_update'){
      item.comments = item.comments || [];
      item.comments.push({ id: nextId(), text: a.params.message, author: 'Automation', ts: new Date().toISOString() });
    }
  });
  if(rules.length) queueSave();
}

function bindLeadNotesEvents(lead){
  bindUpdatesEvents(lead);
  const labels = {texts:'Logged a text message', emails:'Logged an email', appointments:'Appointment set'};
  const tags = {texts:'text-log', emails:'email-log', appointments:'appointment'};
  document.querySelectorAll('[data-logtype]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.logtype;
      lead[key] = (lead[key]||0) + 1;
      lead.comments = lead.comments || [];
      lead.comments.push({ id: nextId(), text: labels[key], author: currentRep ? currentRep.repNumber : 'LH', ts:new Date().toISOString(), tag: tags[key] });
      queueSave();
      toast(labels[key]);
      openLeadDetail(lead.id); // refresh modal in place
    };
  });
  const startCallTimerBtn = document.getElementById('startCallTimerBtn');
  if(startCallTimerBtn) startCallTimerBtn.onclick = ()=>{
    activeCallTimers[lead.id] = new Date().toISOString();
    openLeadDetail(lead.id);
  };
  const cancelCallTimerBtn = document.getElementById('cancelCallTimerBtn');
  if(cancelCallTimerBtn) cancelCallTimerBtn.onclick = ()=>{
    delete activeCallTimers[lead.id];
    openLeadDetail(lead.id);
  };

  document.querySelectorAll('[data-disposition]').forEach(btn=>{
    btn.onclick = ()=>{
      const d = DISPOSITION_MAP[btn.dataset.disposition];
      lead.calls = (lead.calls||0) + 1;
      lead.lastTouchedAt = new Date().toISOString(); // resets the 72-business-hour Master Leads SLA clock
      if(d.id==='connected_interested' || d.id==='connected_not_interested') lead.conversations = (lead.conversations||0) + 1;
      lead.comments = lead.comments || [];
      let durationSeconds = 0;
      if(activeCallTimers[lead.id]){
        durationSeconds = Math.round((Date.now() - new Date(activeCallTimers[lead.id]).getTime())/1000);
        delete activeCallTimers[lead.id];
      }
      lead.comments.push({ id: nextId(), text: 'Call disposition logged.' + (durationSeconds?` (${formatDuration(durationSeconds)})`:''), author: currentRep ? currentRep.repNumber : 'LH', ts:new Date().toISOString(), disposition: d.id, durationSeconds });

      if(d.id==='dnc_requested'){
        toast('Logged \u2014 remember to mark this lead Lost and stop contacting this number.', true);
      } else if(d.id==='number_disconnected'){
        toast('Logged \u2014 this number is dead; consider marking the lead Lost.', true);
      } else {
        toast('Logged: ' + d.label);
      }
      queueSave();
      openLeadDetail(lead.id); // refresh modal in place
    };
  });

  const logCallbackBtn = document.getElementById('logCallbackBtn');
  if(logCallbackBtn) logCallbackBtn.onclick = async ()=>{
    const dtInput = document.getElementById('callbackDateTime');
    const dtVal = dtInput.value; // "YYYY-MM-DDTHH:MM" local time
    if(!dtVal){ toast('Pick a callback date and time first', true); return; }
    logCallbackBtn.disabled = true;
    logCallbackBtn.textContent = 'Scheduling\u2026';

    lead.calls = (lead.calls||0) + 1;
    lead.lastTouchedAt = new Date().toISOString(); // resets the 72-business-hour Master Leads SLA clock
    lead.comments = lead.comments || [];
    lead.comments.push({ id: nextId(), text: 'Call disposition logged.', author: currentRep ? currentRep.repNumber : 'LH', ts:new Date().toISOString(), disposition: 'callback_scheduled', callbackAt: dtVal });

    DB.tasks.push({
      id: nextId(), createdAt: new Date().toISOString(), comments: [],
      title: 'Callback: ' + lead.name + (lead.company ? ' (' + lead.company + ')' : ''),
      dueDate: dtVal.slice(0,10), priority:'High', status:'Open',
      assignedTo: currentRep ? currentRep.repNumber : (lead.assignedTo||''), relatedTo: lead.name, org: lead.org,
    });
    queueSave();

    try{
      const result = await apiCreateCalendarEvent({
        title: 'Callback: ' + lead.name + (lead.company ? ' \u2014 ' + lead.company : ''),
        description: 'Pedison USA lead callback.\nPhone: ' + (lead.phone||'') + '\nOrg: ' + (lead.org||''),
        startDateTime: dtVal,
        guestEmail: currentRep ? currentRep.email : '',
      });
      if(result && result.ok){
        toast('Callback scheduled \u2014 added to Calendar and CRM reminders');
      } else {
        toast('Callback saved in the CRM, but the Google Calendar invite failed: ' + (result && result.error ? result.error : 'unknown error'), true);
      }
    }catch(e){
      toast('Callback saved in the CRM, but couldn\u2019t reach Google Calendar \u2014 check your connection.', true);
    }
    openLeadDetail(lead.id); // refresh modal in place
  };
}

function addOrEditLead(id){

    `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="saveBtn">Save</button>`);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('saveBtn').onclick = ()=>{
    const priorAssignedTo = existing ? existing.assignedTo : '';
    const data = readLeadForm(existing ? existing.assignedTo : (currentRep ? String(currentRep.repNumber) : ''));
    if(!data.name){ toast('Name is required', true); return; }
    const oldStatus = existing ? existing.status : null;
    if(existing){ Object.assign(existing, data); toast('Lead updated'); }
    else { DB.leads.push({id:nextId(), createdAt:new Date().toISOString(), comments:[], calls:0, texts:0, emails:0, conversations:0, ...data}); toast('Lead added'); }
    const finalItem = existing || DB.leads[DB.leads.length-1];
    // Super Admin changed the assignment — stamp who/when and log it for reconciliation.
    if(isAdmin() && repIdentityKey(data.assignedTo) !== repIdentityKey(priorAssignedTo)){
      finalItem.assignedAt = data.assignedTo ? new Date().toISOString() : '';
      finalItem.assignedByRepNumber = data.assignedTo && currentRep ? String(currentRep.repNumber) : '';
      finalItem.lastTouchedAt = '';
      logAssignmentMovement(finalItem, data.assignedTo ? 'manual_assigned' : 'manual_unassigned', priorAssignedTo, data.assignedTo, 'Assigned via lead edit form');
    }
    if(oldStatus!==data.status) runAutomations('lead', finalItem, data.status);
    queueSave(); closeModal(); render();
  };
}

function convertLead(id){
  const lead = DB.leads.find(l=>l.id===id);
  if(!lead) return;
  openModal('Convert Lead to Loan File', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">Creates a contact (if needed) and opens a new loan file at the first pipeline stage. The lead stays linked to its original campaign for attribution.</p>
    <div class="field-row">
      <div class="field"><label>Product Type</label><select id="f_product">${selectOptions(LOAN_PRODUCTS, lead.requestedProduct && LOAN_PRODUCTS.includes(lead.requestedProduct) ? lead.requestedProduct : LOAN_PRODUCTS[0])}</select></div>
      <div class="field"><label>Requested Amount</label><input type="number" id="f_amount" value="${lead.requestedAmount||''}"></div>
    </div>
  `, `<button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn" id="convertBtn">Convert</button>`);
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('convertBtn').onclick = ()=>{
    let contact = DB.contacts.find(c=>c.email && c.email===lead.email && lead.email);
    if(!contact){
      contact = { id: nextId(), createdAt:new Date().toISOString(), comments:[],
        name: lead.name, firstName: lead.firstName, middleName: lead.middleName, lastName: lead.lastName,
        company: lead.company, email: lead.email, phone: lead.phone,
        type: 'Borrower', org: lead.org, source: lead.source || lead.channel };
      DB.contacts.push(contact);
    }
    const loanNumber = 'PED-' + new Date().getFullYear() + '-' + Math.floor(100000+Math.random()*899999);
    const loan = {
      id: nextId(), createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), comments:[],
      loanNumber, contactId: contact.id,
      productType: document.getElementById('f_product').value,
      requestedAmount: document.getElementById('f_amount').value,
      approvedAmount:'', rate:'', term:'', officer:'',
      org: lead.org, stage: LOAN_STAGES[0],
      stageHistory: [{stage:LOAN_STAGES[0], enteredAt:new Date().toISOString()}],
    };
    DB.loans.push(loan);
    lead.status = 'Converted';
    lead.convertedLoanId = loan.id;
    runAutomations('lead', lead, 'Converted');
    queueSave();
    toast(`Converted \u2014 loan file ${loanNumber} created`);
    closeModal();
    currentTab = 'loans';
    render();
  };
}

    </div>

      <h4>Stage History</h4>
      ${history.map(h=>`<div class="activity-item"><div class="ts">${fmtDateTime(h.enteredAt)}</div>Entered: ${esc(h.stage)}</div>`).join('')}
    </div>
    ${updatesHtml(loan)}
  `, `${isAdmin() ? '<button class="btn danger" id="delLoanBtn">Delete Loan File</button>' : ''}<button class="btn secondary" id="editLoanBtn">Edit Details</button><button class="btn secondary" id="closeBtn">Close</button>`);

  bindUpdatesEvents(loan);
  document.getElementById('closeBtn').onclick = ()=>{ closeModal(); render(); };
  const modalCloseX = document.getElementById('modalClose');
  if(modalCloseX) modalCloseX.onclick = ()=>{ closeModal(); render(); };
  const delLoanBtn = document.getElementById('delLoanBtn');
  if(delLoanBtn) delLoanBtn.onclick = ()=>{
    if(confirm('Delete this loan file? This cannot be undone.')){
      DB.loans = DB.loans.filter(l=>l.id!==loan.id);
      queueSave(); toast('Loan file deleted'); closeModal(); render();

      loan.stage = newStage;

      runAutomations('loan', loan, newStage);
      queueSave(); toast('Moved to ' + newStage); closeModal(); render();
    };
  });

/* ---------------------- inline status popover (Monday-style) --------------------- */

function closeStatusPop(){
  const existing = document.getElementById('statusPop');
  if(existing) existing.remove();
}
document.addEventListener('click', (e)=>{
  if(!e.target.closest('[data-statuspop]') && !e.target.closest('#statusPop')) closeStatusPop();
});

// Delegated so it works for accordions rendered on the Sales Scripts tab
// AND for the copy re-rendered fresh inside every lead popup, without
// needing to rebind after each render/modal open.
document.addEventListener('click', (e)=>{
  const header = e.target.closest('[data-acc-toggle]');
  if(!header) return;
  const body = document.getElementById(header.dataset.accToggle);
  if(!body) return;
  const opening = !body.classList.contains('open');
  body.classList.toggle('open', opening);
  header.classList.toggle('open', opening);
});

function openStatusPop(anchor, kind, id){
  closeStatusPop();
  let options, onPick, colorMap;
  if(kind==='lead'){
    const item = DB.leads.find(l=>l.id===id);
    options = LEAD_STATUSES; colorMap = LEAD_STATUS_PILL;
    onPick = (val)=>{ item.status=val; runAutomations('lead', item, val); queueSave(); toast('Status set to '+val); render(); };
  } else if(kind==='task'){
    const item = DB.tasks.find(t=>t.id===id);
    options = TASK_STATUSES; colorMap = TASK_STATUS_PILL;
    onPick = (val)=>{ item.status=val; runAutomations('task', item, val); queueSave(); toast('Status set to '+val); render(); };
  } else if(kind==='loanstage'){
    const item = DB.loans.find(l=>l.id===id);
    options = LOAN_STAGES; colorMap = null;
    onPick = (val)=>{
      item.stage=val; item.updatedAt=new Date().toISOString();
      if(val==='Funded') item.fundedAt = new Date().toISOString();
      item.stageHistory = item.stageHistory || [];
      item.stageHistory.push({stage:val, enteredAt:new Date().toISOString()});
      runAutomations('loan', item, val);
      queueSave(); toast('Stage set to '+val); render();
    };
  }
  const pop = document.createElement('div');
  pop.className = 'status-pop';
  pop.id = 'statusPop';
  pop.innerHTML = options.map(o=>`<div class="opt" data-pick="${esc(o)}">${o}</div>`).join('');
  document.body.appendChild(pop);
  const rect = anchor.getBoundingClientRect();
  pop.style.top = (window.scrollY + rect.bottom + 4) + 'px';
  pop.style.left = (window.scrollX + rect.left) + 'px';
  pop.querySelectorAll('[data-pick]').forEach(o=>{ o.onclick=(ev)=>{ ev.stopPropagation(); onPick(o.dataset.pick); }; });
}
