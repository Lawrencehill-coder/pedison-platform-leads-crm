  // Reports
  const reportRepSelect = document.getElementById('reportRepSelect');
  if(reportRepSelect) reportRepSelect.onchange = ()=>{ reportRepView = reportRepSelect.value; render(); };
  const reportPeriodSelect = document.getElementById('reportPeriodSelect');
  if(reportPeriodSelect) reportPeriodSelect.onchange = ()=>{ reportPeriod = reportPeriodSelect.value; render(); };
  const logCallManualBtn = document.getElementById('logCallManualBtn');
  if(logCallManualBtn) logCallManualBtn.onclick = openLogCallManual;
  const printReportBtn = document.getElementById('printReportBtn');
  if(printReportBtn) printReportBtn.onclick = buildAndPrintReport;
  const downloadCallListBtn = document.getElementById('downloadCallListBtn');
  if(downloadCallListBtn) downloadCallListBtn.onclick = ()=>{
    const effectiveSelection = reportRepView || (currentRep ? String(currentRep.repNumber) : '');
    if(!effectiveSelection) return;
    const rows = buildCallList(effectiveSelection, reportPeriod);
    downloadCallListCSV(repDisplayName(effectiveSelection), reportPeriod, rows);
  };

  const clockInBtn = document.getElementById('clockInBtn');
  if(clockInBtn) clockInBtn.onclick = ()=>{
    if(!currentRep) return;
    DB.timeclock.push({ id: nextId(), createdAt: new Date().toISOString(), repName: currentRep.repNumber, org: currentRep.org, clockIn: new Date().toISOString(), clockOut: '', date: new Date().toISOString().slice(0,10) });
    queueSave(); toast('Clocked in'); render();
  };
  const clockOutBtn = document.getElementById('clockOutBtn');
  if(clockOutBtn) clockOutBtn.onclick = ()=>{
    if(!currentRep) return;
    const active = activeClockEntry(currentRep.repNumber);
    if(active){ active.clockOut = new Date().toISOString(); queueSave(); toast('Clocked out'); render(); }
  };
  const setLunchBtn = document.getElementById('setLunchBtn');
  if(setLunchBtn) setLunchBtn.onclick = openSetLunchModal;

  // view switch buttons (Table/Kanban/Timeline)
  document.querySelectorAll('[data-viewswitch]').forEach(b=>{
    b.onclick = ()=>{
      const [tab, v] = b.dataset.viewswitch.split(':');
      viewState[tab] = v; render();
    };
  });
  // group-by selects
  document.querySelectorAll('[data-groupselect]').forEach(sel=>{
    sel.onchange = ()=>{ groupState[sel.dataset.groupselect] = sel.value; render(); };
  });
  // collapsible group headers
  document.querySelectorAll('[data-grouptoggle]').forEach(row=>{
    row.onclick = ()=>{
      const gk = row.dataset.grouptoggle;
      collapsedGroups[gk] = !collapsedGroups[gk];
      render();
    };
  });
  // inline status pills
  document.querySelectorAll('[data-statuspop]').forEach(p=>{
    p.onclick = (e)=>{
      e.stopPropagation();
      const [kind, id] = p.dataset.statuspop.split(':');
      openStatusPop(p, kind, id);
    };
  });

  // Leads
  const leadSearchFieldSelect = document.getElementById('leadSearchFieldSelect');
  if(leadSearchFieldSelect) leadSearchFieldSelect.onchange = ()=>{ leadSearchField = leadSearchFieldSelect.value; render(); };
  const leadSearch = document.getElementById('leadSearch');
  if(leadSearch) leadSearch.oninput = ()=>{
    const val = leadSearch.value;
    viewLeads._q = val;
    document.getElementById('mainArea').innerHTML = viewLeads();
    bindPageEvents();
    const freshInput = document.getElementById('leadSearch');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(val.length, val.length); }
  };
  const addLeadBtn = document.getElementById('addLeadBtn');
  if(addLeadBtn) addLeadBtn.onclick = ()=>addOrEditLead(null);
  const lockFirst25Btn = document.getElementById('lockFirst25Btn');
  if(lockFirst25Btn) lockFirst25Btn.onclick = openLockFirst25Modal;
  const showAllLeadsBtn = document.getElementById('showAllLeadsBtn');
  if(showAllLeadsBtn) showAllLeadsBtn.onclick = ()=>{ viewLeads._showAll = !viewLeads._showAll; render(); };

  // My Leads (non-admin rep view)
  document.querySelectorAll('[data-leadsreptab]').forEach(b=>{
    b.onclick = ()=>{ leadsRepTab = b.dataset.leadsreptab; render(); };
  });
  const addNextTenBtn = document.getElementById('addNextTenBtn');
  if(addNextTenBtn) addNextTenBtn.onclick = ()=>{ liveLeadsWindowSize += 10; render(); };
  const showFewerTenBtn = document.getElementById('showFewerTenBtn');
  if(showFewerTenBtn) showFewerTenBtn.onclick = ()=>{ liveLeadsWindowSize = Math.max(LIVE_LEADS_CAP, liveLeadsWindowSize - 10); render(); };
  const myLeadsSearchInput = document.getElementById('myLeadsSearchInput');
  if(myLeadsSearchInput) myLeadsSearchInput.oninput = ()=>{
    const val = myLeadsSearchInput.value;
    myLeadsSearch = val;
    document.getElementById('mainArea').innerHTML = viewMyLeads();
    bindPageEvents();
    const fresh = document.getElementById('myLeadsSearchInput');
    if(fresh){ fresh.focus(); fresh.setSelectionRange(val.length, val.length); }
  };
  document.querySelectorAll('[data-archive-lead]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const lead = DB.leads.find(l=>l.id===b.dataset.archiveLead);
    if(!lead) return;
    lead.archived = true; lead.archivedAt = new Date().toISOString();
    logAssignmentMovement(lead, 'archived', lead.assignedTo, lead.assignedTo, 'Archived by assigned rep');
    queueSave(); toast('Lead archived \u2014 holds for ' + ARCHIVE_HOLD_BUSINESS_DAYS + ' business days'); render();
  });
  document.querySelectorAll('[data-unarchive-lead]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const lead = DB.leads.find(l=>l.id===b.dataset.unarchiveLead);
    if(!lead) return;
    lead.archived = false; lead.archivedAt = '';
    logAssignmentMovement(lead, 'unarchived', lead.assignedTo, lead.assignedTo, 'Unarchived by assigned rep');
    queueSave(); toast('Lead unarchived'); render();
  });

  document.querySelectorAll('[data-open-lead]').forEach(b=>b.onclick=()=>openLeadDetail(b.dataset.openLead));
  document.querySelectorAll('[data-lead]').forEach(el=>el.onclick=()=>openLeadDetail(el.dataset.lead));
  document.querySelectorAll('[data-convert-lead]').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); convertLead(b.dataset.convertLead); });
  document.querySelectorAll('[data-rr-assign]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const lead = DB.leads.find(l=>l.id===b.dataset.rrAssign);
    if(!lead) return;
    if(autoReassignFromMaster(lead, 'Manual single-lead round-robin assign from Master Leads List')){
      queueSave(); toast(`Assigned to ${repDisplayName(lead.assignedTo)} (round-robin)`); render();
    } else {
      toast('No available reps with recent call activity to round-robin to \u2014 try Auto-Assign to Target instead.', true);
    }
  });
  document.querySelectorAll('[data-del-lead]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const target = DB.leads.find(l=>l.id===b.dataset.delLead);
    if(target && target.locked){ toast('This lead is locked \u2014 a Super Admin must unlock it before it can be deleted.', true); return; }
    if(confirm('Delete this lead?')){ DB.leads = DB.leads.filter(l=>l.id!==b.dataset.delLead); queueSave(); toast('Lead deleted'); render(); }
  });

  // Contacts
  const contactSearch = document.getElementById('contactSearch');
  if(contactSearch) contactSearch.oninput = ()=>{
    const val = contactSearch.value;
    viewContacts._q = val;
    document.getElementById('mainArea').innerHTML = viewContacts();
    bindPageEvents();
    const freshInput = document.getElementById('contactSearch');
    if(freshInput){ freshInput.focus(); freshInput.setSelectionRange(val.length, val.length); }
  };
  const addContactBtn = document.getElementById('addContactBtn');
  if(addContactBtn) addContactBtn.onclick = ()=>addOrEditContact(null);
  document.querySelectorAll('[data-edit-contact]').forEach(b=>b.onclick=()=>addOrEditContact(b.dataset.editContact));
  document.querySelectorAll('[data-del-contact]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this contact?')){ DB.contacts = DB.contacts.filter(c=>c.id!==b.dataset.delContact); queueSave(); toast('Contact deleted'); render(); }
  });

  // Loans
  const addLoanBtn = document.getElementById('addLoanBtn');
  if(addLoanBtn) addLoanBtn.onclick = addLoan;
  document.querySelectorAll('[data-loan]').forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); loanDetail(el.dataset.loan); });

  // Tasks
  const addTaskBtn = document.getElementById('addTaskBtn');
  if(addTaskBtn) addTaskBtn.onclick = ()=>addOrEditTask(null);
  document.querySelectorAll('[data-open-task]').forEach(b=>b.onclick=()=>openTaskDetail(b.dataset.openTask));
  document.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>openTaskDetail(el.dataset.task));
  document.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    if(confirm('Delete this task?')){ DB.tasks = DB.tasks.filter(t=>t.id!==b.dataset.delTask); queueSave(); toast('Task deleted'); render(); }
  });

  // Campaigns
  const addCampaignBtn = document.getElementById('addCampaignBtn');
  if(addCampaignBtn) addCampaignBtn.onclick = ()=>addOrEditCampaign(null);
  document.querySelectorAll('[data-edit-campaign]').forEach(b=>b.onclick=()=>addOrEditCampaign(b.dataset.editCampaign));
  document.querySelectorAll('[data-del-campaign]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this campaign?')){ DB.campaigns = DB.campaigns.filter(c=>c.id!==b.dataset.delCampaign); queueSave(); toast('Campaign deleted'); render(); }
  });

  // Automations
  const addAutomationBtn = document.getElementById('addAutomationBtn');
  if(addAutomationBtn) addAutomationBtn.onclick = addAutomationModal;
  document.querySelectorAll('[data-toggle-automation]').forEach(cb=>{
    cb.onchange = ()=>{
      const a = DB.automations.find(a=>a.id===cb.dataset.toggleAutomation);
      if(a){ a.active = cb.checked; queueSave(); toast(a.active?'Automation enabled':'Automation disabled'); }
    };
  });
  document.querySelectorAll('[data-del-automation]').forEach(b=>b.onclick=()=>{
    if(confirm('Delete this automation?')){ DB.automations = DB.automations.filter(a=>a.id!==b.dataset.delAutomation); queueSave(); toast('Automation deleted'); render(); }
  });

  // Reps
  const addRepBtn = document.getElementById('addRepBtn');
  if(addRepBtn) addRepBtn.onclick = ()=>addOrEditRep(null);
  document.querySelectorAll('[data-edit-rep]').forEach(b=>b.onclick=()=>addOrEditRep(b.dataset.editRep));
  document.querySelectorAll('[data-toggle-available]').forEach(cb=>{
    cb.onchange = ()=>{
      const r = DB.reps.find(r=>String(r.id)===String(cb.dataset.toggleAvailable));
      if(!r) return;
      r.unavailable = !cb.checked;
      queueSave(); toast(r.unavailable ? esc(r.name)+' marked unavailable \u2014 skipped by round-robin' : esc(r.name)+' marked available'); render();
    };
  });
  document.querySelectorAll('[data-del-rep]').forEach(b=>b.onclick=()=>{
    if(!isAdmin()) return;
    if(confirm('Delete this rep? Their historical production stays attached to their name on past leads/loans.')){
      DB.reps = DB.reps.filter(r=>String(r.id)!==String(b.dataset.delRep));
      queueSave(); toast('Rep deleted'); render();
    }
  });

  // Super Admin tab
  document.querySelectorAll('[data-adminsub]').forEach(b=>{
    b.onclick = ()=>{ adminSubTab = b.dataset.adminsub; render(); };
  });
  const autoAssignBtn = document.getElementById('autoAssignBtn');
  if(autoAssignBtn) autoAssignBtn.onclick = openAutoAssignModal;
  const runSlaSweepBtn = document.getElementById('runSlaSweepBtn');
  if(runSlaSweepBtn) runSlaSweepBtn.onclick = ()=>{
    const result = runMasterLeadsSLASweep();
    toast(`SLA sweep: ${result.reverted72} reverted (72h no-touch), ${result.reassigned} round-robin reassigned, ${result.archiveExpired} archive holds expired.`);
    render();
  };
  document.querySelectorAll('[data-toggle-admin]').forEach(cb=>{
    cb.onchange = ()=>{
      const r = DB.reps.find(r=>String(r.id)===String(cb.dataset.toggleAdmin));
      if(!r) return;
      r.isSuperAdmin = cb.checked;
      if(currentRep && String(currentRep.id)===String(r.id)) currentRep = r;
      queueSave(); toast(r.isSuperAdmin ? esc(r.name)+' is now a Super Admin' : esc(r.name)+' is no longer a Super Admin'); render();
    };
  });
}

/* --------------------------------- reps / login ------------------------------------------- */

async function ensureRepsSeeded(){
  // Critical guard: only seed a fresh rep roster after a load that actually
  // succeeded. Seeding on a failed load (DB silently reset to empty) is
  // exactly what caused repeated duplicate rep batches in the past — a
  // transient network/deployment hiccup should never create new data.
  if(!lastLoadSucceeded) return;
  if(DB.reps && DB.reps.length) return;
  DB.reps = REPS_SEED.map(r=>({ id: nextId(), createdAt: new Date().toISOString(), ...r }));
  try{
    for(const rep of DB.reps){ await apiUpsert('Reps', rep); }
    lastSyncedIds.reps = new Set(DB.reps.map(r=>r.id));
  }catch(e){
    toast('Could not save the rep roster to Google Sheets.', true);
  }
}

function showLoginModal(){
  const reps = (DB.reps||[]).slice().sort((a,b)=>a.repNumber-b.repNumber);
  openModal('Log In \u2014 Pedison USA Platform', `
    <p style="margin-top:0;font-size:12px;color:var(--grey);">Select your rep number and enter your PIN. This identifies who's logging calls and notes, and drives your individual KPI dashboard.</p>
    <div class="field"><label>Rep</label><select id="login_rep">${reps.map(r=>`<option value="${r.id}">#${r.repNumber} \u2014 ${esc(r.name)}</option>`).join('')}</select></div>
    <div class="field"><label>PIN</label><input type="text" id="login_pin" placeholder="Enter your PIN" autocomplete="off"></div>
    <div id="login_error" style="color:var(--red);font-size:11px;display:none;">Incorrect PIN \u2014 try again.</div>
  `, `<button class="btn" id="loginBtn">Log In</button>`, true);

  document.getElementById('loginBtn').onclick = ()=>{
    const repId = document.getElementById('login_rep').value;
    const pin = document.getElementById('login_pin').value.trim();
    const rep = DB.reps.find(r=>String(r.id)===String(repId));
    if(!rep || String(rep.pin).trim() !== String(pin).trim()){
      console.warn('Login mismatch \u2014 stored PIN for this rep (from the Sheet, as loaded):', JSON.stringify(rep ? rep.pin : undefined), 'typeof:', rep ? typeof rep.pin : 'n/a', '| you typed:', JSON.stringify(pin));
      document.getElementById('login_error').style.display = 'block';
      return;
    }
    currentRep = rep;
    modalLocked = false;
    leadsRepTab = 'live'; // always land on the Live Leads Window after logging in
    liveLeadsWindowSize = LIVE_LEADS_CAP;
    closeModal();
    render();
  };
  document.getElementById('login_pin').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginBtn').click(); });
}

function switchUser(){
  currentRep = null;
  showLoginModal();
}

/* --------------------------------- boot ------------------------------------------- */

(async function init(){
  await loadDB();
  if(!lastLoadSucceeded){
    document.getElementById('mainArea').innerHTML = `
      <div class="box" style="max-width:520px;margin:60px auto;text-align:center;">
        <h3 style="color:var(--red);">Could not load data from Google Sheets</h3>
        <p style="color:var(--grey);font-size:12px;">This usually means the Web App URL, API secret, or a sheet tab is missing or out of date. Nothing has been changed \u2014 it's safe to just reload once the connection is fixed.</p>
        <button class="btn" onclick="location.reload()">Reload</button>
      </div>`;
    return;
  }
  await ensureRepsSeeded();
  render();
  showLoginModal();
})();
</script>
